name: Veřejný rozvrh (schedule.json)

# Regeneruje veřejný feed rozvrhu stavění (profil + datum + stěna) z databáze.
# Bez push triggeru → nevzniká smyčka z vlastního commitu.
on:
  schedule:
    - cron: '17 * * * *'   # každou hodinu (best-effort dle GitHubu)
  workflow_dispatch: {}     # ruční spuštění tlačítkem v záložce Actions

permissions:
  contents: write

concurrency:
  group: schedule-feed
  cancel-in-progress: false   # běhy serializuj, neruš (jinak chodí falešné "cancelled")

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vygeneruj schedule.json z databáze
        run: python3 scripts/build_schedule_feed.py
      - name: Commit + push, jen když se feed změnil
        run: |
          if git diff --quiet -- schedule.json; then
            echo "Žádná změna rozvrhu, nic necommituji."
          else
            git config user.name  "schedule-feed-bot"
            git config user.email "actions@users.noreply.github.com"
            git add schedule.json
            git commit -m "chore: aktualizace veřejného rozvrhu schedule.json"
            # odolné vůči souběžnému commitu: rebase + pár pokusů
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push && exit 0
              echo "push se nezdařil, pokus $i"
            done
            echo "push se opakovaně nezdařil"; exit 1
          fi
