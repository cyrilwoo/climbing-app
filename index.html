      // ── Statistics ────────────────────────────────────────────────────────
      function computeStats() {
        const now = new Date();
        const thisYear  = now.getFullYear();
        const thisMonth = now.getMonth(); // 0-indexed
        const stats = {};
        // Seed z `team`, ne z TEAM: hosté jsou v `team` navíc, a protože se
        // v tally() zahazuje každé jméno, které tu nemá kolonku, měl host
        // v tabulce napořád nuly, ať stavěl kolikrát chtěl.
        withCoreTeam(team).forEach(n => { stats[n] = { month: 0, year: 0, lanoMonth: 0, lanoYear: 0 }; });

        function countWeek(wd, defaultMonDate, calEntry) {
          const effectiveMon = wd.monDateOverride ? new Date(wd.monDateOverride + 'T12:00:00') : addDays(defaultMonDate, lanovkaOffset(defaultMonDate));
          const effWedSector = effSector('wed', weekKey(defaultMonDate), data, rotationShifts)?.sector;
          const wOff = limitOffset(defaultMonDate, effWedSector);
          const effectiveWed = wd.wedDateOverride ? new Date(wd.wedDateOverride + 'T12:00:00') : addDays(defaultMonDate, wOff);
          function tally(name, date) {
            if (!name || !stats[name]) return;
            if (date.getFullYear() === thisYear) {
              stats[name].year++;
              if (date.getMonth() === thisMonth) stats[name].month++;
            }
          }
          function tallyLano(name, date) {
            if (!name || !stats[name]) return;
            if (date.getFullYear() === thisYear) {
              stats[name].lanoYear++;
              if (date.getMonth() === thisMonth) stats[name].lanoMonth++;
            }
          }
          (wd.monday || []).forEach(s => tally(s, effectiveMon));
          tallyLano(wd.mondayLano, effectiveMon);  // lano zvlášť
          (wd.wednesday || []).forEach(s => tally(s, effectiveWed));
          const effectiveThu = wd.thuDateOverride ? new Date(wd.thuDateOverride + 'T12:00:00') : addDays(defaultMonDate, gymOffset(defaultMonDate));
          (wd.thursday || []).forEach(s => tally(s, effectiveThu));
        }

        // All weeks from CAL — only count weeks where user has explicitly saved data
        // (initWeek adds Cyril as default setter which would inflate his stats)
        Object.keys(CAL).forEach(k => {
          if (!data[k]) return;
          const [y, m, d] = k.split('-').map(Number);
          const monDate = new Date(y, m-1, d);
          countWeek(data[k], monDate, CAL[k]);
        });
        // Any user-edited weeks outside CAL
        Object.keys(data).forEach(k => {
          if (!CAL[k]) {
            const [y, m, d] = k.split('-').map(Number);
            countWeek(data[k], new Date(y, m-1, d), null);
          }
        });
        // Závody — počítáme stavěče do roční/měsíční statistiky (závod + dostavba)
        const tallyRaceSetters = (setters, raceDate) => {
          (setters || []).forEach(name => {
            if (!name || !stats[name]) return;
            if (raceDate.getFullYear() === thisYear) {
              stats[name].year++;
              if (raceDate.getMonth() === thisMonth) stats[name].month++;
            }
          });
        };
        Object.values(races || {}).forEach(race => {
          if (!race?.date) return;
          tallyRaceSetters(race.setters, new Date(race.date + 'T12:00:00'));
          (race.dostavba || []).forEach(day => {
            if (!day?.date) return;
            tallyRaceSetters(day.setters, new Date(day.date + 'T12:00:00'));
          });
        });
        // Extra stavění — stejně jako běžné stavění (lano zvlášť do lano statistiky)
        const tallyLanoSetters = (setters, date) => {
          if (date.getFullYear() !== thisYear) return;
          (setters || []).forEach(name => {
            if (!name || !stats[name]) return;
            stats[name].lanoYear++;
            if (date.getMonth() === thisMonth) stats[name].lanoMonth++;
          });
        };
        Object.values(extras || {}).forEach(ex => {
          if (!ex?.date) return;
          const d = new Date(ex.date + 'T12:00:00');
          const exSetters = (ex.setters || []).slice(0, ex.slotCount || 0);
          if (extraSlotsAreLano(ex)) tallyLanoSetters(exSetters, d);
          else tallyRaceSetters(exSetters, d);
          if (extraHasLanoSlot(ex) && ex.lanoSetter && stats[ex.lanoSetter] && d.getFullYear() === thisYear) {
            stats[ex.lanoSetter].lanoYear++;
            if (d.getMonth() === thisMonth) stats[ex.lanoSetter].lanoMonth++;
          }
        });
        return stats;
      }

      // ── Rozpad stavění po měsících a stěnách — podklad pro detail statistik.
      //
      //  Čte ze STEJNÝCH zdrojů a stejnými pravidly jako computeStats() (včetně
      //  posunů dnů a override datumů a toho, že se berou jen týdny skutečně
      //  uložené v `data` — jinak by se Cyrilovi napočítal default z initWeek).
      //  Jediný rozdíl: neptá se „letos / tento měsíc", ale na konkrétní měsíce,
      //  takže umí i minulost a plán dopředu.
      //
      //  `mesice` = [{ year, month }], klíč do výsledku je `${year}-${month}`.
      function computeMonthlyVenueStats(mesice, jmena) {
        const klicMesice = d => `${d.getFullYear()}-${d.getMonth()}`;
        const chtene = new Set(mesice.map(m => `${m.year}-${m.month}`));
        const stats = {};
        jmena.forEach(n => {
          stats[n] = {};
          mesice.forEach(m => {
            stats[n][`${m.year}-${m.month}`] = { lanovka: 0, lano: 0, limit: 0, telocvicna: 0 };
          });
        });
        const pricti = (name, date, stena) => {
          if (!name || !stats[name]) return;
          const k = klicMesice(date);
          if (!chtene.has(k)) return;
          stats[name][k][stena]++;
        };

        function countWeek(wd, defaultMonDate) {
          const effectiveMon = wd.monDateOverride ? new Date(wd.monDateOverride + 'T12:00:00') : addDays(defaultMonDate, lanovkaOffset(defaultMonDate));
          const effWedSector = effSector('wed', weekKey(defaultMonDate), data, rotationShifts)?.sector;
          const effectiveWed = wd.wedDateOverride ? new Date(wd.wedDateOverride + 'T12:00:00') : addDays(defaultMonDate, limitOffset(defaultMonDate, effWedSector));
          const effectiveThu = wd.thuDateOverride ? new Date(wd.thuDateOverride + 'T12:00:00') : addDays(defaultMonDate, gymOffset(defaultMonDate));
          (wd.monday || []).forEach(n => pricti(n, effectiveMon, 'lanovka'));
          pricti(wd.mondayLano, effectiveMon, 'lano');
          (wd.wednesday || []).forEach(n => pricti(n, effectiveWed, 'limit'));
          (wd.thursday || []).forEach(n => pricti(n, effectiveThu, 'telocvicna'));
        }

        Object.keys(CAL).forEach(k => {
          if (!data[k]) return;
          const [y, m, d] = k.split('-').map(Number);
          countWeek(data[k], new Date(y, m-1, d));
        });
        Object.keys(data).forEach(k => {
          if (CAL[k]) return;
          const [y, m, d] = k.split('-').map(Number);
          countWeek(data[k], new Date(y, m-1, d));
        });

        // Závody jsou vždy na Limitu (v týdenních položkách mají venue 'wed').
        Object.values(races || {}).forEach(race => {
          if (!race?.date) return;
          const d = new Date(race.date + 'T12:00:00');
          (race.setters || []).forEach(n => pricti(n, d, 'limit'));
          (race.dostavba || []).forEach(day => {
            if (!day?.date) return;
            const dd = new Date(day.date + 'T12:00:00');
            (day.setters || []).forEach(n => pricti(n, dd, 'limit'));
          });
        });

        // Extra stavění — stěna podle ex.venue, lano zvlášť stejně jako jinde.
        Object.values(extras || {}).forEach(ex => {
          if (!ex?.date) return;
          const d = new Date(ex.date + 'T12:00:00');
          const exSetters = (ex.setters || []).slice(0, ex.slotCount || 0);
          if (ex.venue === 'lanovka') {
            const stena = extraSlotsAreLano(ex) ? 'lano' : 'lanovka';
            exSetters.forEach(n => pricti(n, d, stena));
            if (extraHasLanoSlot(ex)) pricti(ex.lanoSetter, d, 'lano');
          } else {
            exSetters.forEach(n => pricti(n, d, 'limit'));
          }
        });

        return stats;
      }

      function computeRemovalStats() {
        const now = new Date();
        const thisYear  = now.getFullYear();
        const thisMonth = now.getMonth();
        const stats = {};
        REMOVAL_TEAM.forEach(n => { stats[n] = { sundMonth: 0, sundYear: 0, mytiMonth: 0, mytiYear: 0 }; });
        function tally(name, date, field) {
          if (!name || !stats[name]) return;
          if (date.getFullYear() === thisYear) {
            stats[name][field + 'Year']++;
            if (date.getMonth() === thisMonth) stats[name][field + 'Month']++;
          }
        }
        // Only count weeks where user has saved data (same reason as computeStats)
        const allKeys = new Set(Object.keys(data));
        allKeys.forEach(k => {
          const [y, m, d] = k.split('-').map(Number);
          const monBase = new Date(y, m-1, d);  // pondělí týdne (week start)
          const wd = data[k];
          const effWedSector = effSector('wed', k, data, rotationShifts)?.sector;
          const wOff = limitOffset(monBase, effWedSector);
          const wedDate = wd.wedDateOverride ? new Date(wd.wedDateOverride + 'T12:00:00') : addDays(monBase, wOff);
          const lanDate = wd.monDateOverride ? new Date(wd.monDateOverride + 'T12:00:00') : addDays(monBase, lanovkaOffset(monBase));
          const sundMon = addDays(lanDate, -1);
          const sundWed = addDays(wedDate, -1);
          (wd.mondaySundavaci || []).forEach(n => tally(n, sundMon, 'sund'));
          tally(wd.mondayMyti, sundMon, 'myti');
          (wd.wednesdaySundavaci || []).forEach(n => tally(n, sundWed, 'sund'));
          tally(wd.wednesdayMyti, sundWed, 'myti');
        });
        // Závody — sundavání den před závodem
        Object.values(races || {}).forEach(race => {
          if (!race?.date) return;
          const sundDate = addDays(new Date(race.date + 'T12:00:00'), -1);
          (race.sundavaci || []).forEach(n => tally(n, sundDate, 'sund'));
          tally(race.myti, sundDate, 'myti');
        });
        return stats;
      }

      const isNow = offset === 0;

      // ── Náhled: přehled pro přihlášeného stavěče (jen čtení, nic nezapisuje) ──
      const todayIso = toIso(new Date());
      // pořadí podle dne; při shodě Lanovka → Limit → Tělocvična
      const WALL_RANK = w => ({ Lanovka: 0, Limit: 1, 'Tělocvična': 2 }[w] ?? 3);
      const sameDayFirst = (a, b) => toIso(a.date).localeCompare(toIso(b.date)) || WALL_RANK(a.wall) - WALL_RANK(b.wall);
      const aheadViews = [0, 1, 2, 3, 4, 5, 6, 7].map(i => ({ i, v: i === offset ? curView : buildWeekView(i) }));
      // stavění, volné týdny a sundávání z daných týdnů; keepPast = i proběhlé (okno Obsazenosti jede s rolováním i do minulosti)
      const collectWeeks = (views, keepPast) => {
      const builds = [], offWeeks = [];
      const gone = d => !keepPast && toIso(d) < todayIso;
      views.forEach(({ i, v }) => {
        // movedFrom = standardní den, když se staví jinak (stejná logika jako karta dne)
        const moved = (date, bases) => { const b = (bases || []).filter(Boolean);
          return b.length && !b.some(x => x.toDateString() === date.toDateString()) ? b[0] : null; };
        const push = (wall, theme, date, sector, setters, total, extra) => {
          if (!sector || !date || gone(date)) return;
          const list = (setters || []).slice(0, total);
          builds.push({ i, v, wall, theme, date, sector, setters: list, total, free: total - list.filter(Boolean).length,
            target: { Lanovka: 'lanovka', Limit: 'limit', 'Tělocvična': 'telocvicna' }[wall], ...extra });
        };
        const slotsOf = (arr, n) => Array.from({ length: n }, (_, k) => (arr || [])[k] ?? null);
        if (v.calMon && !v.calMon.isOff && v.calMon.sector && !v.monReplacement) {
          const n = capMon(v.week, v.calMon.sector);
          const lano = lanoOn(v.monday, v.week) ? [v.week.mondayLano ?? null] : [];
          push('Lanovka', 'yellow', v.monDate, v.calMon.sector, [...(v.week.monday || []).slice(0, n), ...lano], n + lano.length,
            { session: 'monday', regular: slotsOf(v.week.monday, n), lanoName: lano.length ? lano[0] : undefined,
              movedFrom: moved(v.monDate, v.monBaseDates), setDate: v.setMonDate });
        }
        if (v.calWed && !v.calWed.isOff && v.calWed.sector && !v.wedReplacement) {
          const n = capWed(v.week, v.calWed.sector);
          push('Limit', 'dark', v.wedDate, v.calWed.sector, v.week.wednesday, n,
            { session: 'wednesday', regular: slotsOf(v.week.wednesday, n), movedFrom: moved(v.wedDate, v.wedBaseDates), setDate: v.setWedDate });
        }
        if (v.calThu && !v.calThu.isOff && v.calThu.sector)
          push('Tělocvična', 'green', v.thuDate, v.calThu.sector, v.week.thursday, capThu(v.week),
            { session: 'thursday', regular: slotsOf(v.week.thursday, capThu(v.week)), movedFrom: moved(v.thuDate, v.thuBaseDates), setDate: v.setThuDate });
        // volný týden (stěna se ten týden nestaví) — pro „Obsazenost dopředu" a karty
        [[v.calMon, v.monDate, 'Lanovka', 'yellow'], [v.calWed, v.wedDate, 'Limit', 'dark']].forEach(([c, d, wall, theme]) => {
          if (c?.isOff && d && !gone(d)) offWeeks.push({ i, v, wall, theme, date: d, sector: c.sector, off: true, target: wall === 'Lanovka' ? 'lanovka' : 'limit' });
        });
      });
      builds.sort(sameDayFirst);
      // Sundávání a mytí na příštích 8 týdnů (den před stavěním Lanovky a Limitu)
      const sunds = [];
      views.forEach(({ i, v }) => {
        [[v.calMon, v.monReplacement, v.monDate, v.week.mondaySundavaci, v.week.mondayMyti, 'Lanovka', 'yellow', 'lanovka'],
         [v.calWed, v.wedReplacement, v.wedDate, v.week.wednesdaySundavaci, v.week.wednesdayMyti, 'Limit', 'dark', 'limit']].forEach(([c, r, d, sund, myti, wall, theme, target]) => {
          if (r || !c || c.isOff || !c.sector || !d) return;
          const date = addDays(d, -1);
          if (gone(date)) return;
          sunds.push({ i, v, wall, theme, target, date, buildDate: d, names: sund || [], myti: myti || null, sector: c.sector,
            session: target === 'lanovka' ? 'monday' : 'wednesday' });
        });
      });
      sunds.sort(sameDayFirst);
      return { builds, offWeeks, sunds };
      };
      const { builds, offWeeks, sunds } = collectWeeks(aheadViews, false);
      const mySunds = me ? sunds.filter(x => x.names.includes(me) || x.myti === me) : [];
      const noMyti = sunds.filter(x => !x.myti);
      const RoleSeg = ({ wide }) => (
        <div className={`grid grid-cols-3 gap-1 p-1 rounded-ctl bg-white/[0.03] ${wide ? 'lg:min-w-[19rem]' : ''}`} role="group" aria-label="Role">
          {[['stavba', 'Stavění'], ['sund', 'Sundávání'], ['oboje', 'Oboje']].map(([r, l]) => (
            <button key={r} onClick={() => { setRole(r); setDetail(null); setSel(null); }} aria-pressed={role === r}
              className={`px-1 py-2 rounded-ctl text-xs whitespace-nowrap transition-colors ${role === r ? 'bg-brand-surface-2 text-brand-text font-semibold ring-1 ring-inset ring-brand-accent/70' : 'text-brand-muted hover:text-brand-text'}`}>{l}</button>
          ))}
        </div>
      );
      const myBuilds = me ? builds.filter(b => b.setters.includes(me)) : [];
      const freeBuilds = builds.filter(b => b.free > 0);
      const openBuild = (i, target) => {
        setRole('stavba'); goWeek(i, target);
        if (!isDesk) setTimeout(() => document.getElementById(`col-${weekKey(addDays(getMonday(new Date()), i * 7))}-${target}`)?.scrollIntoView({ behavior: 'smooth', block: 'start' }), 120);
      };
      const goWeek = (i, target, part = 'build') => { setOffset(i); setView('tyden'); if (isDesk && target) setDetail({ target, part, wk: i }); };
      // Volné místo: skok na týden a rovnou vybrané vlastní jméno → stačí ťuknout na slot (vzor Daylish)
      const claim = (i, target) => { goWeek(i, target); if (me && team.includes(me)) setSel(me);
        setTimeout(() => document.getElementById('tyden-board')?.scrollIntoView({ behavior: 'smooth', block: 'start' }), 60); };

      // ── Týden jako tabulka stěny × dny (vzor Wrike Workload) — jen čtení ──
      // mřížka jednoho týdne (stěny × dny) — stejná pro aktuální týden i pro další týdny pod ním
      const weekGrid = v => {
        const { monday, calMon, calWed, calThu, week, monDate, wedDate, thuDate, monReplacement, wedReplacement, toggleMyti, toggleSundavac } = v;
        const gridDays = Array.from({ length: 7 }, (_, d) => addDays(monday, d));
        const wkLo = toIso(gridDays[0]), wkHi = toIso(gridDays[6]);
        const gridItems = [];  // { row, day (0–6), title, sub, filled, total, names, off, target, theme }
        const dayIdx = d => Math.round((new Date(toIso(d) + 'T12:00:00') - new Date(wkLo + 'T12:00:00')) / 86400000);
        const replItem = (row, theme, repl, target) => {
          const isRace = repl.kind === 'race';
          const total = isRace ? (repl.race.slotCount || 0) : (repl.day.slotCount || 0);
          const names = (isRace ? repl.race.setters : repl.day.setters || []).slice(0, total);
          gridItems.push({ row, theme, day: dayIdx(new Date((isRace ? repl.race.date : repl.day.date) + 'T12:00:00')),
            title: repl.race.name || (isRace ? 'Závod' : 'Dostavba'), sub: isRace ? 'závod' : 'dostavba',
            filled: names.filter(Boolean).length, total, names: names.filter(Boolean), target });
        };
        if (monReplacement) replItem('lanovka', 'yellow', monReplacement, 'lanovka');
        else if (calMon?.sector) {
          const n = calMon.isOff ? 0 : capMon(week, calMon.sector);
          const lano = !calMon.isOff && lanoOn(monday, week) ? [week.mondayLano ?? null] : [];
          const names = [...(week.monday || []).slice(0, n), ...lano];
          // rows = očíslované sloty do bloku (L = lano), prázdné se nevypisují — ukáže je „x volné"
          const rows = [...(week.monday || []).slice(0, n).map((nm, i) => [i + 1, nm]).filter(r => r[1]), ...lano.map(nm => ['L', nm ?? null])];
          gridItems.push({ row: 'lanovka', theme: 'yellow', day: dayIdx(monDate), title: calMon.sector, off: !!calMon.isOff, rows,
            filled: names.filter(Boolean).length, total: n + lano.length, names: names.filter(Boolean), target: 'lanovka' });
        }
        if (wedReplacement) replItem('limit', 'dark', wedReplacement, 'limit');
        else if (calWed?.sector) {
          const n = calWed.isOff ? 0 : capWed(week, calWed.sector);
          const names = (week.wednesday || []).slice(0, n);
          gridItems.push({ row: 'limit', theme: 'dark', day: dayIdx(wedDate), title: calWed.sector, off: !!calWed.isOff,
            rows: names.map((nm, i) => [i + 1, nm]).filter(r => r[1]),
            filled: names.filter(Boolean).length, total: n, names: names.filter(Boolean), target: 'limit' });
        }
        if (calThu?.sector) {
          const names = calThu.isOff ? [] : (week.thursday || []).slice(0, capThu(week));
          gridItems.push({ row: 'telocvicna', theme: 'green', day: dayIdx(thuDate), title: calThu.sector, off: !!calThu.isOff,
            rows: names.map((nm, i) => [i + 1, nm]).filter(r => r[1]),
            filled: names.filter(Boolean).length, total: calThu.isOff ? 0 : capThu(week), names: names.filter(Boolean), target: 'telocvicna' });
        }
        // sundávání (den před stavěním) — šrafovaně, není to stavění
        [[calMon, monReplacement, monDate, week.mondaySundavaci, week.mondayMyti, 'yellow', 'lanovka'],
         [calWed, wedReplacement, wedDate, week.wednesdaySundavaci, week.wednesdayMyti, 'dark', 'limit']].forEach(([c, r, d, sund, myti, theme, target]) => {
          if (r || !c || c.isOff || !c.sector) return;
          const names = [...(sund || []), ...(myti ? [myti + ' (mytí)'] : [])];
          const session = target === 'lanovka' ? 'monday' : 'wednesday';
          gridItems.push({ row: 'sund', theme, day: dayIdx(addDays(d, -1)), title: 'Sundávání', hatch: true, next: c.sector,
            filled: (sund || []).length, total: null, names, target,
            drop: n => (n === 'Terezka' ? toggleMyti(session, n) : toggleSundavac(session, n)) });
        });
        // extra stavění + závody, které nenahrazují standardní kartu
        Object.entries(extras || {}).forEach(([id, ex]) => {
          if (!ex?.date || ex.date < wkLo || ex.date > wkHi) return;
          const n = ex.slotCount || 0, lano = extraHasLanoSlot(ex) ? 1 : 0;
          const names = [...(ex.setters || []).slice(0, n), ...(lano ? [ex.lanoSetter ?? null] : [])];
          gridItems.push({ row: 'extra', theme: ex.venue === 'lanovka' ? 'yellow' : 'dark', day: dayIdx(new Date(ex.date + 'T12:00:00')),
            title: ex.name || [...(ex.sectors || []), ...(ex.lano ? ['Lano'] : [])].join(', ') || 'Extra', sub: 'extra · ' + (ex.venue === 'lanovka' ? 'Lanovka' : 'Limit'),
            filled: names.filter(Boolean).length, total: n + lano, names: names.filter(Boolean), target: ex.venue });
        });
        // sundávání před závodem (den předem) — v tabulce jen v roli Sundávání
        const raceSund = (race, target, theme) => {
          if (!race?.date) return;
          const d = addDays(new Date(race.date + 'T12:00:00'), -1);
          if (toIso(d) < wkLo || toIso(d) > wkHi) return;
          const names = [...(race.sundavaci || []), ...(race.myti ? [race.myti + ' (mytí)'] : [])];
          gridItems.push({ row: 'sund', theme, day: dayIdx(d), title: 'Sundávání', sub: race.name || 'závod', next: race.name || 'Závod', hatch: true,
            filled: (race.sundavaci || []).length, total: null, names, target,
            drop: n => (n === 'Terezka' ? toggleRaceMyti(race.date, n) : toggleRaceSundavac(race.date, n)) });
        };
        if (monReplacement?.kind === 'race') raceSund(monReplacement.race, 'lanovka', 'dark');
        if (wedReplacement?.kind === 'race') raceSund(wedReplacement.race, 'limit', 'dark');
        const usedRepl = new Set([monReplacement, wedReplacement].filter(Boolean).map(r => r.kind + (r.kind === 'race' ? r.race.date : r.day.date)));
        Object.values(races || {}).forEach(race => {
          const items = [{ kind: 'race', race, date: race?.date }, ...((race?.dostavba || []).map((day, dIdx) => ({ kind: 'dostavba', race, day, date: day?.date })))];
          items.forEach(it => {
            if (it.kind === 'race' && !usedRepl.has('race' + it.date)) raceSund(race, 'race-' + race.date, 'dark');
            if (!it.date || it.date < wkLo || it.date > wkHi || usedRepl.has(it.kind + it.date)) return;
            replItem('extra', 'dark', it, it.kind === 'race' ? 'race-' + it.race.date : 'dost-' + it.race.date + '-' + it.day.date);
          });
        });
        // Pořadí jako v Rise: celodenní pás (závody a extra) nahoře, pod ním stěny, dole sundávání.
        const GRID_ROWS = [['extra', 'Závody a extra', null, '3.25rem'], ['lanovka', 'Lanovka', 'yellow', '10.5rem'], ['limit', 'Limit', 'dark', '11.5rem'],
                           ['telocvicna', 'Tělocvična', 'green', '8.5rem'], ['sund', 'Sundávání', null, '9rem']]
          .filter(([r]) => r !== 'telocvicna' || gridItems.some(it => it.row === r))
          .filter(([r]) => (role === 'sund' ? r === 'sund' : role === 'stavba' ? r !== 'sund' : true))
          .map(r => (role === 'sund' ? [r[0], 'Sundávání', null, '16rem'] : r))
          .sort((a, b) => (role === 'oboje' ? (a[0] === 'sund' ? -1 : b[0] === 'sund' ? 1 : 0) : 0));
        return { monday, week, gridDays, gridItems, GRID_ROWS };
      };
      const curGrid = weekGrid(curView);
      const { gridDays, gridItems, GRID_ROWS } = curGrid;
      const detailOpen = isDesk && view === 'tyden' && detail && detail.wk === offset ? detail : null;
      const openDetail = it => {
        if (!it.target) return;
        const part = it.row === 'sund' ? 'sund' : 'build';
        setDetail(d => (d && d.wk === offset && d.target === it.target && d.part === part ? null : { target: it.target, part, wk: offset }));
      };
      const jumpTo = target => {
        const id = target ? `col-${key}-${target}` : null;

        if (id) { setFlashCol(id); setTimeout(() => setFlashCol(c => (c === id ? null : c)), 1600); }
      };

      // klik na blok v dalším týdnu: ten týden se stane aktuálním a otevře se jeho detail
      const openLater = (it, wk) => {
        if (!it.target) return;
        setOffset(wk); setDetail({ target: it.target, part: it.row === 'sund' ? 'sund' : 'build', wk });
      };
      const GRID_COLS = '7.5rem repeat(7, minmax(0, 1fr))';
      const weekRange = d0 => { const d6 = addDays(d0, 6); return `${d0.getDate()}.${d0.getMonth() !== d6.getMonth() ? ` ${d0.getMonth() + 1}.` : ''}–${d6.getDate()}. ${d6.getMonth() + 1}.`; };
      // přilepená hlavička se dny aktuálního týdne (mění se plynule podle rolování)
      const renderDayHead = g => {
        const { gridDays, gridItems } = g;
        return (
        <div id="tyden-dayhead" className="sticky z-20 grid h-14 bg-brand-bg border-b border-brand-border" style={{ top: hdrH + occH, gridTemplateColumns: GRID_COLS }}>
          <div key={'r' + offset} className="px-3.5 flex items-center text-[13px] font-semibold text-brand-text tnum border-r border-brand-border animate-fade">{weekRange(gridDays[0])}</div>
          {gridDays.map((d, di) => {
            const its = role === 'sund' ? [] : gridItems.filter(it => it.day === di && it.total);
            const f = its.reduce((a, it) => a + it.filled, 0), t = its.reduce((a, it) => a + it.total, 0);
            const isToday = toIso(d) === todayIso;

            return (
              <div key={offset + ':' + di} className={`px-2 border-r border-brand-border last:border-r-0 flex flex-col items-center justify-center animate-fade ${di >= 5 ? 'bg-black/10' : ''}`}>

                    <span className={`text-[11px] font-semibold tnum ${f === t ? 'text-brand-muted' : soon ? 'text-bad' : 'text-brand-accent-lite'}`}

                </div>
                {hn && <div className={`text-[10px] font-semibold truncate max-w-full ${hn.isState ? 'text-bad' : 'text-brand-muted'}`} title={hn.text}>{hn.text}</div>}
              </div>
            );
          })}
        </div>
        );
      };
      const renderWeekGrid = (g, wk, cur) => {

        return (
        <div className="grid" style={{ gridTemplateColumns: GRID_COLS,
          gridTemplateRows: ['1.75rem', ...GRID_ROWS.map(r => (used.has(r[0]) ? `minmax(${r[3]}, auto)` : '2.25rem'))].join(' ') }}>
          {/* tenký oddělovač týdne: datum a čísla dnů */}
          <div className="px-3.5 flex items-center text-[11px] font-semibold text-brand-muted tnum border-b border-r border-brand-border bg-white/[0.02]">{weekRange(gridDays[0])}</div>
          {gridDays.map((d, di) => (
            <div key={di} className={`flex items-center justify-center text-[11px] tnum border-b border-r border-brand-border last:border-r-0 bg-white/[0.02] ${toIso(d) === todayIso ? 'text-brand-accent-lite font-bold' : 'text-brand-muted'}`}>{d.getDate()}. {d.getMonth() + 1}.</div>
          ))}
          {/* řádky: popisek vlevo místo časové osy, pod ním bloky v buňkách dnů */}
          {GRID_ROWS.map(([row, label, theme], ri) => (

                {theme

                  : <span className="block text-[11px] leading-tight text-brand-muted">{label}</span>}
                {row === 'lanovka' && lanoOn(g.monday, g.week) && <span className="block mt-1 text-[11px] text-brand-muted">+ lano</span>}
              </div>

                const its = gridItems.filter(it => it.row === row && it.day === di);
                return (
                  <div key={di} onClick={e => { if (cur && e.target === e.currentTarget) setDetail(null); }}
                    className={`p-1.5 flex flex-col gap-1.5 border-r border-brand-border last:border-r-0 ${ri < GRID_ROWS.length - 1 ? 'border-b' : ''} ${di >= 5 ? 'bg-black/10' : ''}`}>
                    {its.map((it, k) => {
                      const vu = venueUi(it.theme);
                      const part = row === 'sund' ? 'sund' : 'build';
                      const open = cur && detailOpen && detailOpen.target === it.target && detailOpen.part === part;
                      const gap = it.total && it.filled < it.total;
                      const sund = row === 'sund', strip = row === 'extra';

                            <span>{sund ? `${it.title} ${it.theme === 'yellow' ? 'Lanovka' : 'Limit'}` : it.title}</span>
                          </span>
                          {!sund && !strip && changeTag(weekKey(g.monday), it.target) && (

                          )}

                          {both && sd ? <div className="opacity-[0.82]"><NeedRow o={o} sund /></div> : <NeedRow o={o} sund={sd} />}
                        </React.Fragment>
                      ); })}
                    {list.length === 0 && thanks.length === 0 && (mineFree.length
                      // volná místa jsou jen tam, kde už jsi zapsaný → nepsat „všude plno" (Cyril 8. 11.)
                      ? <p className="text-[15px] text-brand-muted py-6">Volná místa zbývají jen tam, kde už jsi zapsaný: {mineFree.map(b => `${b.sector} ${dShort(b.date)} ${dm(b.date)}`).join(', ')} Jinam se teď zapsat nedá.</p>
                      : <p className="text-[15px] text-brand-muted py-6">{untilTxt.replace('do', 'Do')} je všude plno. Díky.</p>)}
                  </div>
                </Sec>
              </>
            )}
          </div>
        );
      };
      const renderPanel = () => {
        const o = selObj;
        if (!o) return <p className="text-sm text-brand-muted">Vyber stavění.</p>;
        if (o.names) {
          const b = buildOf(o), filled = b ? b.setters.filter(Boolean).length : 0;
          const candS = REMOVAL_TEAM.filter(n => n !== 'Terezka' && !o.names.includes(n));
          return (
            <>
              <Vis big hex={venueUi(o.theme).hex} left={`Sundává se · ${o.wall}`} right={<span className="text-[11px] px-2 py-0.5 rounded-full bg-black/25">{dShort(o.date)} {dm(o.date)}</span>} title={o.sector} />
              <Grp t="Co a proč">{b ? <Li onClick={() => { setRole('stavba'); openB(b); }}><span className="flex-1">Sundává se kvůli stavění {dShort(b.date)} {dm(b.date)} · {filled}/{b.total} stavěčů</span><span className="text-brand-muted">→</span></Li>
                : <Li empty>Navazující stavění není.</Li>}</Grp>
              <Grp t={`Sundavači · ${o.names.length}`}><div className="flex flex-col">
                {o.names.map(n => <Li key={n}><Av n={n} />{n}{(admin || n === me) && <button onClick={() => o.v.toggleSundavac(o.session, n)} className="ml-auto text-[13px] text-brand-muted hover:text-bad">{admin ? 'Odebrat' : 'Odhlásit se'}</button>}</Li>)}
                {o.names.length === 0 && <Li empty>Zatím nikdo</Li>}</div></Grp>
              {admin && candS.length > 0 && <Grp t="Přidat sundavače"><div className="flex flex-wrap gap-1.5">{candS.map(n => <button key={n} onClick={() => o.v.toggleSundavac(o.session, n)} className={`${NAME_BTN} px-3 rounded-ctl bg-brand-surface text-brand-muted text-sm hover:text-brand-text hover:bg-brand-surface-2`}>{n}</button>)}</div></Grp>}
              <Grp t={`Mytí chytů · ${o.myti ? 1 : 0}/1`}><div className="flex flex-col">
                {o.myti ? <Li><Av n={o.myti} />{o.myti}{(admin || o.myti === me) && <button onClick={() => o.v.toggleMyti(o.session, o.myti)} className="ml-auto text-[13px] text-brand-muted hover:text-bad">{admin ? 'Odebrat' : 'Odhlásit se'}</button>}</Li> : <Li empty>Volné místo</Li>}
                {admin && !o.myti && <div className="flex flex-wrap gap-1.5 mt-1">{['Terezka', 'Kuba D.'].map(n => <button key={n} onClick={() => o.v.toggleMyti(o.session, n)} className={`${NAME_BTN} px-3 rounded-ctl bg-brand-surface text-brand-muted text-sm hover:text-brand-text hover:bg-brand-surface-2`}>{n}</button>)}</div>}
              </div></Grp>
              {(canSund && !o.names.includes(me)) || (canMyt && o.myti !== me) ? (
                <div className="flex gap-2">
                  {canSund && !o.names.includes(me) && <button onClick={() => o.v.toggleSundavac(o.session, me)} className="flex-1 py-3.5 rounded-ctl bg-brand-accent hover:bg-brand-accent-dark text-white font-bold">Sundávat</button>}
                  {canMyt && o.myti !== me && <button onClick={() => o.v.toggleMyti(o.session, me)} className="flex-1 py-3.5 rounded-ctl bg-brand-surface-2 text-brand-text font-bold">Mýt chyty</button>}
                </div>) : null}
            </>
          );
        }
        if (o.off) return (
          <>
            <Vis big full left={`${o.wall} · ${dShort(o.date)} ${dm(o.date)}`} right={<span className="text-[11px] px-2 py-0.5 rounded-full bg-black/25">nestaví se</span>} title={o.sector || 'Volný týden'} />
            <Grp t="Kdy"><Li><span className="flex-1">{dShort(o.date)} {dm(o.date)}</span></Li></Grp>
            {admin && <Grp t="Úpravy stavění"><div className="[&>div]:p-0 [&>div]:border-0">{renderAdminActions(o.target, o.v) || <p className="text-sm text-brand-muted">Volný týden podle rotace, nic k vrácení.</p>}</div></Grp>}
          </>
        );
        const b = o, filled = b.setters.filter(Boolean).length, rem = allS.find(x => x.i === b.i && x.target === b.target);
        const reason = b.movedFrom ? [stateHoliday(b.movedFrom), schoolHoliday(b.movedFrom)].filter(Boolean).join(' · ') : '';
        const cand = team.filter(n => !b.setters.includes(n) && n !== 'NEOBSADITELNÉ');
        return (
          <>
            <Vis big hex={venueUi(b.theme).hex} full={b.free === 0} left={`${b.wall} · ${dShort(b.date)} ${dm(b.date)}`} right={<span className="text-[11px] px-2 py-0.5 rounded-full bg-black/25">{b.free ? freeTxt(b.free) : 'Plno'}</span>} title={b.sector} />
            <Grp t="Kdy">
              <div className="relative">
                <Li><span className="flex-1">{dShort(b.date)} {dm(b.date)} · 7:15–15:00</span>{admin && <button onClick={() => setPanelDay(v => !v)} title="Změnit den" className="text-[13px] text-brand-muted hover:text-brand-text">Změnit den</button>}</Li>
                {panelDay && admin && (
                  <div className="mt-1.5 grid grid-cols-7 gap-1 p-1.5 rounded-ctl bg-brand-surface">
                    {Array.from({ length: 7 }, (_, k) => addDays(b.v.monday, k)).map(d => (
                      <button key={toIso(d)} onClick={() => { b.setDate(toIso(d)); setPanelDay(false); }}
                        className={`py-1 rounded-ctl text-center leading-tight ${toIso(d) === toIso(b.date) ? 'bg-brand-text text-brand-bg' : 'hover:bg-brand-surface-2'}`}>
                        <span className="block text-[9px] uppercase opacity-70">{dShort(d)}</span><span className="block text-xs font-bold">{d.getDate()}.</span></button>
                    ))}
                  </div>
                )}
              </div>
              {b.movedFrom && <p className="mt-2 text-xs text-brand-muted border-l-2 border-brand-accent pl-2">Jiný den, místo {dShort(b.movedFrom)} {dm(b.movedFrom)}{reason ? ` (${reason})` : ''}</p>}
            </Grp>
            {admin && (b.target === 'lanovka' || b.target === 'limit') && (
              <Grp t="Úpravy stavění">
                <div className="[&>div]:p-0 [&>div]:border-0">{renderAdminActions(b.target, b.v)}</div>
                <div className="flex gap-2 mt-2"><button onClick={() => setShowAddRace(true)} className={`${btn} flex-1`}>+ Přidat závod</button>
                  <button onClick={() => setShowAddExtra(true)} className={`${btn} flex-1`}>+ Extra stavění</button></div>
              </Grp>
            )}
            <Grp t={`Stavěči · ${(b.regular || []).filter(Boolean).length}/${(b.regular || []).length}`}><div className="flex flex-col">
              {(b.regular || []).map((n, k) => (n
                ? <Li key={k}><span className="w-[18px] text-xs text-brand-muted">{k + 1}</span><Av n={n} />{n}{(admin || n === me) && <button onClick={() => b.v.remove(b.session, k)} className="ml-auto text-[13px] text-brand-muted hover:text-bad">{admin ? 'Odebrat' : 'Odhlásit se'}</button>}</Li>
                : <Li key={k} empty><span className="w-[18px] text-xs">{k + 1}</span>Volné místo{admin && b.session && b.regular.length > 1 && <button onClick={() => b.v.setCapacity(b.session, 'remove', k)} title="Ubrat místo" className="ml-auto text-[13px] text-brand-muted hover:text-brand-text">✕ ubrat místo</button>}</Li>))}
              {admin && b.session && (
                <div className="flex items-center gap-4 pt-2.5 text-[13px]">
                  <button onClick={() => b.v.setCapacity(b.session, 'add')} className="text-brand-muted hover:text-brand-text">+ přidat místo</button>
                  {(b.regular || []).length !== b.v.capDefault(b.session) && <button onClick={() => b.v.setCapacity(b.session, 'reset')} className="text-brand-muted hover:text-brand-text">vrátit výchozí ({b.v.capDefault(b.session)})</button>}
                </div>
              )}
            </div></Grp>
            {b.lanoName !== undefined && (
              <Grp t="Lano">{b.lanoName ? <Li><Av n={b.lanoName} />{b.lanoName}{(admin || b.lanoName === me) && <button onClick={() => b.v.remove('mondayLano', 0)} className="ml-auto text-[13px] text-brand-muted hover:text-bad">{admin ? 'Odebrat' : 'Odhlásit se'}</button>}</Li>
                : <Li empty>Volné místo na lano{admin && <button onClick={() => b.v.setLanoCapacity(0)} title="Ubrat místo" className="ml-auto text-[13px] text-brand-muted hover:text-brand-text">✕ ubrat místo</button>}</Li>}</Grp>
            )}
            {admin && b.session === 'monday' && b.lanoName === undefined && (
              <Grp t="Lano"><Li empty>{hasLanoBuild(b.v.monday) ? 'Lano tento týden bez místa' : 'Lano se tento týden nestaví'}<button onClick={() => b.v.setLanoCapacity(1)} className="ml-auto text-[13px] text-brand-muted hover:text-brand-text">{hasLanoBuild(b.v.monday) ? '+ vrátit místo' : '+ přidat lano'}</button></Li></Grp>
            )}
            {rem && <Grp t="Den předem"><Li onClick={() => { setRole('sund'); openS(rem); }}><span className="flex-1">Sundávání {dShort(rem.date)} {dm(rem.date)} · {sundWord(rem.names.length)}, mytí {rem.myti ? '1/1' : '0/1'}</span><span className="text-brand-muted">→</span></Li></Grp>}
            {admin && b.free > 0 && cand.length > 0 && <Grp t="Přidat stavěče"><div className="flex flex-wrap gap-1.5">{cand.map(n => <button key={n} onClick={() => addTo(b, n)} className={`${NAME_BTN} px-3 rounded-ctl bg-brand-surface text-brand-muted text-sm hover:text-brand-text hover:bg-brand-surface-2`}>{n}</button>)}</div></Grp>}
            {b.free > 0 && me && team.includes(me) && !b.setters.includes(me) && (
              <button onClick={() => claimB(b)} className="w-full py-3.5 rounded-ctl bg-brand-accent hover:bg-brand-accent-dark text-white font-bold text-[15px]">Zapsat se na {dShort(b.date)} {dm(b.date)}</button>)}
          </>
        );
      };


      // ══ Závody a extra: závod jako jedna akce (dny závodu jdoucí po sobě + dostavba + sundávání) ══
      // Jen zobrazení — v datech zůstává závod po dnech (races/<datum>) i s vlastní dostavbou.
      const isoD = iso => new Date(iso + 'T12:00:00');
      const weekOff = iso => Math.round((getMonday(isoD(iso)) - getMonday(new Date())) / (7 * 86400000));
      const openInPlan = (iso, fallback, isRepl) => {
        const i = weekOff(iso), v = i === offset ? curView : buildWeekView(i);
        const t = v.monReplacement && isRepl(v.monReplacement) ? 'lanovka' : v.wedReplacement && isRepl(v.wedReplacement) ? 'limit' : fallback;
        setRole('stavba'); goWeek(i, t);
      };
      const raceGroups = (() => {
        const list = Object.values(races || {}).filter(r => r?.date).sort((a, b) => a.date.localeCompare(b.date));
        const gs = [];
        list.forEach(r => {
          const last = gs[gs.length - 1];
          if (last && (isoD(r.date) - isoD(last.races[last.races.length - 1].date)) / 86400000 <= 1) last.races.push(r);
          else gs.push({ races: [r] });
        });
        return gs.map(g => {
          const rows = [];
          const first = g.races[0];
          rows.push({ kind: 'sund', date: toIso(addDays(isoD(first.date), -1)), race: first, names: first.sundavaci || [], myti: first.myti || null });
          // další dny závodu: sundávání uložené u nich (stará appka ho ukazuje u každého dne) — jen když tam někdo je, ať nic neschováme
          g.races.slice(1).forEach(r => { if ((r.sundavaci || []).length || r.myti) rows.push({ kind: 'sund', date: toIso(addDays(isoD(r.date), -1)), race: r, names: r.sundavaci || [], myti: r.myti || null }); });
          g.races.forEach(race => {
            rows.push({ kind: 'race', date: race.date, race, total: race.slotCount || 0, setters: (race.setters || []).slice(0, race.slotCount || 0), sectors: race.sectors || [] });
            (race.dostavba || []).forEach(day => day?.date && rows.push({ kind: 'dost', date: day.date, race, day, total: day.slotCount || 0,
              setters: (day.setters || []).slice(0, day.slotCount || 0), sectors: day.sectors || [] }));
          });
          rows.sort((a, b) => a.date.localeCompare(b.date) || ({ sund: 0, race: 1, dost: 2 }[a.kind] - { sund: 0, race: 1, dost: 2 }[b.kind]));
          rows.forEach((r, k) => { r.dup = r.kind === 'dost' && rows.some((o, j) => j < k && o.kind === 'dost' && o.date === r.date); });
          const slotRows = rows.filter(r => r.kind !== 'sund');
          const total = slotRows.reduce((a, r) => a + r.total, 0), filled = slotRows.reduce((a, r) => a + r.setters.filter(Boolean).length, 0);
          const name = g.races.map(r => r.name).find(Boolean) || 'Závod bez názvu';
          const lastDate = rows[rows.length - 1].date;
          return { ...g, rows, total, filled, name, from: first.date, to: lastDate, past: lastDate < todayIso };
        });
      })();
      const extraList = Object.entries(extras || {}).map(([id, ex]) => ({ ...ex, id })).filter(ex => ex.date).sort((a, b) => a.date.localeCompare(b.date));
      const NamesTxt = ({ list, extra }) => (
        <span className="text-sm text-brand-text break-words">
          {list.length === 0 && !extra ? <span className="text-brand-muted">zatím nikdo</span> : list.map((n, j) => (
            <React.Fragment key={j}>{j ? ', ' : ''}<span className={n === me ? 'text-brand-accent-lite font-semibold' : n === 'NEOBSADITELNÉ' ? 'text-[#FDBA74]' : ''}>{n === 'NEOBSADITELNÉ' ? 'neobsaditelné' : n}</span></React.Fragment>))}
          {extra}
        </span>
      );
      // Jeden den akce: datum | typ | značky obsazenosti | jména textem | Zapsat se (jen kde je volno)
      const DayRow = ({ date, type, marks, names, free, onClaim, onOpen, note }) => {
        const d = isoD(date);
        return (
          <div onClick={onOpen || undefined}
            className={`grid grid-cols-[1fr_auto] lg:grid-cols-[7.5rem_7rem_9.5rem_1fr_auto] gap-x-4 gap-y-1.5 items-center px-4 lg:px-5 py-3 border-t border-white/5 ${onOpen ? 'cursor-pointer hover:bg-white/[0.03]' : ''}`}>
            <div className="lg:contents">
              <span className="text-sm font-semibold tnum whitespace-nowrap">{dShort(d)} {dm(d)}<span className="lg:hidden text-brand-muted font-normal"> · {type}</span></span>
              <span className="hidden lg:block text-sm text-brand-muted whitespace-nowrap">{type}{note && <span className="block text-[11px] text-[#FDBA74]">{note}</span>}</span>
            </div>
            <div className="row-span-2 lg:row-span-1 lg:order-last justify-self-end">
              {free && onClaim ? <button onClick={e => { e.stopPropagation(); onClaim(); }} className={claimBtn}>Zapsat se</button> : null}
            </div>
            <div className="lg:contents">
              <span className="flex items-center gap-2 flex-wrap lg:flex-nowrap">{marks}</span>
              <span className="min-w-0">{names}{note && <span className="lg:hidden block text-[11px] text-[#FDBA74]">{note}</span>}</span>
            </div>
          </div>
        );
      };
      const RaceGroup = ({ g }) => {
        const free = g.total - g.filled;
        const sectors = [...new Set(g.races.flatMap(r => r.sectors || []))];
        let den = 0;
        return (
          <div className={`bg-brand-surface rounded-card overflow-hidden ${g.past ? 'opacity-60' : ''}`}>
            <div className="px-4 lg:px-5 py-4 flex flex-wrap items-baseline gap-x-4 gap-y-1">
              <span className="inline-flex items-center gap-2 text-lg font-bold"><VMark theme="dark" size={12} />{g.name}<span className="text-[11px] font-semibold uppercase tracking-[0.08em] text-brand-muted ml-1">Závod</span></span>
              <span className="text-sm text-brand-muted tnum">{dShort(isoD(g.from))} {dm(isoD(g.from))} – {dShort(isoD(g.to))} {dm(isoD(g.to))}</span>
              {sectors.length > 0 && <span className="text-sm text-brand-muted">{sectors.join(', ')}</span>}
              <span className={`ml-auto text-sm font-semibold ${free ? 'text-brand-accent-lite' : 'text-brand-muted'}`}>{free ? `chybí ${free} ${free === 1 ? 'člověk' : free < 5 ? 'lidi' : 'lidí'}` : 'plno'}</span>
            </div>
            {g.rows.map((r, k) => {
              if (r.kind === 'sund') {
                const need = r.names.length === 0 || !r.myti;
                return <DayRow key={k} date={r.date} type="Sundávání"
                  marks={<><SlotMarks theme="dark" regular={r.names} /><span className="text-[11px] text-brand-muted">mytí</span><VMark theme="dark" outline={!r.myti} /></>}
                  names={<NamesTxt list={r.names} extra={r.myti ? <span className="text-brand-muted">{r.names.length ? ' · ' : ''}mytí {r.myti}</span> : null} />}
                  free={need && !g.past} onClaim={canSund && !r.names.includes(me) ? () => { toggleRaceSundavac(r.race.date, me); sayThanks('rs' + r.date, `Sundávání ${dm(isoD(r.date))} · ${g.name}`); } : null}
                  onOpen={() => openInPlan(r.race.date, 'race-' + r.race.date, x => x.kind === 'race' && x.race.date === r.race.date)} />;
              }
              const isRace = r.kind === 'race'; if (isRace) den++;
              const f = r.setters.filter(Boolean).length, padded = Array.from({ length: r.total }, (_, j) => r.setters[j] ?? null);
              const mine = padded.includes(me);
              const open = isRace ? () => openInPlan(r.race.date, 'race-' + r.race.date, x => x.kind === 'race' && x.race.date === r.race.date)
                : () => openInPlan(r.day.date, 'dost-' + r.race.date + '-' + r.day.date, x => x.kind === 'dostavba' && x.day.date === r.day.date && x.race.date === r.race.date);
              return <DayRow key={k} date={r.date} type={isRace ? `Den ${den}` : 'Dostavba'} note={r.dup ? 'druhý zápis téhož dne' : null}
                marks={<SlotMarks theme="dark" regular={padded} />} names={<NamesTxt list={padded.filter(Boolean)} />}
                free={f < r.total && !mine && !g.past} onClaim={() => { if (claimRaceDay(r)) sayThanks('r' + r.date + k, `${isRace ? `Den ${den}` : 'Dostavba'} ${dm(isoD(r.date))} · ${g.name}`); }} onOpen={open} />;
            })}
            {admin && (
              <div className="px-4 lg:px-5 py-3 border-t border-white/5 flex flex-wrap gap-3">
                {g.races.map(r => <button key={r.date} onClick={() => deleteRace(r.date)} className="text-xs text-brand-muted hover:text-bad">Smazat závod {dm(isoD(r.date))}</button>)}
              </div>
            )}
          </div>
        );
      };
      const ExtraCard2 = ({ ex }) => {
        const n = ex.slotCount || 0, lano = extraHasLanoSlot(ex);
        const padded = Array.from({ length: n }, (_, j) => (ex.setters || [])[j] ?? null);
        const total = n + (lano ? 1 : 0), filled = padded.filter(Boolean).length + (lano && ex.lanoSetter ? 1 : 0);
        const what = [...(ex.sectors || []), ...(ex.lano ? ['Lano'] : [])].join(' + ');
        const theme = ex.venue === 'lanovka' ? 'yellow' : 'dark', past = ex.date < todayIso;
        const mine = padded.includes(me) || ex.lanoSetter === me;
        return (
          <div className={`bg-brand-surface rounded-card overflow-hidden ${past ? 'opacity-60' : ''}`}>
            <div className="px-4 lg:px-5 py-4 flex flex-wrap items-baseline gap-x-4 gap-y-1">
              <span className="inline-flex items-center gap-2 text-lg font-bold"><VMark theme={theme} size={12} />{ex.name || what || 'Extra stavění'}<span className="text-[11px] font-semibold uppercase tracking-[0.08em] text-brand-muted ml-1">Extra</span></span>
              <span className="text-sm text-brand-muted tnum">{dShort(isoD(ex.date))} {dm(isoD(ex.date))} · {theme === 'yellow' ? 'Lanovka' : 'Limit'}{ex.name && what ? ` · ${what}` : ''}</span>
              <span className={`ml-auto text-sm font-semibold ${filled < total ? 'text-brand-accent-lite' : 'text-brand-muted'}`}>{filled < total ? `chybí ${total - filled}` : 'plno'}</span>
            </div>
            <DayRow date={ex.date} type="Extra" marks={<SlotMarks theme={theme} regular={padded} lano={lano ? (ex.lanoSetter || null) : undefined} />}
              names={<NamesTxt list={padded.filter(Boolean)} extra={ex.lanoSetter ? <span className="text-brand-muted">{padded.some(Boolean) ? ' · ' : ''}lano {ex.lanoSetter}</span> : null} />}
              free={filled < total && !mine && !past} onClaim={() => { if (claimExtra(ex.id)) sayThanks('x' + ex.id, `Extra ${dm(isoD(ex.date))} · ${ex.name || what}`); }}
              onOpen={() => openInPlan(ex.date, ex.venue, () => false)} />
          </div>
        );
      };
      const renderZavody = () => {
        // jeden seznam závodů i extra stavění podle prvního data (u závodu den sundávání), nejbližší nahoře; při shodě závod před extra
        const items = [...raceGroups.map(g => ({ g, d: g.rows[0].date, k: 0, past: g.past })), ...extraList.map(ex => ({ ex, d: ex.date, k: 1, past: ex.date < todayIso }))]
          .sort((a, b) => a.d.localeCompare(b.d) || a.k - b.k);
        const up = items.filter(x => !x.past), past = items.filter(x => x.past).reverse();
        const card = (x, k) => (x.g ? <RaceGroup key={'g' + k} g={x.g} /> : <ExtraCard2 key={x.ex.id} ex={x.ex} />);
        return (
          <div className="px-4 py-5 lg:px-9 lg:py-7 max-w-[90rem] mx-auto">
            <div className="flex flex-wrap items-center justify-between gap-4 mb-7">
              <div><h1 className="text-[22px] lg:text-[26px] font-bold">Závody a extra</h1>
                <p className="text-sm text-brand-muted mt-1">Závod je jeden řádek: sundávání den předem, dny závodu a dostavba. Klik na den otevře stavění.</p></div>
              {admin && <div className="flex gap-2"><button onClick={() => setShowAddRace(true)} className={claimBtn}>Přidat závod</button>
                <button onClick={() => setShowAddExtra(true)} className={btn}>Extra stavění</button></div>}
            </div>
            <Sec t="Nadcházející" right={<span className="text-[13px] text-brand-muted">{up.length} · podle data</span>}>
              {thanks.map(t => <div key={t.key} className="mb-3 rounded-card bg-brand-surface px-5 py-3.5 text-sm flex items-center gap-3 animate-fade border-l-2 border-ok"><span className="text-ok font-semibold">Zapsáno, díky.</span><span className="text-brand-muted">{t.text}</span></div>)}
              {up.length ? <div className="flex flex-col gap-6">{up.map(card)}</div>
                : <p className="text-sm text-brand-muted">Žádný nadcházející závod ani extra stavění.</p>}
            </Sec>
            {past.length > 0 && (
              <details className="mb-10">
                <summary className="cursor-pointer text-[15px] font-medium text-brand-muted mb-3.5">Proběhlé ({past.length})</summary>
                <div className="flex flex-col gap-6">{past.map(card)}</div>
              </details>
            )}
          </div>
        );
      };


      // ══ Přehled: souhrnná čísla (řada dlaždic) + tabulka lidí (vzor Runway) + obsazenost a závody ══
      const renderPrehled = () => {
        const st = computeStats(), rs = computeRemovalStats();
        const now = new Date(), mName = now.toLocaleString('cs-CZ', { month: 'long' });
        const freeSum = zBuilds.reduce((a, b) => a + b.free, 0);
        const nextRace = raceGroups.find(g => !g.past);
        const tiles = role === 'sund'
          ? [[zSunds.length, `sundávání ${untilTxt}`], [zSunds.filter(x => !x.myti).length, 'chybí mytí', () => { setZFilter('free'); setView('zapsat'); }, true],
             [mySunds.length, 'tvoje sundávání', () => setView('moje')], [REMOVAL_TEAM.reduce((a, n) => a + (rs[n]?.sundYear || 0), 0), `sundávání za rok ${now.getFullYear()}`]]
          : [[zBuilds.length, `stavění ${untilTxt}`], [freeSum, 'volných míst', () => { setZFilter('free'); setView('zapsat'); }, true],
             [myBuilds.length, 'tvoje stavění', () => setView('moje')],
             [nextRace ? nextRace.name : '–', nextRace ? `nejbližší závod · ${dm(isoD(nextRace.from))} · ${nextRace.filled}/${nextRace.total}` : 'žádný závod', () => setView('zavody')]];
        const people = role === 'sund'
          ? [...REMOVAL_TEAM].sort((a, b) => ((rs[b]?.sundYear || 0) + (rs[b]?.mytiYear || 0)) - ((rs[a]?.sundYear || 0) + (rs[a]?.mytiYear || 0)))
          : [...team].sort((a, b) => (st[b]?.year ?? 0) - (st[a]?.year ?? 0));
        const nextOf = n => role === 'sund' ? sunds.find(x => x.names.includes(n) || x.myti === n) : builds.find(b => b.setters.includes(n));
        const th = 'text-[11px] font-medium uppercase tracking-[0.08em] text-brand-muted py-2 pl-4 first:pl-0';
        return (
          <div className="px-4 py-5 lg:px-9 lg:py-7 max-w-[90rem] mx-auto">
            {statsMore && <SetterVenueModal onClose={() => setStatsMore(false)} spocitej={computeMonthlyVenueStats} jmena={team} poradi={people} />}
            <div className="flex flex-wrap items-center justify-between gap-4 mb-7">
              <div><h1 className="text-[22px] lg:text-[26px] font-bold">Přehled</h1>
                <p className="text-sm text-brand-muted mt-1">{role === 'sund' ? 'Sundávání' : 'Stavění'} · {mName} {now.getFullYear()}</p></div>
              <div className="w-full lg:w-auto"><RoleSeg wide /></div>
            </div>
            <div className="grid gap-4 grid-cols-2 lg:grid-cols-4 mb-10">
              {tiles.map(([v, l, go, hot], k) => (
                <button key={k} onClick={go || undefined} className={`bg-brand-surface rounded-card px-5 py-4 text-left ${go ? 'hover:bg-brand-surface-2' : 'cursor-default'} transition-colors min-w-0`}>
                  <b className={`block text-2xl lg:text-[28px] font-bold leading-tight truncate ${hot && v ? 'text-brand-accent-lite' : ''}`}>{v}</b>
                  <span className="block text-[13px] text-brand-muted break-words">{l}</span>
                </button>
              ))}
            </div>
            <div className="grid gap-6 lg:grid-cols-2 items-stretch">
              <section className="bg-brand-surface rounded-card p-5 min-w-0 h-full">
                <div className="flex items-baseline justify-between mb-3">
                  <h2 className="text-[15px] font-medium">{role === 'sund' ? 'Sundavači a mytí' : 'Stavěči'}</h2>
                  {showB && <button onClick={() => setStatsMore(true)} title="Kdo na které stěně staví" className="text-[13px] text-brand-muted hover:text-brand-text">Víc · po stěnách a měsících</button>}
                </div>
                <div className="overflow-x-auto">
                  <table className="w-full text-sm">
                    <thead><tr className="text-left">
                      <th className={th}>{role === 'sund' ? 'Jméno' : 'Stavěč'}</th>
                      {role === 'sund' ? <><th className={`${th} text-right`}>Sundávání</th><th className={`${th} text-right`}>Mytí</th></>
                        : <><th className={`${th} text-right capitalize`}>{mName}</th><th className={`${th} text-right`}>{now.getFullYear()}</th><th className={`${th} text-right`}>Lano</th></>}
                      <th className={`${th} pl-6 hidden sm:table-cell`}>Nejbližší</th>
                    </tr></thead>
                    <tbody>
                      {people.map(n => {
                        const s0 = role === 'sund' ? (rs[n] || {}) : (st[n] || {}), nx = nextOf(n);
                        const num = (v, hot) => <td className={`py-2.5 pl-4 text-right tnum font-semibold ${v ? (hot ? 'text-brand-accent-lite' : 'text-brand-text') : 'text-brand-border-hi'}`}>{v || 0}</td>;
                        return (
                          <tr key={n} className="border-t border-white/5">
                            <td className="py-2.5 pr-3"><NameTag n={n} /></td>
                            {role === 'sund' ? <>{num(s0.sundYear)}{num(s0.mytiYear)}</> : <>{num(s0.month, true)}{num(s0.year)}{num(s0.lanoYear)}</>}
                            <td className="py-2.5 pl-6 text-brand-muted whitespace-nowrap hidden sm:table-cell">
                              {nx ? <button onClick={() => (role === 'sund' ? openS(nx) : openB(nx), setView('zapsat'))} className="hover:text-brand-text">
                                <VMark theme={nx.theme} size={10} className="mr-1.5" />{dShort(nx.date)} {dm(nx.date)} · {nx.sector}</button> : '–'}
                            </td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
              </section>
              <div className="flex flex-col gap-6 min-w-0 [&>*:last-child]:flex-1">
                {role === 'oboje' && <RemovalStatsPanel stats={rs} />}
                {showB && <MonthlyOccupancy data={data} viewMonday={monday} rotationShifts={rotationShifts} extras={extras} />}
                {showB && (
                  <section className="bg-brand-surface rounded-card p-5">
                    <div className="flex items-baseline justify-between mb-2"><h2 className="text-[15px] font-medium">Závody</h2>
                      <button onClick={() => setView('zavody')} className="text-[13px] text-brand-muted hover:text-brand-text">vše →</button></div>
                    {raceGroups.filter(g => !g.past).slice(0, 3).map((g, k) => (
                      <button key={k} onClick={() => setView('zavody')} className="w-full flex items-center justify-between gap-3 py-2.5 border-t border-white/5 text-left first:border-t-0">
                        <span className="min-w-0"><b className="block font-semibold truncate">{g.name}</b><span className="text-xs text-brand-muted">{dShort(isoD(g.from))} {dm(isoD(g.from))} – {dm(isoD(g.to))} · {g.races.length > 1 ? `${g.races.length} dny` : '1 den'} + dostavba</span></span>
                        <span className={`text-sm font-semibold tnum ${g.filled < g.total ? 'text-brand-accent-lite' : 'text-brand-muted'}`}>{g.filled}/{g.total}</span>
                      </button>
                    ))}
                    {raceGroups.filter(g => !g.past).length === 0 && <p className="text-sm text-brand-muted">Žádný nadcházející závod.</p>}
                  </section>
                )}
              </div>
            </div>
          </div>
        );
      };

      // Akce stěny (jen Správa). only = 'lanovka' | 'limit' → kompaktní řada v plovoucím detailu na Macu.
      const renderAdminActions = (only, vw) => {
              // vw = týden z buildWeekView (panel Kam se zapsat); bez něj aktuální týden v Plánu týdne
              const { calMon, calWed, week, key, monday, shiftMonSector, shiftWedSector, undoMonShift, undoWedShift,
                undoReplace, cancelMonSector, undoMonCancel, cancelWedSector, undoWedCancel } = vw || curView;
              // modal Nahradit pracuje s aktuálním týdnem → nejdřív na ten týden přepnout
              const openReplace = venue => {
                if (vw && vw.key !== curView.key) setOffset(Math.round((vw.monday - getMonday(new Date())) / (7 * 86400000)));
                setReplaceModal({ venue });  // okno je nad spodním panelem (z-[80]), panel zůstane
              };
              const monActive = calMon && !calMon.isOff && calMon.sector;
              const monSwapped = week.monSectorOverride?.kind === 'swap';
              const monLanShift   = monActive && !monSwapped;
              const monLanReplace = monActive && !monSwapped;
              const monLanCancel  = monActive && !monSwapped;
              const monLanUndoShift   = (rotationShifts.lanovka || []).includes(key);
              const monLanUndoReplace = monSwapped;
              const monLanUndoCancel  = !!week.monCancelledSetters;
              const wedActive = calWed && !calWed.isOff && calWed.sector;
              const wedSwapped = week.wedSectorOverride?.kind === 'swap';
              const wedLimShift   = wedActive && !wedSwapped;
              const wedLimReplace = wedActive && !wedSwapped;
              const wedLimCancel  = wedActive && !wedSwapped;
              const wedLimUndoShift   = (rotationShifts.limit || []).includes(key);
              const wedLimUndoReplace = wedSwapped;
              const wedLimUndoCancel  = !!week.wedCancelledSetters;
              const nextWk = fmt(addDays(monday, 7));
              // Reálné datum dopadu Posunu = build day dalšího týdne TÉŽE stěny v rotaci
              // (přeskočí prázdné letní týdny — Lanovka staví Po/Út, Limit St, Dětská Čt).
              const landDate = (seq, offForDate) => {
                const idx = seq.indexOf(key);
                if (idx < 0 || idx + 1 >= seq.length) return nextWk;
                const m = new Date(seq[idx + 1] + 'T12:00:00');
                return fmt(addDays(m, offForDate(m)));
              };
              const monLandWk = landDate(LANOVKA_WEEKS, m => lanovkaOffset(m));
              const wedLandWk = landDate(LIMIT_WEEKS, m => limitOffset(m, calWed?.sector));

              // Tlačítko, plní svůj flex container (uvnitř wall rowu vedle sebe = poloviční)
              const wallBtn = (key, cls, onClick, icon, action, sector, suffix) => (
                <button key={key} onClick={onClick}
                  title={`${action}${sector ? ' ' + sector : ''}${suffix ? ' ' + suffix : ''}`}
                  className={`w-full min-w-0 px-3 py-3.5 rounded-ctl text-xs font-bold uppercase tracking-[0.12em] transition-colors flex items-center justify-center gap-1.5 ${cls}`}>
                  <span className="text-base leading-none flex-shrink-0">{icon}</span>
                  <span className="flex-shrink-0">{action}</span>
                  {sector && <span className="font-bold normal-case tracking-normal truncate min-w-0">"{sector}"</span>}
                  {suffix && <span className="opacity-80 flex-shrink-0">{suffix}</span>}
                </button>
              );

              const hasLanovkaActions = monLanShift || monLanReplace || monLanCancel || monLanUndoShift || monLanUndoReplace || monLanUndoCancel;
              const hasLimitActions   = wedLimShift || wedLimReplace || wedLimCancel || wedLimUndoShift || wedLimUndoReplace || wedLimUndoCancel;

              if (only) {
                const keys = only === 'lanovka'
                  ? [[monLanShift, shiftMonSector, '↪', 'Posun', `→ ${monLandWk}`], [monLanReplace, () => openReplace('mon'), '↔', 'Nahradit'],
                     [monLanCancel, cancelMonSector, '✕', 'Smazat'], [monLanUndoShift, undoMonShift, '↩', 'Vrátit posun'],
                     [monLanUndoReplace, () => undoReplace('mon'), '↩', 'Vrátit nahrazení'], [monLanUndoCancel, undoMonCancel, '↩', 'Obnovit']]
                  : [[wedLimShift, shiftWedSector, '↪', 'Posun', `→ ${wedLandWk}`], [wedLimReplace, () => openReplace('wed'), '↔', 'Nahradit'],
                     [wedLimCancel, cancelWedSector, '✕', 'Smazat'], [wedLimUndoShift, undoWedShift, '↩', 'Vrátit posun'],
                     [wedLimUndoReplace, () => undoReplace('wed'), '↩', 'Vrátit nahrazení'], [wedLimUndoCancel, undoWedCancel, '↩', 'Obnovit']];
                const sector = only === 'lanovka' ? calMon?.sector : calWed?.sector;
                const list = keys.filter(k => k[0]);
                if (!list.length) return null;
                return (
                  <div className="flex flex-wrap gap-1.5 px-3 pb-3 pt-3 border-t border-brand-border">
                    {list.map(([, fn, icon, action, suffix]) => (
                      <button key={action} onClick={fn} title={`${action}${sector ? ' ' + sector : ''}${suffix ? ' ' + suffix : ''}`}
                        className={`flex-auto px-2.5 py-2 rounded-ctl whitespace-nowrap text-xs font-semibold bg-brand-surface-2 hover:bg-brand-border transition-colors flex items-center justify-center gap-1.5
                          ${icon === '✕' ? 'text-bad' : 'text-brand-text'}`}>
                        <span>{icon}</span><span>{action}</span>{suffix && <span className="text-brand-muted tnum">{suffix}</span>}
                      </button>
                    ))}
                  </div>
                );
              }
              return (
                <div className="space-y-2">
                  {/* Lanovka vlevo, Limit vpravo. Buttony Posun/Smazat pod sebou v rámci stěny. */}
                  {(hasLanovkaActions || hasLimitActions) && (
                    <div className="flex flex-col lg:flex-row gap-2">
                      {/* LANOVKA — Posun + Smazat pod sebou (žluté gradient) */}
                      {hasLanovkaActions && (
                        <div className="flex-1 flex flex-col gap-2">
                          {monLanShift      && wallBtn('lan-shift',      'bg-brand-surface text-brand-text ring-1 ring-inset ring-venue-lanovka/50 hover:ring-venue-lanovka hover:bg-brand-surface-2', shiftMonSector,  '↪', 'Posun',        calMon.sector, `→ ${monLandWk}`)}
                          {monLanReplace    && wallBtn('lan-replace',    'bg-brand-surface text-brand-text ring-1 ring-inset ring-venue-lanovka/50 hover:ring-venue-lanovka hover:bg-brand-surface-2', () => openReplace('mon'), '↔', 'Nahradit', calMon.sector, null)}
                          {monLanCancel     && wallBtn('lan-cancel',     'bg-brand-surface text-brand-text ring-1 ring-inset ring-venue-lanovka/50 hover:ring-venue-lanovka hover:bg-brand-surface-2', cancelMonSector, '✕', 'Smazat',       calMon.sector, null)}
                          {monLanUndoShift  && wallBtn('lan-undoshift',  'bg-brand-surface text-brand-text ring-1 ring-inset ring-venue-lanovka/50 hover:ring-venue-lanovka hover:bg-brand-surface-2', undoMonShift,    '↩', 'Vrátit posun', null,          null)}
                          {monLanUndoReplace&& wallBtn('lan-undorepl',   'bg-brand-surface text-brand-text ring-1 ring-inset ring-venue-lanovka/50 hover:ring-venue-lanovka hover:bg-brand-surface-2', () => undoReplace('mon'), '↩', 'Vrátit nahrazení', null, null)}
                          {monLanUndoCancel && wallBtn('lan-undocancel', 'bg-brand-surface text-brand-text ring-1 ring-inset ring-venue-lanovka/50 hover:ring-venue-lanovka hover:bg-brand-surface-2', undoMonCancel,   '↩', 'Obnovit',      null,          null)}
                        </div>
                      )}
                      {/* LIMIT — Posun + Smazat pod sebou (černé) */}
                      {hasLimitActions && (
                        <div className="flex-1 flex flex-col gap-2">
                          {wedLimShift      && wallBtn('lim-shift',      'bg-brand-surface text-brand-text ring-1 ring-inset ring-brand-accent/60 hover:ring-brand-accent hover:bg-brand-surface-2',     shiftWedSector,  '↪', 'Posun',        calWed.sector, `→ ${wedLandWk}`)}
                          {wedLimReplace    && wallBtn('lim-replace',    'bg-brand-surface text-brand-text ring-1 ring-inset ring-brand-accent/60 hover:ring-brand-accent hover:bg-brand-surface-2',     () => openReplace('wed'), '↔', 'Nahradit', calWed.sector, null)}
                          {wedLimCancel     && wallBtn('lim-cancel',     'bg-brand-surface text-brand-text ring-1 ring-inset ring-brand-accent/60 hover:ring-brand-accent hover:bg-brand-surface-2',     cancelWedSector, '✕', 'Smazat',       calWed.sector, null)}
                          {wedLimUndoShift  && wallBtn('lim-undoshift',  'bg-brand-surface-2 text-brand-text hover:bg-brand-border',  undoWedShift,    '↩', 'Vrátit posun', null,          null)}
                          {wedLimUndoReplace&& wallBtn('lim-undorepl',   'bg-brand-surface-2 text-brand-text hover:bg-brand-border',  () => undoReplace('wed'), '↩', 'Vrátit nahrazení', null, null)}
                          {wedLimUndoCancel && wallBtn('lim-undocancel', 'bg-brand-surface-2 text-brand-text hover:bg-brand-border',  undoWedCancel,   '↩', 'Obnovit',      null,          null)}
                        </div>
                      )}
                    </div>
                  )}

                  {/* + Přidat závod / + Extra stavění — vedle sebe dole */}
                  <div className="flex flex-col sm:flex-row gap-2">
                    <button onClick={() => setShowAddRace(true)}
                      className="flex-1 px-5 py-4 rounded-ctl bg-brand-accent hover:bg-brand-accent-dark text-white text-xs font-bold uppercase tracking-[0.16em] transition-colors flex items-center justify-center gap-2">
                      <span className="text-lg leading-none">+</span>
                      <span>Přidat závod</span>
                    </button>
                    <button onClick={() => setShowAddExtra(true)}
                      className="flex-1 px-5 py-4 rounded-ctl bg-brand-surface ring-1 ring-inset ring-brand-border-hi hover:bg-brand-surface-2 text-brand-text text-xs font-bold uppercase tracking-[0.16em] transition-colors flex items-center justify-center gap-2">
                      <span className="text-lg leading-none">+</span>
                      <span>Extra stavění</span>
                    </button>
                  </div>
                </div>
              );
      };

      return (
        <AdminCtx.Provider value={admin}>
        <div className={`min-h-screen bg-brand-bg lg:pl-[15.5rem] min-[1900px]:pl-[19rem] ${panelView && pickObj ? 'lg:pr-[24.5rem]' : ''}`}>

          {/* ── Boční navigace (Mac) ───────────────────────────────────── */}
          <aside className="hidden lg:flex fixed top-0 left-0 bottom-[var(--strip-h,0px)] w-[15.5rem] min-[1900px]:w-[19rem] flex-col border-r border-white/[0.04] bg-brand-bg px-3 py-3.5 z-40 overflow-y-auto">
            <p className="flex items-center justify-between px-1.5 pb-3.5">
              <span className="display text-xl leading-none text-brand-text">Stavění</span>
            </p>
            {!zView && view !== 'prehled' && view !== 'zavody' && <div className="px-1 pb-3"><RoleSeg /></div>}
            <nav className="flex flex-col">
              {NAV_ITEMS.map(([id, label]) => (
                <button key={id} onClick={() => setView(id)}
                  className={`text-left px-2.5 py-[7px] text-sm transition-colors border-l-2 flex items-baseline justify-between gap-2
                    ${view === id ? 'text-brand-text font-semibold border-brand-accent' : 'text-brand-muted border-transparent hover:text-brand-text'}`}>
                  {label}
                  {id === 'zapsat' && zFree > 0 && <span className="text-xs font-semibold text-brand-accent-lite" title="Počet řádků v Tady chybí lidi (stavění + sundávání)">{role === 'oboje' ? `${needB.length} + ${needS.length}` : zFree}</span>}
                  {id === 'moje' && me && <span className="text-xs font-normal text-brand-muted">{(showB ? myBuilds.length : 0) + (showS ? mySunds.length : 0)}</span>}
                </button>
              ))}
            </nav>
            {me !== null && !zView && (() => {
              // Seznam podle času jako v Rise: tento týden / později; volná místa zvlášť
              const nowWk = getMonday(new Date()).getTime();
              const inWeek = b => getMonday(b.date).getTime() === nowWk;
              const Row = ({ b, free }) => (
                <button onClick={() => (free ? claim(b.i, b.target) : goWeek(b.i, b.target))}
                  title={free && me ? `Zapsat se: ${b.wall} ${fmtFull(b.date)}` : `${b.wall} ${fmtFull(b.date)} — ${b.sector}`}
                  className="w-full flex items-center gap-2.5 px-2.5 py-1.5 rounded-ctl text-[13px] text-left hover:bg-brand-surface transition-colors">
                  <VMark theme={b.theme} size={10} />
                  <span className="flex-1 min-w-0 truncate text-brand-text">{b.sector}</span>
                  {free
                    ? <span className="text-[11px] text-brand-accent-lite ring-1 ring-inset ring-brand-accent-dark px-1.5 whitespace-nowrap">{freeLabel(b.free)}</span>
                    : <span className="text-xs text-brand-muted tnum whitespace-nowrap">{inWeek(b) ? b.date.toLocaleString('cs-CZ', { weekday: 'short' }).replace('.', '') : fmt(b.date)}</span>}
                </button>
              );
              const SundRow = ({ x }) => (
                <button onClick={() => goWeek(x.i, x.target, 'sund')} title={`Sundávání ${x.wall} ${fmtFull(x.date)}`}
                  className="w-full flex items-center gap-2.5 px-2.5 py-1.5 rounded-ctl text-[13px] text-left hover:bg-brand-surface transition-colors">
                  <VMark theme={x.theme} size={10} style={{ opacity: 0.7 }} />
                  <span className="flex-1 min-w-0 truncate text-brand-text" title={`Sundávání ${x.wall} před stavěním ${x.sector}`}>{x.sector}{x.myti === me ? ' · mytí' : ''}</span>
                  <span className="text-xs text-brand-muted tnum whitespace-nowrap">{inWeek(x) ? x.date.toLocaleString('cs-CZ', { weekday: 'short' }).replace('.', '') : fmt(x.date)}</span>
                </button>
              );
              if (role === 'sund') return (
                <>
