                    rotationShifts={rotationShifts} extras={extras} races={races} />
                ))}
                <div ref={kalEndRef} className="py-6 text-center text-sm text-brand-muted">Načítám další měsíce…</div>
              </div>
              </div>
            )}

            {/* ── Přehled ── */}
            {view === 'prehled' && renderPrehled()}

            {zView && renderZapsat()}

            {/* ── Závody a extra ── */}
            {view === 'zavody' && renderZavody()}

            {/* ── Rotace (jen Správa) ── */}
            {view === 'rotace' && (
              <div>
                <YearPlan data={data} rotationShifts={rotationShifts} />
              </div>
            )}
          </main>

          {/* ── Panel detailu (Kam se zapsat / Moje): Mac vpravo, telefon jako spodní panel ── */}
          {panelView && isDesk && pickObj && (
            <aside className="fixed top-0 right-0 bottom-[var(--strip-h,0px)] w-[24.5rem] z-30 overflow-y-auto bg-[#1F2025] border-l border-white/5 px-6 py-7 flex flex-col gap-[22px]" aria-label="Detail">
              <button onClick={() => setPick(null)} title="Zavřít" className="absolute right-3 top-3 z-10 p-1.5 text-brand-muted hover:text-brand-text"><X c="w-4 h-4" /></button>
              {renderPanel()}
            </aside>
          )}
          {panelView && !isDesk && pickObj && (
            <div className="fixed inset-0 z-[60] bg-black/60" onClick={() => setPick(null)}>
              <div role="dialog" aria-label="Detail" onClick={e => e.stopPropagation()}
                className="absolute inset-x-0 bottom-0 max-h-[88vh] overflow-y-auto bg-[#1F2025] rounded-t-[18px] px-4 pt-3 pb-[calc(var(--strip-h,0px)+1.5rem)] flex flex-col gap-5 animate-sheet">
                <div className="flex justify-center"><span className="w-10 h-1 rounded-full bg-white/20" /></div>
                <button onClick={() => setPick(null)} title="Zavřít" className="absolute right-3 top-2 p-2 text-brand-muted"><X c="w-4 h-4" /></button>
                {renderPanel()}
              </div>
            </div>
          )}

          {/* ── Stavěči: na Macu stálá lišta dole (táhneš rovnou do slotů), na telefonu pod kartami ── */}
          {slotView && !isDesk && view !== 'tyden' && admin && renderPhonePool()}

          {/* ── Telefon: spodní navigace ── */}
          <nav className="lg:hidden fixed inset-x-0 bottom-[var(--strip-h,0px)] z-40 bg-[#17181C] border-t border-white/5 grid grid-cols-4">
            {[['zapsat', 'Zapsat'], ['moje', 'Moje'], ['tyden', 'Plán'], ['vic', 'Víc']].map(([id, label]) => {
              const on = id === 'vic' ? (moreOpen || !['zapsat', 'moje', 'tyden'].includes(view)) : view === id;
              return (
                <button key={id} onClick={() => { if (id === 'vic') setMoreOpen(o => !o); else { setView(id); setMoreOpen(false); setPick(null); window.scrollTo(0, 0); } }}
                  className={`pt-2.5 pb-3.5 text-xs ${on ? 'text-brand-text font-semibold' : 'text-brand-muted'}`}>{label}</button>
              );
            })}
          </nav>
          {moreOpen && !isDesk && (
            <div className="fixed inset-0 z-[35] bg-black/50" onClick={() => setMoreOpen(false)}>
              <div role="dialog" aria-label="Další" onClick={e => e.stopPropagation()}
                className="absolute inset-x-0 bottom-[calc(var(--strip-h,0px)+3.25rem)] bg-[#1F2025] rounded-t-[18px] p-4 flex flex-col gap-1 animate-sheet">
                {NAV_ITEMS.filter(([id]) => !['zapsat', 'moje', 'tyden'].includes(id)).map(([id, label]) => (
                  <button key={id} onClick={() => { setView(id); setMoreOpen(false); window.scrollTo(0, 0); }}
                    className={`text-left px-3 py-3 rounded-ctl text-[15px] ${view === id ? 'bg-brand-surface text-brand-text' : 'text-brand-muted'}`}>{label}</button>
                ))}
                <div className="pt-3 mt-2 border-t border-white/5"><RoleSeg /></div>
              </div>
            </div>
          )}

          {/* ── Kdo jsi? ── */}
          {pickMe && (
            <div className="fixed inset-0 z-[70] flex items-end sm:items-center justify-center p-4 bg-black/70" onClick={() => setPickMe(false)}>
              <div className="w-full max-w-md bg-brand-surface rounded-card p-5 animate-rise" onClick={e => e.stopPropagation()}>
                <h3 className="text-lg font-bold text-brand-text">Kdo jsi?</h3>
                <p className="text-sm text-brand-muted mt-1">Zapamatuje se v tomhle zařízení. Uvidíš svoje stavění a volná místa.</p>
                {[['Stavěči', team.filter(n => TEAM.includes(n))], ['Hosté', team.filter(n => !TEAM.includes(n) && n !== 'NEOBSADITELNÉ' && !REMOVAL_TEAM.includes(n))], ['Sundavači a mytí', REMOVAL_TEAM.filter(n => !TEAM.includes(n))]].filter(([, list]) => list.length).map(([t, list]) => (
                  <div key={t} className="mt-4">
                    <p className="text-xs text-brand-muted mb-2">{t}</p>
                    <div className="grid grid-cols-2 gap-2">
                      {list.map(n => (
                        <button key={n} onClick={() => pickPerson(n)}
                          className={`py-3 rounded-ctl text-sm font-bold transition-colors ${me === n ? 'bg-brand-accent text-white' : 'bg-brand-surface-2 text-brand-text hover:bg-brand-border'}`}>{n}</button>
                      ))}
                    </div>
                  </div>
                ))}
                {canAdmin && <div className="lg:hidden mt-5">
                  <p className="text-[11px] font-bold uppercase tracking-[0.16em] text-brand-muted mb-2">Pohled</p>
                  <div className="grid grid-cols-2 p-0.5 rounded-ctl bg-brand-bg ring-1 ring-inset ring-brand-border">
                    {[[false, 'Stavěč'], [true, 'Správa']].map(([v, l]) => (
                      <button key={l} onClick={() => setAdmin(v)} aria-pressed={admin === v}
                        className={`py-2.5 rounded-ctl text-xs font-bold uppercase tracking-[0.12em] ${admin === v ? 'bg-brand-text text-brand-bg' : 'text-brand-muted'}`}>{l}</button>
                    ))}
                  </div>
                </div>}
                <button onClick={() => { setMe(me || ''); setPickMe(false); }} className="w-full mt-4 py-2.5 text-sm font-semibold text-brand-muted hover:text-brand-text">
                  {me ? 'Hotovo' : 'Jen se dívám'}
                </button>
              </div>
            </div>
          )}

          {/* Modal: Přidat závod */}
          {showAddRace && (
            <AddRaceModal
              existingRaceDates={new Set(Object.values(races || {}).flatMap(r => [r.date, ...((r.dostavba || []).map(d => d.date))]).filter(Boolean))}
              onClose={() => setShowAddRace(false)}
              onSave={addRace} />
          )}

          {/* Modal: Extra stavění */}
          {showAddExtra && (
            <AddExtraModal
              existingIds={new Set(Object.keys(extras || {}))}
              onClose={() => setShowAddExtra(false)}
              onSave={addExtras} />
          )}

          {/* Modal: Nahradit profil (prohození s jiným týdnem téže stěny) */}
          {replaceModal && admin && (() => {
            const venue = replaceModal.venue;
            const isMon = venue === 'mon';
            const seq = isMon ? LANOVKA_WEEKS : LIMIT_WEEKS;
            const curSec = effSector(venue, key, data, rotationShifts);
            // ±2 měsíce kolem aktuálního týdne
            const lo = toIso(addDays(monday, -62));
            const hi = toIso(addDays(monday,  62));
            const cands = seq.filter(wk => wk !== key && wk >= lo && wk <= hi).map(wk => {
              const sec = effSector(venue, wk, data, rotationShifts);
              if (!sec || sec.isOff || !sec.sector) return null;
              const wkMon = new Date(wk + 'T12:00:00');
              const sessD = addDays(wkMon, isMon ? lanovkaOffset(wkMon) : limitOffset(wkMon, sec.sector));
              return { wk, sector: sec.sector, label: fmtFull(sessD) };
            }).filter(Boolean);
            return (
              <div className="fixed inset-0 z-[80] flex items-center justify-center p-4 bg-black/50"
                onClick={() => setReplaceModal(null)}>
                <div className="bg-brand-surface rounded-card shadow-2xl w-full max-w-md max-h-[80vh] flex flex-col overflow-hidden"
                  onClick={e => e.stopPropagation()}>
                  <div className={`px-5 py-4 ${isMon ? 'bg-venue-lanovka text-brand-bg' : 'bg-brand-surface-2 text-white'}`}>
                    <h3 className="text-lg font-black">Nahradit profil</h3>
                    <p className="text-sm mt-0.5 opacity-80">
                      {isMon ? 'Lanovka' : 'Limit'} {fmtFull(isMon ? monDate : wedDate)} — „{curSec?.sector ?? '?'}"
                    </p>
                    <p className="text-xs mt-1 opacity-70">Vyber týden, se kterým se profil prohodí. Stavěči zůstávají na svých datech.</p>
                  </div>
                  <div className="flex-1 overflow-y-auto p-3 space-y-1.5">
                    {cands.length === 0 ? (
                      <p className="text-sm text-brand-muted text-center py-6">Žádné týdny ke prohození v okolí ±2 měsíce.</p>
                    ) : cands.map(c => (
                      <button key={c.wk}
                        onClick={() => { if (window.confirm(`Prohodit profily?\n\n${fmtFull(isMon?monDate:wedDate)} dostane „${c.sector}"\n${c.label} dostane „${curSec?.sector}"`)) doReplace(venue, c.wk); }}
                        className="w-full flex items-center justify-between gap-3 px-4 py-3 rounded-ctl border border-brand-border hover:border-brand-border-hi hover:bg-brand-surface-2 transition-colors text-left">
                        <span className="text-sm font-bold text-brand-muted tabular-nums flex-shrink-0">{c.label}</span>
                        <span className="text-sm font-semibold text-brand-text truncate">{c.sector}</span>
                      </button>
                    ))}
                  </div>
                  <div className="px-4 py-3 border-t border-brand-border">
                    <button onClick={() => setReplaceModal(null)}
                      className="w-full px-4 py-2.5 rounded-ctl bg-brand-surface-2 hover:bg-brand-border text-brand-text text-sm font-bold transition-colors">
                      Zrušit
                    </button>
                  </div>
                </div>
              </div>
            );
          })()}
        </div>
        </AdminCtx.Provider>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
