        // plovoucí detail na Macu: řádek s čarou nahoře místo plného boxu (maketa A)
        <div onClick={onClick} draggable={!!name} onDragStart={name ? onDragStart : undefined}
          onDragOver={onDragOver} onDrop={onDrop}
          className={`group flex items-center gap-3 px-0.5 cursor-pointer select-none transition-colors ${roomy ? 'py-3 text-[15px]' : 'py-2 text-sm'}
            ${name ? 'border-t border-brand-border hover:rounded-ctl hover:bg-bad/10 hover:border-t-transparent' : `border border-dashed my-1.5 rounded-ctl !px-3 ${sel ? selRing : 'border-brand-border-hi hover:bg-brand-surface-2'}`}`}>
          {mark && <VMark hex={mark} size={12} outline={!name} />}
          <span className="w-4 text-center text-[11px] text-brand-muted tnum shrink-0">{num}</span>
          {name ? (
            <>
              <span className={`flex-1 truncate ${name === 'NEOBSADITELNÉ' ? 'text-brand-muted' : 'text-brand-text'}`}>{name === 'NEOBSADITELNÉ' ? 'neobsaditelné' : name}</span>
              {name === 'NEOBSADITELNÉ' && <span className="text-[11px] text-[#FDBA74] group-hover:hidden">chybí člověk</span>}
              <X c="w-3.5 h-3.5 opacity-0 group-hover:opacity-60 shrink-0 transition-opacity" />
            </>
          ) : (
            <><span className="text-xs text-brand-muted">{sel ? `Přiřadit: ${sel}` : 'Volný slot'}</span>{removeBtn}</>
          )}
        </div>
      );
      return (
        <div onClick={onClick}
          draggable={!!name}
          onDragStart={name ? onDragStart : undefined}
          onDragOver={onDragOver}
          onDrop={onDrop}
          className={`flex items-center gap-2.5 px-3 py-2.5 rounded-ctl border
            cursor-pointer transition-all duration-150 select-none
            ${name
              ? `${filledBg} ${filledText} hover:bg-bad/10 hover:border-bad/40 group`
              : `${emptyBg} border-dashed ${sel ? selRing : 'opacity-75'}`
            }`}>
          <span className={`w-5 h-5 rounded-badge flex items-center justify-center
            text-xs font-bold flex-shrink-0
            ${name ? 'bg-brand-bg/60 text-brand-muted' : numEmpty}`}>
            {num}
          </span>
          {name ? (
            <>
              <span className="flex-1 text-sm font-semibold truncate">{name}</span>
              <GripV c="w-4 h-4 opacity-20 group-hover:opacity-0 flex-shrink-0 transition-opacity" />
              <X c="w-3.5 h-3.5 opacity-0 group-hover:opacity-50 flex-shrink-0 transition-opacity" />
            </>
          ) : (
            <><span className="text-xs text-brand-muted font-medium">
              {sel ? `Přiřadit: ${sel}` : 'Volný slot'}
            </span>{removeBtn}</>
          )}
        </div>
      );
    }

    // ── SessionCard ──────────────────────────────────────────────────────────
    function SessionCard({ session, day, date, theme, slots, lanoSlot, calInfo,
      sel, onSlotClick, onDragStartSlot, onDragOverSlot, onDropSlot,
      onLanoClick, onDragStartLano, onDropLano, onClear, onDateChange,
      onShift, nextSector, weekMin, weekMax, baseDates, compact, slotCount, onCapacity, lanoRemoved, lanoDefault, onLanoCapacity, changeTag }) {

      const [editingDate, setEditingDate] = React.useState(false);
      const admin = React.useContext(AdminCtx);
      const isYellow = theme === 'yellow';
      const isGreen  = theme === 'green';
      const rawDay = date.toLocaleString('cs-CZ', { weekday: 'long' });
      const displayDay = rawDay.charAt(0).toUpperCase() + rawDay.slice(1);
      // Přesunuté stavění: datum se liší od standardního dne rotace → výrazné upozornění,
      // ať si nikdo nesplete den (baseDate = den, na který stavění normálně padá).
      // baseDates = všechny dny, které pro tuhle stěnu platí za normální. V týdnu na
      // přelomu srpna a září jsou dva (starý i nový rozvrh) — tam se plán teprve
      // překlápěl, takže to není přesun a štítek se nesmí ukázat.
      const _bd = (baseDates || []).filter(Boolean);
      const movedFrom = _bd.length && !_bd.some(b => b.toDateString() === date.toDateString())
        ? _bd[0] : null;
      // 2. pád, ať štítek zní česky („místo čtvrtka", ne „místo čtvrtek")
      const DAY_GEN = { 'pondělí': 'pondělí', 'úterý': 'úterý', 'středa': 'středy',
        'čtvrtek': 'čtvrtka', 'pátek': 'pátku', 'sobota': 'soboty', 'neděle': 'neděle' };
      const movedFromDay = movedFrom
        ? (r => DAY_GEN[r] || r)(movedFrom.toLocaleString('cs-CZ', { weekday: 'long' }))
        : '';
      // Důvod přesunu se dá odvodit: na původní den padl svátek nebo prázdniny
      const movedReason = movedFrom
        ? [stateHoliday(movedFrom), schoolHoliday(movedFrom)].filter(Boolean).join(' · ') || null
        : null;
      // Defenzivní: data z Firestore mohou mít chybějící pole (např. týden má jen monday bez wednesday)
      const safeSlots = Array.isArray(slots) ? slots : [null, null, null, null];
      // Slot count: Tělocvična=2, Lanovka=variable, Limit=variable
      const sectorSlots = calInfo?.sector && !calInfo.isOff
        ? (isGreen ? 2 : isYellow ? getLanovkaSlotCount(calInfo.sector) : getWedSlotCount(calInfo.sector))
        : safeSlots.length;
      // Počet slotů určuje PROFIL (ne počet zapsaných). Přebyteční stavěči nad rámec
      // profilu (po přehození na menší profil) se nezobrazují – při přehození se rovnou
      // zahodí (viz doReplace), takže tu žádný přebytek nezůstává.
      const maxSlots = capOk(slotCount) && calInfo?.sector && !calInfo.isOff ? slotCount : sectorSlots;
      const visibleSlots = safeSlots.slice(0, maxSlots);
      const filled = visibleSlots.filter(Boolean).length + (lanoSlot && calInfo != null ? 1 : 0);
      const total  = maxSlots + (lanoSlot !== undefined && calInfo != null ? 1 : 0);
      const allFilled = filled === total;
      const flash = false; // conflict prevention removed
      const isJulyAugust = date.getMonth() === 6 || date.getMonth() === 7;

      // Theme tokens
      const vu       = venueUi(theme);
      const hdr      = 'bg-brand-surface';
      const hdrText  = 'text-brand-text';
      const hdrSub   = 'text-brand-muted';
      const progTrack= 'bg-brand-surface-2';
      const progFill = vu.bar;
      const countCol = allFilled ? vu.text : 'text-brand-muted';

      const emptyBg  = `border-brand-border-hi ${vu.hover} hover:bg-brand-surface-2`;
      const filledBg  = 'bg-brand-surface-2 border-transparent';
      const filledText= 'text-brand-text';
      const numEmpty  = 'bg-transparent text-brand-muted ring-1 ring-inset ring-brand-border-hi';
      const selRing   = `ring-2 ${vu.ring} ring-offset-1 ring-offset-brand-surface opacity-100`;

      const slotProps = { sel, emptyBg, filledBg, filledText, numEmpty, selRing,
        onDragOver: onDragOverSlot, compact: true, roomy: !compact, mark: vu.hex };
      const datePicker = (
                editingDate && (() => {
                  const first = weekMin ? new Date(weekMin + 'T12:00:00') : date;
                  const curIso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
                  const sel = curIso(date);
                  return (
                    <>
                      <div className="fixed inset-0 z-20" onClick={() => setEditingDate(false)} />
                      <div className="absolute top-full left-0 right-0 mt-1 z-30 grid grid-cols-7 gap-0.5 p-1.5 rounded-ctl bg-brand-surface shadow-xl ring-1 ring-brand-border">
                        {Array.from({ length: 7 }, (_, i) => addDays(first, i)).map(d => {
                          const iso = curIso(d);
                          const wd = d.toLocaleString('cs-CZ', { weekday: 'short' }).replace('.', '');
                          const active = iso === sel;
                          return (
                            <button key={iso}
                              onClick={() => { onDateChange(iso); setEditingDate(false); }}
                              className={`w-full py-1 rounded-ctl text-center leading-tight transition-colors
                                ${active ? 'bg-brand-text text-brand-bg' : 'text-brand-text hover:bg-brand-surface-2'}`}>
                              <span className="block text-[9px] font-bold uppercase tracking-wide opacity-70">{wd}</span>
                              <span className="block text-xs font-black tabular-nums">{d.getDate()}.</span>
                            </button>
                          );
                        })}
                      </div>
                    </>
                  );
                })()
      );
      const hn = holidayNote(date);

      const wallName = isYellow ? 'Lanovka' : isGreen ? 'Tělocvična' : 'Limit';
      return (
        <div {...cardBox(vu.hex, compact)}>
          <CardHead hex={vu.hex} date={date} tag={changeTag}
            title={calInfo?.sector || wallName} titleMuted={!!calInfo?.isOff}
            kicker={calInfo?.note ? `${wallName} · ${calInfo.note}` : wallName}
            count={calInfo && !calInfo.isOff ? `${allFilled ? '✓ ' : ''}${filled}/${total}` : null} gap={!allFilled}
            right={admin && <button onClick={onClear} title="Vymazat přiřazení"
              className={`p-1.5 -m-0.5 rounded-ctl text-brand-muted transition-colors hover:text-brand-text hover:bg-brand-surface-2 shrink-0`}>
              <RotateCcw c="w-3.5 h-3.5" />
            </button>}
            dateAction={<>
              {admin && <button onClick={() => setEditingDate(v => !v)} title="Změnit datum"
                className={`ml-auto text-xs font-semibold transition-colors ${editingDate ? 'text-brand-text' : 'text-brand-muted hover:text-brand-text'}`}>Změnit</button>}
              {datePicker}
            </>}>
            {movedFrom && (
              <CardNote tone="accent">
                <span title={`Standardně by se stavělo v ${movedFromDay} ${fmtFull(movedFrom)}`}>Jiný den · místo {movedFromDay} {fmt(movedFrom)}</span>
                {movedReason && <span className="block text-brand-muted">{movedReason}</span>}
              </CardNote>
            )}
            {hn && !movedReason && <CardNote tone={hn.isState ? 'bad' : null}>{hn.text}</CardNote>}
            {!calInfo && isJulyAugust && <CardNote>není stavění</CardNote>}
          </CardHead>

          {/* Main slots */}
          <div className="px-5 pb-4">
            {calInfo?.isOff ? (
              <p className="py-3 border-t border-brand-border text-sm text-brand-muted">{calInfo.sector} — není stavění</p>
            ) : calInfo == null ? (
              <p className="py-2 border-t border-brand-border text-xs text-brand-muted">—</p>
            ) : (
              <>
              {Array.from({ length: maxSlots }, (_, i) => visibleSlots[i] ?? null).map((name, i) => (
                <Slot key={i} num={i+1} name={name} {...slotProps}
                  onClick={() => onSlotClick(i)}
                  onDragStart={() => onDragStartSlot(i, name)}
                  onDrop={() => onDropSlot(i)}
                  onRemoveSlot={admin && onCapacity ? () => onCapacity('remove', i) : undefined} />
              ))}
              {admin && onCapacity && (
                <div className="flex items-center gap-4 pt-2 text-xs">
                  <button onClick={() => onCapacity('add')} className="text-brand-muted hover:text-brand-text">+ přidat místo</button>
                  {maxSlots !== sectorSlots && <button onClick={() => onCapacity('reset')} className="text-brand-muted hover:text-brand-text">vrátit výchozí ({sectorSlots})</button>}
                </div>
              )}
              </>
            )}

            {/* Lano section (Lanovka only) */}
            {lanoSlot !== undefined && calInfo != null && !calInfo?.isOff && (
              <div className="mt-2">
                <p className="text-xs text-brand-muted pt-2 pb-1">Lano</p>
                <Slot num="L" name={lanoSlot} {...slotProps}
                  onClick={onLanoClick}
                  onDragStart={() => onDragStartLano && onDragStartLano(lanoSlot)}
                  onDrop={onDropLano}
                  onRemoveSlot={admin && onLanoCapacity ? () => onLanoCapacity(0) : undefined} />
              </div>
            )}
            {lanoRemoved && admin && onLanoCapacity && calInfo != null && !calInfo?.isOff && (
              <div className="pt-2 text-xs"><button onClick={() => onLanoCapacity(1)} className="text-brand-muted hover:text-brand-text">{lanoDefault ? '+ vrátit místo na lano' : '+ přidat lano'}</button></div>
            )}

            {/* Conflict flash */}
            {flash && (
              <div className="flex items-center gap-2 text-xs font-semibold text-bad
                bg-bad/10 border border-bad/30 rounded-ctl px-3 py-2 mt-1">
                <AlertCircle c="w-3.5 h-3.5 flex-shrink-0" />
                Stavěč je již přiřazen v tomto týdnu!
              </div>
            )}

          </div>
        </div>
      );
    }

    // ── ClimberChip ──────────────────────────────────────────────────────────
    function ClimberChip({ name, isSelected, inMon, inWed, inThu, isHost, onClick, onRemove, onDragStart, row }) {
      if (row) return (
        // Mac: řádek v levém panelu (vzor Rise, kontakty). Iniciály jsou jen CSS, aby text řádku začínal jménem.
        <div draggable onDragStart={onDragStart} onClick={onClick}
          className={`group flex items-center gap-2.5 px-2.5 py-[5px] rounded-ctl text-sm cursor-grab select-none transition-colors
            ${isSelected ? 'bg-brand-accent text-white' : isHost ? 'italic text-brand-accent-lite hover:bg-brand-surface' : 'text-brand-text hover:bg-brand-surface'}`}>
          <span data-ini={name.slice(0, 2).toUpperCase()} aria-hidden="true"
            className={`w-6 h-6 grid place-items-center shrink-0 rounded-badge not-italic text-[10px] font-bold before:content-[attr(data-ini)]
              ${isSelected ? 'bg-white/20 text-white' : isHost ? 'border border-dashed border-brand-accent/60' : 'bg-brand-surface-2 text-[#C9CBD0]'}`} />
          <span className="truncate">{name}</span>
          <span className="ml-auto flex items-center gap-1">
            {inMon && <VMark theme="yellow" size={8} title="Tento týden: Lanovka" />}
            {inWed && <VMark theme="dark" size={8} title="Tento týden: Limit" />}
            {inThu && <VMark theme="green" size={8} title="Tento týden: Tělocvična" />}
            {isHost && (
              <button onClick={e => { e.stopPropagation(); onRemove(); }} title="Smazat hosta"
                className="p-0.5 text-brand-muted hover:text-bad"><X c="w-3 h-3" /></button>
            )}
          </span>
        </div>
      );
      return (
        <div draggable onDragStart={onDragStart} onClick={onClick}
          className={`group flex items-center gap-1.5 pl-2.5 pr-2 py-2 rounded-badge border
            text-sm cursor-pointer transition-all duration-150 select-none
            ${isSelected
              ? 'bg-brand-accent border-brand-accent text-white scale-[1.03]'
              : isHost
                ? 'bg-transparent border-dashed border-brand-accent/60 text-brand-accent-lite hover:border-brand-accent'
                : 'bg-brand-surface-2 border-transparent text-brand-text hover:border-brand-border-hi'
            }`}>
          <UserIcon c="w-5 h-5 flex-shrink-0 opacity-50" />
          <span className={`font-semibold ${isHost ? 'italic' : ''}`}>{name}</span>
          {isHost && (
            <span className={`text-[10px] px-1.5 py-0.5 rounded-badge font-black uppercase tracking-wider
              ${isSelected ? 'bg-brand-accent/30 text-white' : 'bg-brand-accent/25 text-brand-accent-lite'}`}>Host</span>
          )}
          {inMon && (
            <span className={`text-xs px-1.5 py-0.5 rounded-badge font-bold
              ${isSelected ? 'bg-white/20 text-white' : 'bg-venue-lanovka/15 text-venue-lanovka'}`}>Po</span>
          )}
          {inWed && (
            <span className={`text-xs px-1.5 py-0.5 rounded-badge font-bold
              ${isSelected ? 'bg-white/20 text-white' : 'bg-brand-accent/15 text-brand-accent-lite'}`}>St</span>
          )}
          {/* Křížek (smazat) jen pro hosty – stálí stavěči se nemažou (jsou trvalí
              a mazání jen působilo problémy). Host je dočasný, ten zůstane odebíratelný. */}
          {isHost && (
            <button onClick={e => { e.stopPropagation(); onRemove(); }}
              className={`ml-0.5 p-0.5 rounded-badge transition-colors flex-shrink-0
                ${isSelected
                  ? 'text-white/50 hover:text-white hover:bg-white/20'
                  : 'text-brand-muted hover:text-bad hover:bg-bad/10'}`}>
              <X c="w-3 h-3" />
            </button>
          )}
        </div>
      );
    }

    // ── Lanovka floor plan ───────────────────────────────────────────────
    // Maps CAL sector text → set of highlighted sector numbers (1–5)
    function getLanovkaSectors(sectorName) {
      if (!sectorName) return new Set();
      const s = sectorName.toLowerCase();
      const out = new Set();
      if (s.includes('hříbek') || s.includes('hribek'))             out.add(4);
      if (s.includes('kout')   || s.includes('strop'))              out.add(2);
      if (s.includes('nový')   || s.includes('nahoře') ||
          s.includes('šedá')   || s.includes('profil'))             out.add(3);
      if (s.includes('dole') &&
          (s.includes('kolm')  || s.includes('přev') ||
           s.includes('prev')  || s.includes('malé')))              out.add(5);
      if (!out.has(5) &&
          (s.includes('přev')  || s.includes('prev') ||
           s.includes('bizár') || s.includes('bizar')))             out.add(1);
      return out;
    }

    function LanovkaFloorPlan({ activeSectors }) {
      const as = activeSectors || new Set();
      const aF = '#fbbf24', iF = '#2a2a2c';
      const aS = '#f59e0b', iS = '#484848';
      const aL = '#78350f', iL = '#555';
      const f  = n => as.has(n) ? aF : iF;
      const st = n => as.has(n) ? aS : iS;
      const lb = n => as.has(n) ? aL : iL;

      return (
        <svg viewBox="0 0 300 224" xmlns="http://www.w3.org/2000/svg" className="w-full">
          <rect width="300" height="224" fill="#111113" rx="8"/>

          {/* ══ HORNÍ PATRO — sektory 1, 3, 4 ══ */}
          <text x="12" y="14" fontSize="5" fontWeight="700" fontFamily="Arial,sans-serif"
            fill="#444" letterSpacing="1">NAHOŘE</text>

          {/* 1. Převis + Bizár — jeden spojený schodový tvar */}
          <polygon points="9,34 137,34 137,20 201,20 201,52 9,52"
            fill={f(1)} stroke={st(1)} strokeWidth="1.5"/>
          <text x="70" y="45" textAnchor="middle" fontSize="8" fontWeight="900"
            fontFamily="Arial Black,sans-serif" fill={lb(1)}>1</text>
          <text x="70" y="55" textAnchor="middle" fontSize="4.5" fontWeight="600"
            fontFamily="Arial,sans-serif" fill={lb(1)} opacity="0.85">Převis / Bizár</text>

          {/* 3. Nový profil — jeden polygon (zkosený blok + spodní proužek spojeny) */}
          <polygon points="212,9 291,9 291,108 274,108 274,78 260,64 212,40"
            fill={f(3)} stroke={st(3)} strokeWidth="1.5"/>
          <text x="263" y="34" textAnchor="middle" fontSize="8" fontWeight="900"
            fontFamily="Arial Black,sans-serif" fill={lb(3)}>3</text>
          <text x="263" y="44" textAnchor="middle" fontSize="4.5" fontWeight="600"
            fontFamily="Arial,sans-serif" fill={lb(3)} opacity="0.85">Nový profil</text>
          <text x="282" y="100" textAnchor="middle" fontSize="5.5" fontWeight="900"
            fontFamily="Arial Black,sans-serif" fill={lb(3)}>3</text>

          {/* 3. Šedá kolmice — chybějící část sektoru 3, úzký vertikální proužek */}
          <rect x="193" y="56" width="18" height="52" rx="1"
            fill={f(3)} stroke={st(3)} strokeWidth="1.5"/>
          <text x="202" y="82" textAnchor="middle" fontSize="5.5" fontWeight="900"
            fontFamily="Arial Black,sans-serif" fill={lb(3)}>3</text>
          <text x="202" y="91" textAnchor="middle" fontSize="3.5" fontWeight="600"
            fontFamily="Arial,sans-serif" fill={lb(3)} opacity="0.85">Šedá</text>
          <text x="202" y="99" textAnchor="middle" fontSize="3.5" fontWeight="600"
            fontFamily="Arial,sans-serif" fill={lb(3)} opacity="0.85">kolmice</text>

          {/* 4. Hříbek — přesný kosočtverec, nezasahuje do jiných profilů */}
          <polygon points="115,56 190,82 115,108 40,82"
            fill={f(4)} stroke={st(4)} strokeWidth="1.5"/>
          <text x="115" y="78" textAnchor="middle" fontSize="9" fontWeight="900"
            fontFamily="Arial Black,sans-serif" fill={lb(4)}>4</text>
          <text x="115" y="89" textAnchor="middle" fontSize="5" fontWeight="600"
            fontFamily="Arial,sans-serif" fill={lb(4)} opacity="0.85">Hříbek</text>

          {/* ══ DOLNÍ PATRO — sektory 2 vlevo, 5 vpravo, uprostřed místo ══ */}
          <text x="12" y="122" fontSize="5" fontWeight="700" fontFamily="Arial,sans-serif"
            fill="#444" letterSpacing="1">DOLE</text>

          {/* 2. Kout / Strop — levá strana */}
          <rect x="9" y="126" width="80" height="88" rx="1"
            fill={f(2)} stroke={st(2)} strokeWidth="1.5"/>
          <text x="49" y="168" textAnchor="middle" fontSize="9" fontWeight="900"
            fontFamily="Arial Black,sans-serif" fill={lb(2)}>2</text>
          <text x="49" y="179" textAnchor="middle" fontSize="4.5" fontWeight="600"
            fontFamily="Arial,sans-serif" fill={lb(2)} opacity="0.85">Kout / Strop</text>

          {/* 5. Dole kolmice — vertikální proužek vpravo, uprostřed místo */}
          <rect x="205" y="126" width="52" height="88" rx="1"
            fill={f(5)} stroke={st(5)} strokeWidth="1.5"/>
          <text x="231" y="168" textAnchor="middle" fontSize="9" fontWeight="900"
            fontFamily="Arial Black,sans-serif" fill={lb(5)}>5</text>
          <text x="231" y="179" textAnchor="middle" fontSize="4.5" fontWeight="600"
            fontFamily="Arial,sans-serif" fill={lb(5)} opacity="0.85">Kolmice / Převis</text>
        </svg>
      );
    }


    // ── Limit floor plan ─────────────────────────────────────────────────
    // Sectors per the PDF plan:
    //  1 = Dětská (left, 4 setters)   2 = Přední převis (center-lower, 3 setters)
    //  3 = Zadní převis (center-upper, 3 setters)   4 = Kolmice (right, 4 setters)
    function getLimitSectors(sectorName) {
      if (!sectorName) return new Set();
      const s = sectorName.toLowerCase();
      const out = new Set();
      if (s.includes('dět') || s.includes('det'))   out.add(1);
      if (s.includes('přev') || s.includes('prev')) {
        const isZadni  = s.includes('zadní') || s.includes('zadni');
        const isPredni = s.includes('přední') || s.includes('predni');
        if (isZadni && !isPredni)       out.add(3);          // Zadní převis only
        else if (isPredni && !isZadni)  out.add(2);          // Přední převis only
        else                            { out.add(2); out.add(3); } // generic → both
      }
      if (s.includes('kolm'))                        out.add(4);
      return out;
    }
    function getWedSlotCount(sectorName) {
      if (!sectorName) return 4;
      const s = sectorName.toLowerCase();
      if (s.includes('zadní') || s.includes('zadni')) return 4; // Zadní převis: 4 stavěči
      if (s.includes('přev') || s.includes('prev')) return 3;   // Přední převis: 3 stavěči
      return 4; // Dětská a Kolmice: 4 stavěči
    }
    function getLanovkaSlotCount(sector) {
      if (!sector) return 4;
      const s = sector.toLowerCase();
      if (s.includes('hříbek') || s.includes('hribek')) return 4;
      if (s.includes('převis') && s.includes('biz'))    return 3;
      if (s.includes('nový')   || s.includes('novy'))   return 3;
      return 2; // Dole kout+Strop, Dole kolmice+převis
    }
    // Kapacita jednoho konkrétního stavění: ve Správě jde ubrat/přidat místo (Cyril 8. 11.).
    // Týden nese volitelné monSlotCount / wedSlotCount / thuSlotCount (chybí nebo null = výchozí podle sektoru)
    // a monLanoSlotCount (0 = lano ten týden bez místa, 1 = lano navíc i v týdnu, kdy se podle rozpisu lano nestaví — Cyril 9. 11.).
    // Stará appka index.html tato pole ignoruje.
    const capOk = v => Number.isInteger(v) && v >= 0;
    const capMon = (wd, sector) => (capOk(wd?.monSlotCount) ? wd.monSlotCount : getLanovkaSlotCount(sector));
    const capWed = (wd, sector) => (capOk(wd?.wedSlotCount) ? wd.wedSlotCount : getWedSlotCount(sector));
    const capThu = wd => (capOk(wd?.thuSlotCount) ? wd.thuSlotCount : 2);
    const lanoOn = (monday, wd) => (wd?.monLanoSlotCount === 1 ? true : wd?.monLanoSlotCount === 0 ? false : hasLanoBuild(monday));

    function LimitFloorPlan({ activeSectors }) {
      const as = activeSectors || new Set();
      const aF = '#E21074', iF = '#2c2c2e';
      const aS = '#ff4db5', iS = '#3a3a3c';
      const aL = '#fff',    iL = '#666';
      const f  = n => as.has(n) ? aF : iF;
      const st = n => as.has(n) ? aS : iS;
      const lb = n => as.has(n) ? aL : iL;
      // 3 equal columns (each 84px), 13px gaps, 6px margin → viewBox 300
      const cw = 84, g = 13, m = 6;
      const x1 = m, x2 = m + cw + g, x3 = m + 2*(cw + g);
      const cx1 = x1 + cw/2, cx2 = x2 + cw/2, cx3 = x3 + cw/2;
      return (
        <svg viewBox="0 0 300 185" xmlns="http://www.w3.org/2000/svg" className="w-full">
          <rect width="300" height="185" fill="#111113" rx="8"/>

          {/* 1. Dětská */}
          <polygon points={`${x1+5},6 ${x1+cw-5},6 ${x1+cw},179 ${x1},179`}
            fill={f(1)} stroke={st(1)} strokeWidth="1.5"/>
          <text x={cx1} y="86" textAnchor="middle" fontSize="13" fontWeight="900"
            fontFamily="Arial Black,sans-serif" fill={lb(1)}>1</text>
          <text x={cx1} y="100" textAnchor="middle" fontSize="6.5" fontWeight="700"
            fontFamily="Arial,sans-serif" fill={lb(1)} opacity="0.8">Dětská</text>
          <text x={cx1} y="111" textAnchor="middle" fontSize="6" fontWeight="600"
            fontFamily="Arial,sans-serif" fill={lb(1)} opacity="0.5">4 stavěči</text>

          {/* 3. Zadní převis */}
          <rect x={x2} y="18" width={cw} height="64" rx="2"
            fill={f(3)} stroke={st(3)} strokeWidth="1.5"/>
          <text x={cx2} y="44" textAnchor="middle" fontSize="11" fontWeight="900"
            fontFamily="Arial Black,sans-serif" fill={lb(3)}>3</text>
          <text x={cx2} y="57" textAnchor="middle" fontSize="6.5" fontWeight="700"
            fontFamily="Arial,sans-serif" fill={lb(3)} opacity="0.8">Zadní převis</text>
          <text x={cx2} y="68" textAnchor="middle" fontSize="6" fontWeight="600"
            fontFamily="Arial,sans-serif" fill={lb(3)} opacity="0.5">3 stavěči</text>

          {/* 2. Přední převis */}
          <rect x={x2} y="103" width={cw} height="64" rx="2"
            fill={f(2)} stroke={st(2)} strokeWidth="1.5"/>
          <text x={cx2} y="129" textAnchor="middle" fontSize="11" fontWeight="900"
            fontFamily="Arial Black,sans-serif" fill={lb(2)}>2</text>
          <text x={cx2} y="143" textAnchor="middle" fontSize="6.5" fontWeight="700"
            fontFamily="Arial,sans-serif" fill={lb(2)} opacity="0.8">Přední převis</text>
          <text x={cx2} y="154" textAnchor="middle" fontSize="6" fontWeight="600"
            fontFamily="Arial,sans-serif" fill={lb(2)} opacity="0.5">3 stavěči</text>

          {/* 4. Kolmice */}
          <rect x={x3} y="6" width={cw} height="173" rx="2"
            fill={f(4)} stroke={st(4)} strokeWidth="1.5"/>
          <text x={cx3} y="86" textAnchor="middle" fontSize="11" fontWeight="900"
            fontFamily="Arial Black,sans-serif" fill={lb(4)}>4</text>
          <text x={cx3} y="100" textAnchor="middle" fontSize="6.5" fontWeight="700"
            fontFamily="Arial,sans-serif" fill={lb(4)} opacity="0.8">Kolmice</text>
          <text x={cx3} y="112" textAnchor="middle" fontSize="6" fontWeight="600"
            fontFamily="Arial,sans-serif" fill={lb(4)} opacity="0.5">4 stavěči</text>
        </svg>
      );
    }

    // ── YearPlan ─────────────────────────────────────────────────────────
    function YearPlan({ data, rotationShifts }) {
      const MONTHS_CS = ['Leden','Únor','Březen','Duben','Květen','Červen','Červenec','Srpen','Září','Říjen','Listopad','Prosinec'];
      const lanovkaKey = [
        { n:'L1', label:'Převis + Bizár',               slots:3 },
        { n:'L2', label:'Dole kout + Strop',            slots:2 },
        { n:'L3', label:'Nový profil + nahoře kolmice', slots:3 },
        { n:'L4', label:'Hříbek',                       slots:4 },
        { n:'L5', label:'Dole kolmice + převis',        slots:2 },
      ];
      const limitKey = [
        { label:'Dětská' }, { label:'Přední převis' }, { label:'Zadní převis' }, { label:'Kolmice' }, { label:'Volno', off: true },
      ];

      // Dostupné roky jsou roky, pro které existují CAL entries
      const availableYears = Array.from(new Set(
        Object.keys(CAL).map(k => Number(k.slice(0, 4)))
      )).sort();
      const [year, setYear] = useState(() => {
        const nowYear = new Date().getFullYear();
        return availableYears.includes(nowYear) ? nowYear : availableYears[0];
      });

      // Build monthly data from CAL
      const monthly = Array.from({length:12}, () => ({ lanovka:[], limit:[], gym:0 }));
      Object.entries(CAL).sort().forEach(([key, entry]) => {
        const mon = new Date(key + 'T12:00:00'); // T12:00:00 aby se ISO date neparsoval jako UTC (timezone shift)
        if (mon.getFullYear() !== year) return;
        const dayName = d => d.toLocaleString('cs-CZ', { weekday: 'long' });
        const wd = data?.[key] || {};
        const eMon = effSector('mon', key, data, rotationShifts);
        const eWed = effSector('wed', key, data, rotationShifts);
        if (eMon && !eMon.isOff && eMon.sector) {
          const lanD = wd.monDateOverride ? new Date(wd.monDateOverride + 'T12:00:00') : addDays(mon, lanovkaOffset(mon));
          monthly[lanD.getMonth()].lanovka.push({ day: lanD.getDate(), dayName: dayName(lanD), sector: eMon.sector });
        }
        if (eWed && !eWed.isOff && eWed.sector) {
          const wedD = wd.wedDateOverride ? new Date(wd.wedDateOverride + 'T12:00:00') : addDays(mon, limitOffset(mon, eWed.sector));
          monthly[wedD.getMonth()].limit.push({ day: wedD.getDate(), dayName: dayName(wedD), sector: eWed.sector });
        }
        if (entry.thu) {
          const thuD = addDays(mon, gymOffset(mon));
          monthly[thuD.getMonth()].gym += 1;
        }
      });

      // Den stavění se počítá z lanovkaOffset/limitOffset/gymOffset pro zvolený rok — nic natvrdo.
      // Když se během roku změní (2026: od září), připíše se „od 1. 9. úterý".
      const DAYS = ['pondělí', 'úterý', 'středa', 'čtvrtek', 'pátek', 'sobota', 'neděle'];
      const yearKeys = Object.keys(CAL).sort().filter(k => Number(k.slice(0, 4)) === year);
      const dayRule = (off, note) => yearKeys.reduce((segs, k) => {
          const m = new Date(k + 'T12:00:00'), o = off(m), id = o + '|' + (note ? note(m) : '');
          const last = segs[segs.length - 1];
          if (!last || last.id !== id) segs.push({ id, o, n: note ? note(m) : '', from: m });
          return segs;
        }, [])
        .map((sg, i) => (i === 0 ? '' : `od 1. ${sg.from.getMonth() + 1}. `) + DAYS[sg.o] + sg.n).join(', ');
      const lanDay = dayRule(m => lanovkaOffset(m));
      const limDay = dayRule(m => limitOffset(m, 'Kolmice'),
        m => (limitOffset(m, 'Dětská') !== limitOffset(m, 'Kolmice') ? ` (Dětská ${DAYS[limitOffset(m, 'Dětská')]})` : ''));
      const gymDay = dayRule(m => gymOffset(m));
      // léto: když Lanovka v červenci/srpnu některý týden nestaví, střídá se s Limitem
      const summerAlt = yearKeys.filter(k => k.slice(5, 7) === '07' || k.slice(5, 7) === '08')
        .some(k => { const e = effSector('mon', k, data, rotationShifts); return !e || e.isOff || !e.sector; });
      // nejbližší termín každého sektoru z rotace (od dnešního týdne dál)
      const todayIso = (d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`)(new Date());
      const nextOf = (venue, label) => {
        for (const k of Object.keys(CAL).sort()) {
          const mon = new Date(k + 'T12:00:00');
          if (addDays(mon, 6) < new Date(todayIso + 'T00:00:00')) continue;
          const e = effSector(venue, k, data, rotationShifts);
          if (!e || e.isOff || e.sector !== label) continue;
          const wd = data?.[k] || {}, ov = venue === 'mon' ? wd.monDateOverride : wd.wedDateOverride;
          const d = ov ? new Date(ov + 'T12:00:00') : addDays(mon, venue === 'mon' ? lanovkaOffset(mon) : limitOffset(mon, e.sector));
          if (d >= new Date(todayIso + 'T00:00:00')) return d;
        }
        return null;
      };
      const short = d => `${d.toLocaleString('cs-CZ', { weekday: 'short' })} ${d.getDate()}. ${d.getMonth() + 1}.`;
      const RotPanel = ({ title, theme, hex, day, note, rows }) => {
        const near = rows.filter(r => r.next).sort((a, b) => a.next - b.next)[0];
        return (
          <section>
            <h3 className="flex flex-wrap items-center gap-x-2.5 text-base font-bold text-brand-text">
              <VMark theme={theme} size={12} />{title}<span className="w-full sm:w-auto pl-[22px] sm:pl-0 font-normal text-brand-muted"><span className="hidden sm:inline">· </span>{day}</span>
            </h3>
            {note && <p className="mt-1 text-sm text-brand-muted">{note}</p>}
            <div className="mt-3">
              {rows.map((r, i) => (
                <div key={i} className={`relative grid grid-cols-[1.75rem_minmax(0,1fr)_auto] sm:grid-cols-[1.75rem_minmax(0,1fr)_auto_7rem] items-center gap-x-3 gap-y-0.5 py-2.5 pl-3 border-b border-white/[0.06] last:border-0 ${r.off ? 'text-brand-muted' : 'text-brand-text'}`}>
                  {r === near && <span className="absolute left-0 top-2 bottom-2 w-0.5 rounded-full" style={{ background: hex }} title="nejbližší" />}
                  <span className="text-xs text-brand-muted tnum">{i + 1}.</span>
                  <span className={`text-[15px] ${r.off ? '' : 'font-semibold'}`}>{r.label}</span>
                  <span className="flex items-center gap-1 justify-end" title={r.slots ? `${r.slots} stavěči` : undefined}>
                    {Array.from({ length: r.slots || 0 }, (_, k) => <VMark key={k} theme={theme} size={9} />)}
                  </span>
                  <span className="col-start-2 sm:col-start-auto text-[13px] text-brand-muted tnum sm:text-right">
                    {r.off ? 'bez stavění' : r.next ? <>příště <span className={r === near ? 'text-brand-text font-semibold' : ''}>{short(r.next)}</span></> : '—'}
                  </span>
                </div>
              ))}
            </div>
          </section>
        );
      };

      return (
        <div className="mt-2 space-y-5">
          {/* Year selector */}
          {availableYears.length > 1 && (
            <div className="flex items-center justify-center gap-2">
              {availableYears.map(y => (
                <button key={y} onClick={() => setYear(y)}
                  className={`px-4 py-1.5 rounded-badge text-sm font-black tabular-nums transition-colors
                    ${year === y
                      ? 'bg-brand-text text-brand-bg'
                      : 'bg-brand-surface-2 text-brand-muted hover:bg-brand-border'}`}>
                  {y}
                </button>
              ))}
            </div>
          )}

          {/* Rotace: hlavička (stěna, den, krátká věta) a řádky sektorů v pořadí rotace */}
          <div className="grid lg:grid-cols-2 gap-x-12 gap-y-8 pb-2">
            <RotPanel title="Lanovka" theme="yellow" hex="#FFC83D" day={lanDay}
              note={`${summerAlt ? 'V létě (červenec–srpen) se střídá s Limitem. ' : ''}Lano jednou za 14 dní.`}
              rows={lanovkaKey.map(r => ({ label: r.label, slots: r.slots, next: nextOf('mon', r.label) }))} />
            <RotPanel title="Limit" theme="dark" hex="#E21074" day={limDay}
              note={summerAlt ? 'V létě (červenec–srpen) se střídá s Lanovkou.' : null}
              rows={limitKey.map(r => (r.off ? { label: r.label, off: true } : { label: r.label, slots: getWedSlotCount(r.label), next: nextOf('wed', r.label) }))} />
          </div>

          {/* Three separate wall calendars side by side */}
          <div className="overflow-x-auto">
          <div className="grid grid-cols-3 gap-4 min-w-[30rem]">

            {/* LANOVKA */}
            <div className="rounded-card overflow-hidden border border-venue-lanovka/25">
              <div className="bg-venue-lanovka px-4 py-3">
                <p className="text-sm font-black text-brand-bg uppercase tracking-wider">Lanovka</p>
                <p className="text-xs text-brand-bg/70 mt-0.5">{lanDay}</p>
              </div>
              {MONTHS_CS.map((name, m) => {
                const d = monthly[m];
                if (d.lanovka.length === 0 && d.gym === 0) return (
                  <div key={m} className="px-3 py-2 border-b border-venue-lanovka/25 last:border-0">
                    <span className="text-[10px] font-black text-venue-lanovka uppercase">{name}</span>
                    <span className="text-[11px] text-brand-border-hi ml-2">—</span>
                  </div>
                );
                return (
                  <div key={m} className="px-3 py-2.5 border-b border-venue-lanovka/25 last:border-0 bg-venue-lanovka/10">
                    <p className="text-[10px] font-black text-venue-lanovka uppercase tracking-wide mb-1">{name}</p>
                    {d.lanovka.map((s,i) => (
                      <div key={i} className="mb-0.5">
                        <span className="text-[10px] text-venue-lanovka font-bold">{s.day}. {s.dayName} </span>
                        <span className="text-[11px] font-semibold text-venue-lanovka">{s.sector}</span>
                      </div>
                    ))}
                    {d.gym > 0 && <div className="text-[10px] font-bold text-[#7FA9F0] mt-0.5">Tělocvična ×{d.gym}</div>}
                  </div>
                );
              })}
            </div>

            {/* LIMIT */}
            <div className="rounded-card overflow-hidden border border-brand-border-hi">
              <div className="bg-brand-surface-2 px-4 py-3">
                <p className="text-sm font-black text-brand-accent-lite uppercase tracking-wider">Limit</p>
                <p className="text-xs text-white/30 mt-0.5">{limDay}</p>
              </div>
              {MONTHS_CS.map((name, m) => {
                const d = monthly[m];
                if (d.limit.length === 0) return (
                  <div key={m} className="px-3 py-2 border-b border-brand-border last:border-0 bg-brand-surface-2">
                    <span className="text-[10px] font-black text-brand-muted uppercase">{name}</span>
                    <span className="text-[11px] text-brand-text ml-2">—</span>
                  </div>
                );
                return (
                  <div key={m} className="px-3 py-2.5 border-b border-brand-border last:border-0 bg-brand-surface-2">
                    <p className="text-[10px] font-black text-brand-accent-lite uppercase tracking-wide mb-1">{name}</p>
                    {d.limit.map((s,i) => (
                      <div key={i} className="mb-0.5">
                        <span className="text-[10px] text-brand-accent-lite font-bold">{s.day}. {s.dayName} </span>
                        <span className="text-[11px] font-semibold text-brand-accent-lite">{s.sector}</span>
                      </div>
                    ))}
                  </div>
                );
              })}
            </div>

            {/* TĚLOCVIČNA */}
            <div className="rounded-card overflow-hidden border border-venue-telocvicna/30">
              <div className="bg-venue-telocvicna px-4 py-3">
                <p className="text-sm font-black text-brand-bg uppercase tracking-wider">Tělocvična</p>
                <p className="text-xs text-brand-bg/70 mt-0.5">{gymDay} · každé 4 týdny</p>
              </div>
              {MONTHS_CS.map((name, m) => {
                const d = monthly[m];
                return (
                  <div key={m} className={`px-3 py-2.5 border-b border-venue-telocvicna/25 last:border-0 ${d.gym > 0 ? 'bg-venue-telocvicna/10' : ''}`}>
                    <span className="text-[10px] font-black text-[#7FA9F0] uppercase tracking-wide">{name}</span>
                    {d.gym > 0
                      ? <span className="text-[11px] font-bold text-[#7FA9F0] ml-2">×{d.gym}</span>
                      : <span className="text-[11px] text-brand-border-hi ml-2">—</span>}
                  </div>
                );
              })}
            </div>

          </div>
          </div>{/* end overflow-x-auto */}
        </div>
      );
    }

    // ── MonthCalendar — měsíční mřížka pod stěnami (jen profily) ──────────
    // Kalendář (Cyril 9. 11.): stavění vyplní celé pole dne a je klikací → stejný detail a úpravy jako v Kam se zapsat (onPick).
    // Den bez stavění klikací není; svátek a prázdniny jsou tichý podklad s řádkem u čísla dne, ne štítek.
    function MonthCalendar({ data, viewMonday, rotationShifts, extras, races, role, stickyTop, flashMon, onPick, picked, me, dayTags = {}, compact }) {
      // Telefon (compact): mřížka jen s čísly a značkami stěn, ťuknutí na den ukáže pod měsícem jeho stavění (vzor Cron z Referu)
      const [openDay, setOpenDay] = React.useState(null);
      const MONTHS_CS = ['Leden','Únor','Březen','Duben','Květen','Červen','Červenec','Srpen','Září','Říjen','Listopad','Prosinec'];
      const base = viewMonday instanceof Date ? viewMonday : new Date();
      const year = base.getFullYear();
      const month = base.getMonth();
      const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;

      // Mapa datum → seznam stavění (jen profil + barva stěny), z efektivní rotace
      const sessions = {};
      const add = (k, s) => { (sessions[k] = sessions[k] || []).push(s); };
      const mon0 = getMonday(new Date());
      Object.keys(CAL).forEach(wk => {
        const mondayD = new Date(wk + 'T12:00:00');
        const wd = data[wk] || {};
        const wi = Math.round((getMonday(mondayD) - mon0) / 604800000);  // offset týdne pro detail
        const slots = (arr, n) => Array.from({ length: n }, (_, k) => (arr || [])[k] ?? null);
        const eMon = effSector('mon', wk, data, rotationShifts);
        if (eMon && !eMon.isOff && eMon.sector) {
          const d = wd.monDateOverride ? new Date(wd.monDateOverride + 'T12:00:00') : addDays(mondayD, lanovkaOffset(mondayD));
          if (role === 'sund' || role === 'oboje') add(iso(addDays(d, -1)), { wall: 'Sundávání Lanovka', sector: eMon.sector, theme: 'yellow', muted: true,
            pick: { kind: 'sund', i: wi, target: 'lanovka' }, names: wd.mondaySundavaci || [], myti: wd.mondayMyti || null });
          if (role !== 'sund') { const n = capMon(wd, eMon.sector), lano = lanoOn(getMonday(mondayD), wd);  // půlnoc, jinak lichý týden lana zaokrouhlí špatně
            add(iso(d), { wall: 'Lanovka', sector: eMon.sector, theme: 'yellow', pick: { kind: 'build', i: wi, target: 'lanovka' },
              regular: slots(wd.monday, n), lano: lano ? (wd.mondayLano ?? null) : undefined }); }
        }
        const eWed = effSector('wed', wk, data, rotationShifts);
        if (eWed && !eWed.isOff && eWed.sector) {
          const d = wd.wedDateOverride ? new Date(wd.wedDateOverride + 'T12:00:00') : addDays(mondayD, limitOffset(mondayD, eWed.sector));
          if (role === 'sund' || role === 'oboje') add(iso(addDays(d, -1)), { wall: 'Sundávání Limit', sector: eWed.sector, theme: 'dark', muted: true,
            pick: { kind: 'sund', i: wi, target: 'limit' }, names: wd.wednesdaySundavaci || [], myti: wd.wednesdayMyti || null });
          if (role !== 'sund') add(iso(d), { wall: 'Limit', sector: eWed.sector, theme: 'dark', pick: { kind: 'build', i: wi, target: 'limit' },
            regular: slots(wd.wednesday, capWed(wd, eWed.sector)) });
        }
        const cThu = CAL[wk]?.thu;
        if (role !== 'sund' && cThu && !cThu.isOff && cThu.sector) {
          const d = wd.thuDateOverride ? new Date(wd.thuDateOverride + 'T12:00:00') : addDays(mondayD, gymOffset(mondayD));
          add(iso(d), { wall: 'Tělocvična', sector: cThu.sector, theme: 'green', pick: { kind: 'build', i: wi, target: 'telocvicna' }, regular: slots(wd.thursday, capThu(wd)) });
        }
      });
      // Extra stavění — mimo rotaci, výraznější odstín + „+" prefix
      Object.values(extras || {}).forEach(ex => {
        if (!ex?.date || role === 'sund') return;
        const isLan = ex.venue === 'lanovka';
        const label = (ex.sectors || []).join(' + ') || (ex.lano ? 'Lano' : ex.name || 'Extra');
        add(ex.date, {
          wall: `Extra · ${isLan ? 'Lanovka' : 'Limit'}`, kind: 'Extra',
          sector: ex.name ? `${ex.name} · ${ex.lano && (ex.sectors || []).length ? `${label} + Lano` : label}` : (ex.lano && (ex.sectors || []).length ? `${label} + Lano` : label),
          theme: isLan ? 'yellow' : 'dark', pick: { kind: 'extra', date: ex.date, venue: ex.venue },
          regular: Array.from({ length: ex.slotCount || 0 }, (_, k) => (ex.setters || [])[k] ?? null),
          lano: extraHasLanoSlot(ex) ? (ex.lanoSetter || null) : undefined,
        });
      });
      // Závody (Cyril 9. 11.: „v kalendáři se neukazují závody"): dny závodu (Den 1, 2…), dostavby a sundávání den před závodem.
      // Závod je vždy Limit (čtvereček, malinová); klik otevře totéž co v Závodech a extra (týden v Plánu s detailem).
      const rList = Object.values(races || {}).filter(r => r?.date).sort((a, b) => a.date.localeCompare(b.date));
      const rGroups = [];
      rList.forEach(r => { const g = rGroups[rGroups.length - 1];
        if (g && (new Date(r.date + 'T12:00:00') - new Date(g[g.length - 1].date + 'T12:00:00')) / 86400000 <= 1) g.push(r); else rGroups.push([r]); });
      const pad = (arr, n) => Array.from({ length: n || 0 }, (_, k) => (arr || [])[k] ?? null);
      rGroups.forEach(g => {
        const name = g.map(r => r.name).find(Boolean) || 'Závod';
        g.forEach((r, k) => {
          const sundDay = iso(addDays(new Date(r.date + 'T12:00:00'), -1));
          if ((role === 'sund' || role === 'oboje') && (k === 0 || (r.sundavaci || []).length || r.myti))
            add(sundDay, { wall: 'Sundávání Limit', kind: 'Závod', sector: `${name} · před závodem`, theme: 'dark', muted: true,
              pick: { kind: 'race', date: r.date, part: 'sund' }, names: r.sundavaci || [], myti: r.myti || null });
          if (role !== 'sund') {
            add(r.date, { wall: g.length > 1 ? `Závod · Den ${k + 1}` : 'Závod', kind: 'Závod', sector: name, theme: 'dark',
              pick: { kind: 'race', date: r.date }, regular: pad(r.setters, r.slotCount) });
            (r.dostavba || []).forEach(day => day?.date && add(day.date, { wall: 'Dostavba', kind: 'Závod', sector: name, theme: 'dark',
              pick: { kind: 'race', date: r.date, dost: day.date }, regular: pad(day.setters, day.slotCount) }));
          }
        });
      });

      // Mřížka pondělím počínaje
      const first = new Date(year, month, 1);
      const startDow = (first.getDay() + 6) % 7; // Po=0 … Ne=6
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const rows = Math.ceil((startDow + daysInMonth) / 7);
      const gridStart = addDays(first, -startDow);
      const cells = Array.from({ length: rows * 7 }, (_, i) => addDays(gridStart, i));
      const today = new Date(); today.setHours(0,0,0,0);
      const dayHdr = ['Po','Út','St','Čt','Pá','So','Ne'];

      return (
        <div className="bg-brand-surface rounded-card">
          <div className={`px-4 pt-4 pb-2 border-b border-brand-border flex items-center justify-between rounded-t-card ${stickyTop != null ? 'sticky z-10 bg-brand-surface' : ''}`} style={stickyTop != null ? { top: stickyTop } : undefined}>
            <h2 className="font-bold text-brand-text text-sm capitalize">{MONTHS_CS[month]} {year}</h2>
            <div className="flex flex-wrap items-center gap-x-2 gap-y-1 text-[10px] font-bold justify-end">
              <span className="flex items-center gap-1"><VMark theme="yellow" size={9} />Lanovka</span>
              <span className="flex items-center gap-1"><VMark theme="dark" size={9} />Limit</span>
              {role !== 'sund' && <span className="flex items-center gap-1"><VMark theme="green" size={9} />Těloc.</span>}
              <span className="hidden lg:flex items-center gap-1"><span className="w-2.5 h-2.5 rounded-badge bg-bad/25 inline-block"/>svátek</span>
              <span className="hidden lg:flex items-center gap-1"><span className="w-2.5 h-2.5 rounded-badge bg-white/15 inline-block"/>prázdniny</span>
            </div>
          </div>
          <div className="p-2">
            <div className="grid grid-cols-7 gap-1">
              {dayHdr.map((d,i) => (
                <div key={`h${i}`} className={`text-center text-[10px] font-bold uppercase tracking-wide pb-1 ${i>=5 ? 'text-brand-border-hi' : 'text-brand-muted'}`}>{d}</div>
              ))}
              {cells.map((d, i) => {
                const inMonth = d.getMonth() === month;
                const k = iso(d);
                const evs = sessions[k] || [];
                const isToday = d.getTime() === today.getTime();
                const weekend = (d.getDay() === 0 || d.getDay() === 6);
                const sh = inMonth ? stateHoliday(d) : null;   // státní svátek
                const bh = inMonth ? schoolHoliday(d) : null;  // školní prázdniny
                // tichý podklad: svátek do červena, prázdniny světlejší, víkend tmavší; text jen řádkem u čísla dne
                const dayBg = !inMonth ? 'bg-transparent border-transparent'
                  : sh ? 'bg-bad/[0.07] border-bad/25'
                  : bh ? 'bg-white/[0.035] border-brand-border'
                  : weekend ? 'bg-brand-surface-2/60 border-brand-border'
                  : 'bg-brand-surface border-brand-border';
                const dayNumCls = !inMonth ? 'text-brand-border-hi'
                  : isToday ? 'text-brand-accent-lite'
                  : sh ? 'text-bad' : 'text-brand-muted';
                const kmon = iso(addDays(d, -((d.getDay() + 6) % 7)));
                const note = sh || (bh && bh !== 'letní prázdniny' ? bh : null);
                const show = inMonth ? evs : [];
                if (compact) {
                  const on = openDay === k;
                  return (
                    <button key={i} type="button" data-day={inMonth ? k : undefined} disabled={!show.length}
                      onClick={() => setOpenDay(on ? null : k)} aria-pressed={on}
                      className={`h-[52px] rounded-ctl flex flex-col items-center justify-start pt-1.5 gap-1 transition-colors ${dayBg.split(' ').filter(c => c.startsWith('bg-')).join(' ')}
                        ${on ? 'ring-2 ring-inset ring-brand-text' : isToday ? 'ring-2 ring-inset ring-brand-accent' : ''} ${show.length ? 'active:bg-white/10' : ''}`}>
                      <span className={`text-[13px] font-semibold leading-none tnum ${dayNumCls}`}>{d.getDate()}</span>
                      {show.length > 0 && <span className="flex items-center gap-[3px]">{show.slice(0, 3).map((e, j) => <VMark key={j} theme={e.theme} size={7} outline={e.muted} />)}</span>}
                      {inMonth && dayTags[k] && <span className="w-1 h-1 rounded-full bg-brand-accent" title={dayTags[k]} />}
                    </button>
                  );
                }
                // obrys má celý den v barvě stěny (Cyril 9. 11.: „ne uvnitř toho dne"); sundávání čárkovaně; víc akcí v jednom dni = dělené linkou
                const hex0 = show.length ? venueUi(show[0].theme).hex : null, allMuted = show.length && show.every(e => e.muted);
                const one = show.length === 1;
                const selDay = show.some(e => picked && e.pick && picked.kind === e.pick.kind && picked.i === e.pick.i && picked.target === e.pick.target);
                return (
                  <div key={i} data-kmon={kmon} data-day={inMonth ? k : undefined}
                    title={sh ? `Státní svátek: ${sh}` : bh ? `Prázdniny: ${bh}` : undefined}
                    onClick={one && onPick ? () => onPick(show[0].pick) : undefined}
                    className={`min-h-[64px] lg:min-h-[118px] rounded-ctl p-1 lg:p-1.5 flex flex-col gap-1 transition-[box-shadow,background-color] duration-300
                      ${show.length ? `border-2 ${one ? 'cursor-pointer hover:bg-white/[0.05]' : ''} ${selDay ? 'bg-white/[0.08]' : 'bg-brand-surface'}` : `border ${dayBg}`}
                      ${isToday ? (show.length ? 'outline outline-2 outline-brand-accent outline-offset-1' : 'ring-2 ring-brand-accent ring-inset') : flashMon === kmon ? 'ring-2 ring-brand-text/60 ring-inset' : ''}`}
                    style={show.length ? { borderColor: allMuted ? `color-mix(in srgb, ${hex0} 60%, transparent)` : hex0, borderStyle: allMuted ? 'dashed' : 'solid' } : undefined}>
                    <div className="flex items-baseline gap-1.5 min-w-0 leading-none">
                      <span className={`text-[10px] lg:text-xs font-bold shrink-0 ${dayNumCls}`}>{d.getDate()}</span>
                      {inMonth && note && <span className={`hidden lg:block text-[10px] truncate ${sh ? 'text-bad/80' : 'text-brand-muted'}`}>{note}</span>}
                      {inMonth && dayTags[k] && <span data-change-tag={dayTags[k]} className="ml-auto shrink-0 text-[10px] font-medium px-1.5 py-0.5 rounded-full ring-1 ring-inset ring-brand-accent/60 text-brand-accent-lite">{dayTags[k]}</span>}
                    </div>
                    {show.map((e, j) => {
                      const hex = venueUi(e.theme).hex;
                      const fill = e.muted ? e.names.length : (e.regular || []).filter(Boolean).length + (e.lano ? 1 : 0);
                      const total = e.muted ? null : (e.regular || []).length + (e.lano !== undefined ? 1 : 0);
                      const gap = e.muted ? (!e.names.length || !e.myti) : fill < total;
                      const sel = picked && e.pick && picked.kind === e.pick.kind && picked.i === e.pick.i && picked.target === e.pick.target;
                      const mine = me && (e.muted ? (e.names.includes(me) || e.myti === me) : ((e.regular || []).includes(me) || e.lano === me));
                      return (
                        <button key={j} type="button" onClick={ev => { ev.stopPropagation(); onPick && onPick(e.pick); }} title={`${e.wall}: ${e.sector}`}
                          className={`flex-1 min-h-[34px] w-full text-left whitespace-normal px-0.5 lg:px-1 py-0.5 flex flex-col gap-0.5 lg:gap-1 cursor-pointer
                            focus-visible:outline focus-visible:outline-2 focus-visible:outline-brand-text rounded-[4px]
                            ${one ? '' : `transition-colors hover:bg-white/[0.06] ${sel ? 'bg-white/[0.09]' : ''}`} ${j > 0 ? 'border-t border-white/10 pt-1.5' : ''}`}>
                          <span className="flex items-center gap-1 text-[9px] lg:text-[10px] text-brand-text/75 min-w-0">
                            <VMark theme={e.theme} size={8} outline={e.muted} className="shrink-0" />
                            {e.kind && <span className="shrink-0 text-[9px] font-bold uppercase tracking-[0.06em] px-1 rounded-[3px] bg-brand-accent/25 text-brand-accent-lite">{e.kind}</span>}
                            <span className="hidden lg:inline truncate">{e.muted ? 'sundávání' : e.kind ? e.wall.replace(/^(Závod|Extra)( · )?/, '') : e.wall}</span>
                            {total != null && <span className={`ml-auto tnum shrink-0 ${gap ? 'text-brand-accent-lite font-semibold' : ''}`}>{fill}/{total}</span>}
                          </span>
                          <span className="shrink-0 text-[9px] lg:text-[12px] leading-tight font-semibold text-brand-text line-clamp-2 lg:line-clamp-3 break-words">
                            {e.sector}{mine && <span className="text-brand-accent-lite font-normal"> · ty</span>}</span>
                          <span className="hidden lg:flex mt-auto pt-1 items-center justify-center gap-x-2 gap-y-1 flex-wrap">
                            {e.muted
                              ? <><NameMarks theme={e.theme} names={e.names.length ? e.names : [null]} me={me} /><span className="text-[9px] text-brand-text/60">mytí</span><NameMark theme={e.theme} name={e.myti} me={e.myti && e.myti === me} /></>
                              : <NameMarks theme={e.theme} names={e.regular || []} lano={e.lano} me={me} />}
                          </span>
                          <span className="lg:hidden mt-auto"><SlotMarks theme={e.theme} regular={e.muted ? e.names : (e.regular || [])} lano={e.muted ? undefined : e.lano} size={6} /></span>
                        </button>
                      );
                    })}
                  </div>
                );
              })}
            </div>
            {compact && openDay && sessions[openDay] && (() => {
              const sd = new Date(openDay + 'T12:00:00'), note = stateHoliday(sd) || schoolHoliday(sd);
              return (
                <div className="mt-3 px-1 pb-1 flex flex-col gap-2 animate-fade">
                  <p className="text-[13px] text-brand-muted capitalize">{sd.toLocaleString('cs-CZ', { weekday: 'long' })} {sd.getDate()}. {sd.getMonth() + 1}.{note ? ` · ${note}` : ''}{dayTags[openDay] ? ` · ${dayTags[openDay]}` : ''}</p>
                  {sessions[openDay].map((e, j) => {
                    const fill = e.muted ? e.names.length : (e.regular || []).filter(Boolean).length + (e.lano ? 1 : 0);
                    const total = e.muted ? null : (e.regular || []).length + (e.lano !== undefined ? 1 : 0);
                    const gap = e.muted ? (!e.names.length || !e.myti) : fill < total;
                    return (
                      <button key={j} type="button" onClick={() => onPick && onPick(e.pick)}
                        className="w-full text-left rounded-ctl border-2 px-3 py-2.5 flex flex-col gap-1.5 active:bg-white/5"
                        style={{ borderColor: e.muted ? `color-mix(in srgb, ${venueUi(e.theme).hex} 60%, transparent)` : venueUi(e.theme).hex, borderStyle: e.muted ? 'dashed' : 'solid' }}>
                        <span className="flex items-center gap-2 text-[13px] text-brand-text/80">
                          <VMark theme={e.theme} size={9} outline={e.muted} />
                          {e.kind && <span className="text-[10px] font-bold uppercase tracking-[0.06em] px-1.5 py-0.5 rounded-[3px] bg-brand-accent/25 text-brand-accent-lite">{e.kind}</span>}
                          {e.muted ? `Sundávání · ${e.wall.replace('Sundávání ', '')}` : e.kind ? e.wall.replace(/^(Závod|Extra)( · )?/, '') : e.wall}
                          {total != null && <span className={`ml-auto tnum ${gap ? 'text-brand-accent-lite font-semibold' : ''}`}>{fill}/{total}</span>}
                        </span>
                        <span className="text-[15px] font-semibold text-brand-text">{e.sector}</span>
                        <span className="flex items-center gap-2 flex-wrap">
                          {e.muted
                            ? <><NameMarks theme={e.theme} names={e.names.length ? e.names : [null]} me={me} size={20} /><span className="text-[11px] text-brand-text/60">mytí</span><NameMark theme={e.theme} name={e.myti} me={e.myti && e.myti === me} size={20} /></>
                            : <NameMarks theme={e.theme} names={e.regular || []} lano={e.lano} me={me} size={20} />}
                        </span>
                      </button>
                    );
                  })}
                </div>
              );
            })()}
          </div>
        </div>
      );
    }

    // ── MonthlyOccupancy ─────────────────────────────────────────────────
    function MonthlyOccupancy({ data, viewMonday, rotationShifts, extras }) {
      // Zobrazené 3 měsíce vychází z týdne, na který se uživatel právě dívá
      const base = viewMonday instanceof Date ? viewMonday : new Date();
      const months = [0, 1, 2].map(offset => {
        const d = new Date(base.getFullYear(), base.getMonth() + offset, 1);
        return { year: d.getFullYear(), month: d.getMonth() }; // 0-indexed
      });

      return (
        <div className="bg-brand-surface rounded-card overflow-hidden">
          <div className="px-4 pt-4 pb-2 border-b border-brand-border">
            <h2 className="text-[15px] font-medium text-brand-text">Obsazenost po měsících</h2>
          </div>
          <div className="p-4 grid gap-x-6 gap-y-4 sm:grid-cols-3">
            {months.map(({ year, month }) => {
              // Compute occupancy for this month
              let monSetterFill = 0, monSetterTotal = 0;
              let monLanoFill  = 0, monLanoTotal  = 0;
              let wedFill = 0, wedTotal = 0;
              let thuFill = 0, thuTotal = 0;

              Object.keys(CAL).forEach(k => {
                const [ky, km, kd] = k.split('-').map(Number);
                const monDate = new Date(ky, km - 1, kd);
                const calEntry = CAL[k];
                const wd = data[k] ?? { monday: [], mondayLano: null, wednesday: [], thursday: [] };
                // Efektivní sektor: override / shift-list / výpočet z CAL sekvence
                const effMon = effSector('mon', k, data, rotationShifts);
                const effWed = effSector('wed', k, data, rotationShifts);
                const wOff = limitOffset(monDate, effWed?.sector);
                const lOff = lanovkaOffset(monDate);

                // Lanovka — pondělí (do srpna 2026) / úterý (od září 2026)
                if (effMon && !effMon.isOff) {
                  const sessionDate = addDays(monDate, lOff);
                  if (sessionDate.getFullYear() === year && sessionDate.getMonth() === month) {
                    const maxSlots = capMon(wd, effMon.sector);
                    monSetterTotal += maxSlots;
                    monSetterFill  += (wd.monday || []).slice(0, maxSlots).filter(Boolean).length;
                    if (lanoOn(monDate, wd)) {
                      monLanoTotal += 1;
                      monLanoFill  += wd.mondayLano ? 1 : 0;
                    }
                  }
                }
                // Limit — Wed (+2) or Thu (+3 for Dětská)
                if (effWed && !effWed.isOff && effWed.sector !== 'Volno') {
                  const sessionDate = addDays(monDate, wOff);
                  if (sessionDate.getFullYear() === year && sessionDate.getMonth() === month) {
                    const maxSlots = capWed(wd, effWed.sector);
                    wedTotal += maxSlots;
                    wedFill += (wd.wednesday || []).slice(0, maxSlots).filter(Boolean).length;
                  }
                }
                // Tělocvična — Thursday (+3)
                if (calEntry?.thu && !calEntry.thu.isOff) {
                  const sessionDate = addDays(monDate, gymOffset(monDate));
                  if (sessionDate.getFullYear() === year && sessionDate.getMonth() === month) {
                    thuTotal += capThu(wd);
                    thuFill += (wd.thursday || []).slice(0, capThu(wd)).filter(Boolean).length;
                  }
                }
              });

              // Extra stavění — započítáno do obsazenosti své stěny (lano zvlášť)
              Object.values(extras || {}).forEach(ex => {
                if (!ex?.date) return;
                const d = new Date(ex.date + 'T12:00:00');
                if (d.getFullYear() !== year || d.getMonth() !== month) return;
                const n = ex.slotCount || 0;
                const fill = (ex.setters || []).slice(0, n).filter(Boolean).length;
                if (ex.venue === 'lanovka') {
                  if (extraSlotsAreLano(ex)) { monLanoTotal += n; monLanoFill += fill; }
                  else { monSetterTotal += n; monSetterFill += fill; }
                  if (extraHasLanoSlot(ex)) { monLanoTotal += 1; monLanoFill += ex.lanoSetter ? 1 : 0; }
                } else {
                  wedTotal += n; wedFill += fill;
                }
              });

              const pct = (f, t) => t ? Math.round(f / t * 100) : null;
              const monSetterPct = pct(monSetterFill, monSetterTotal);
              const monLanoPct   = pct(monLanoFill,   monLanoTotal);
              const wedPct = pct(wedFill, wedTotal);
              const thuPct = pct(thuFill, thuTotal);
              const monthLabel = new Date(year, month, 1).toLocaleString('cs-CZ', { month: 'long' });

              const Bar = ({ pct, color }) => pct === null ? null : (
                <div className="flex-1 min-w-0 flex items-center gap-1.5">
                  <div className="flex-1 h-2 bg-brand-surface-2 rounded-badge overflow-hidden">
                    <div className={`h-full rounded-badge ${color}`} style={{ width: `${pct}%` }} />
                  </div>
                  <span className="text-[13px] font-bold tabular-nums w-9 text-right text-brand-muted">{pct}%</span>
                </div>
              );

              return (
                <div key={`${year}-${month}`} className="min-w-0">
                  <p className="text-sm font-bold text-brand-text mb-2 capitalize">{monthLabel} {year}</p>
                  {monSetterPct !== null && (
                    <div className="flex items-center gap-2 mb-1.5">
                      <span className="text-[13px] text-brand-text w-[5.5rem] shrink-0 inline-flex items-center gap-2"><VMark hex="#FFC83D" size={10} />Lanovka</span>
                      <Bar pct={monSetterPct} color="bg-venue-lanovka" />
                    </div>
                  )}
                  {monLanoPct !== null && (
                    <div className="flex items-center gap-2 mb-1.5">
                      <span className="text-[13px] text-brand-text w-[5.5rem] shrink-0 inline-flex items-center gap-2"><VMark hex="#FFC83D" size={10} />Lano</span>
                      <Bar pct={monLanoPct} color="bg-venue-lanovka" />
                    </div>
                  )}
                  {wedPct !== null && (
                    <div className="flex items-center gap-2 mb-1.5">
                      <span className="text-[13px] text-brand-text w-[5.5rem] shrink-0 inline-flex items-center gap-2"><VMark hex="#E21074" size={10} />Limit</span>
                      <Bar pct={wedPct} color="bg-brand-accent" />
                    </div>
                  )}
                  {thuPct !== null && (
                    <div className="flex items-center gap-2">
                      <span className="text-[13px] text-brand-text w-[5.5rem] shrink-0 inline-flex items-center gap-2"><VMark hex="#4A86E8" size={10} />Tělocvična</span>
                      <Bar pct={thuPct} color="bg-venue-telocvicna" />
                    </div>
                  )}
                  {monSetterPct === null && wedPct === null && thuPct === null && (
                    <p className="text-sm text-brand-muted">Žádné stavění</p>
                  )}
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    // ── Stěny pro rozpad statistik ───────────────────────────────────────
    // Barvy stejné jako všude jinde v appce: Lanovka žlutá, lano tmavší,
    // Limit růžová, Tělocvična zelená.
    const STENY = [
      { klic: 'lanovka',    label: 'Lanovka',    barva: 'text-venue-lanovka'  },
      { klic: 'lano',       label: 'Lano',       barva: 'text-venue-lanovka'  },
      { klic: 'limit',      label: 'Limit',      barva: 'text-brand-accent-lite'   },
      { klic: 'telocvicna', label: 'Tělocvična', barva: 'text-[#7FA9F0]'},
    ];

    // ── SetterVenueModal ─────────────────────────────────────────────────
    //  Detail statistik: tři měsíce vedle sebe a u každého stavěče rozpad,
    //  na které stěně ty směny odstál. Karta v sidebaru je na tohle úzká —
    //  proto přes celou obrazovku.
    //
    //  Šipky posouvají celou trojici o měsíc, takže se dá dojít i do loňska
    //  i dopředu na to, co je naplánované. Výchozí trojice je minulý / tenhle
    //  / příští měsíc.
    function SetterVenueModal({ onClose, spocitej, jmena, poradi }) {
      const [posun, setPosun] = React.useState(0);
      const dnes = new Date();
      const dnesKlic = `${dnes.getFullYear()}-${dnes.getMonth()}`;
      const mesice = [-1, 0, 1].map(i => {
        const d = new Date(dnes.getFullYear(), dnes.getMonth() + i + posun, 1);
        return { year: d.getFullYear(), month: d.getMonth(), klic: `${d.getFullYear()}-${d.getMonth()}`,
                 label: d.toLocaleString('cs-CZ', { month: 'long' }), rok: d.getFullYear() };
      });
      const stats = spocitej(mesice, jmena);

      // Bunka = jen stěny, na kterých se ten měsíc opravdu stálo. Nuly se
      // nevypisují: prázdné řádky by z tabulky udělaly mřížku nul, ve které
      // se to podstatné ztratí.
      // Souhrn pod rozpadem drží STEJNOU řeč jako karta v sidebaru: lano se do
      // stavění nepočítá, vede se vedle (patička karty to říká — „stavění ·
      // lano"). Kdyby se sečetlo všechno dohromady, mělo by tu září Sebastián 6,
      // kdežto karta hlásí 5, a nikdo by nevěděl, které z těch čísel lže.
      const Bunka = ({ v }) => {
        const staveni = (v?.lanovka || 0) + (v?.limit || 0) + (v?.telocvicna || 0);
        const lano = v?.lano || 0;
        if (!staveni && !lano) return <td className="px-3 py-2.5 align-top text-brand-text text-sm">—</td>;
        return (
          <td className="px-3 py-2.5 align-top">
            {STENY.map(s => (v?.[s.klic] || 0) > 0 && (
              <div key={s.klic} className={`text-[13px] font-semibold whitespace-nowrap ${s.barva}`}>
                {s.label} <span className="tabular-nums">{v[s.klic]}</span>
              </div>
            ))}
            <div className="text-[11px] text-brand-muted tabular-nums mt-1 whitespace-nowrap">
              stavění {staveni}{lano > 0 && <> · lano {lano}</>}
            </div>
          </td>
        );
      };

      const soucet = m => {
        const c = { lanovka: 0, lano: 0, limit: 0, telocvicna: 0 };
        jmena.forEach(n => STENY.forEach(s => { c[s.klic] += stats[n]?.[m.klic]?.[s.klic] || 0; }));
        return c;
      };

      const Sipka = ({ smer, onClick, titulek }) => (
        <button onClick={onClick} title={titulek}
          className="p-2 rounded-ctl text-brand-muted hover:text-white hover:bg-brand-border transition-colors">
          <svg viewBox="0 0 14 14" className="w-4 h-4" aria-hidden="true"
            style={{ transform: smer === 'zpet' ? 'rotate(180deg)' : 'none' }}>
            <polygon points="3,2 11,7 3,12" fill="currentColor" />
          </svg>
        </button>
      );

      // Do body přes portál, ne na místo v DOM. Ostatní modaly appky se
      // vykreslují až v kořeni App a je jim to jedno; tenhle visí na kartě
      // hluboko v sidebaru a odtud ho z-index nezachrání — hlavička appky
      // (fixed z-50) se mu na obrazovce postavila před nadpis, i když má
      // modal z-[100]. Vyzkoušeno: zvednout modal na 200 nepomůže, srazit
      // hlavičku na 0 ano.
      return ReactDOM.createPortal((
        <div className="fixed inset-0 z-[100] flex items-center justify-center p-4">
          <div className="absolute inset-0 bg-black/80 backdrop-blur-sm" onClick={onClose} />
          <div className="relative bg-brand-bg text-white rounded-card max-w-4xl w-full max-h-[90vh] overflow-y-auto border border-brand-border shadow-2xl">
            <div className="px-6 pt-6 pb-4 border-b border-brand-border flex items-start justify-between gap-4">
              <div>
                <h2 className="text-2xl font-black tracking-widest text-venue-lanovka leading-none">KDO KDE STAVÍ</h2>
                <p className="text-[11px] uppercase tracking-widest text-brand-muted mt-2 font-bold">
                  Rozpad směn podle stěny
                </p>
              </div>
              <button onClick={onClose} className="p-2 rounded-ctl hover:bg-brand-border text-brand-muted hover:text-white">
                <X c="w-5 h-5" />
              </button>
            </div>

            <div className="px-6 py-5">
              {/* Tři měsíce se na mobil nevejdou. Bez tohohle obalu táhla
                  tabulka stranou celý panel i s nadpisem a křížkem. */}
              <div className="overflow-x-auto">
              <table className="w-full border-collapse">
                <thead>
                  <tr>
                    <th className="w-8 pb-3">
                      <Sipka smer="zpet" onClick={() => setPosun(p => p - 1)} titulek="O měsíc zpět" />
                    </th>
                    <th className="sticky left-0 bg-brand-bg text-left text-[11px] font-black uppercase tracking-widest text-brand-muted pb-3 pr-3">
                      Stavěč
                    </th>
                    {mesice.map(m => (
                      <th key={m.klic}
                        className={`text-left text-[11px] font-black uppercase tracking-widest pb-3 px-3
                          ${m.klic === dnesKlic ? 'text-white' : 'text-brand-muted'}`}>
                        {m.label} {m.rok}
                      </th>
                    ))}
                    <th className="w-8 pb-3">
                      <Sipka smer="vpred" onClick={() => setPosun(p => p + 1)} titulek="O měsíc vpřed" />
                    </th>
                  </tr>
                </thead>
                <tbody>
                  {poradi.map(name => (
                    <tr key={name} className="border-t border-brand-border">
                      <td />
                      <td className="sticky left-0 bg-brand-bg text-sm font-semibold text-brand-text pr-3 py-2.5 align-top whitespace-nowrap">
                        {name}
                      </td>
                      {mesice.map(m => <Bunka key={m.klic} v={stats[name]?.[m.klic]} />)}
                      <td />
                    </tr>
                  ))}
                  {/* Součet přes všechny stavěče = obsazenost té stěny za měsíc. */}
                  <tr className="border-t-2 border-brand-border">
                    <td />
                    <td className="sticky left-0 bg-brand-bg text-[11px] font-black uppercase tracking-widest text-brand-muted pr-3 py-2.5 align-top">
                      Celkem
                    </td>
                    {mesice.map(m => <Bunka key={m.klic} v={soucet(m)} />)}
                    <td />
                  </tr>
                </tbody>
              </table>
              </div>

              {posun !== 0 && (
                <div className="mt-4 text-center">
                  <button onClick={() => setPosun(0)}
                    className="text-[11px] uppercase tracking-widest font-bold text-brand-muted hover:text-white">
                    Zpět na dnešek
                  </button>
                </div>
              )}
            </div>
          </div>
        </div>
      ), document.body);
    }

    // ── StatsPanel ───────────────────────────────────────────────────────
    function StatsPanel({ stats, team, spocitejMesice }) {
      const now = new Date();
      const monthName = now.toLocaleString('cs-CZ', { month: 'long' });
      const sorted = [...team].sort((a, b) => (stats[b]?.year ?? 0) - (stats[a]?.year ?? 0));
      const [detail, setDetail] = React.useState(false);
      return (
        <div className="bg-brand-surface rounded-card overflow-hidden">
          {detail && (
            <SetterVenueModal onClose={() => setDetail(false)} spocitej={spocitejMesice}
              jmena={team} poradi={sorted} />
          )}
          <div className="px-4 pt-4 pb-2 border-b border-brand-border flex items-center justify-between gap-2">
            <h2 className="text-[11px] font-bold uppercase tracking-[0.16em] text-brand-muted">Statistiky</h2>
            <button onClick={() => setDetail(true)} title="Kdo na které stěně staví"
              className="text-xs font-semibold text-venue-lanovka hover:text-venue-lanovka">
              Víc
            </button>
          </div>
          <div className="px-4 pt-2 pb-0">
            <div className="inline-grid" style={{gridTemplateColumns:'max-content 2.5rem 2.5rem 2.5rem', columnGap:'0.5rem'}}>
              <span className="text-xs text-brand-muted font-semibold uppercase tracking-wide pb-1">Stavěč</span>
              <span className="text-xs text-brand-muted font-semibold uppercase tracking-wide text-right pb-1 capitalize">{monthName.slice(0,3)}</span>
              <span className="text-xs text-brand-muted font-semibold uppercase tracking-wide text-right pb-1">{now.getFullYear()}</span>
              <span className="text-xs text-venue-lanovka font-semibold uppercase tracking-wide text-right pb-1 pl-3" title="lano – rok">L</span>
              {sorted.map((name, i) => {
                const s = stats[name] ?? { month: 0, year: 0, lanoMonth: 0, lanoYear: 0 };
                const b = i < sorted.length - 1 ? 'border-b border-brand-border' : '';
                return (
                  <React.Fragment key={name}>
                    <span className={`text-sm font-semibold text-brand-text py-1.5 pr-3 ${b}`}>{name}</span>
                    <span className={`text-right text-sm tabular-nums font-bold py-1.5 ${b} ${s.month > 0 ? 'text-venue-lanovka' : 'text-brand-border-hi'}`}>{s.month}</span>
                    <span className={`text-right text-sm tabular-nums font-bold py-1.5 ${b} ${s.year > 0 ? 'text-brand-text' : 'text-brand-border-hi'}`}>{s.year}</span>
                    <span className={`text-right text-sm tabular-nums font-bold py-1.5 pl-3 ${b} ${s.lanoYear > 0 ? 'text-venue-lanovka' : 'text-brand-border-hi'}`}>{s.lanoYear}</span>
                  </React.Fragment>
                );
              })}
            </div>
          </div>
          <div className="px-4 py-3 text-xs text-brand-muted text-center">
            stavění · lano (rok)
          </div>
        </div>
      );
    }

    // ── RemovalStatsPanel ────────────────────────────────────────────────────

          <div className="px-4 pt-4 pb-2 border-b border-brand-border">

          </div>

            <div className="grid" style={{gridTemplateColumns:'minmax(0,1fr) 4rem 4rem', columnGap:'0.5rem'}}>
              <span className="text-xs text-brand-muted font-semibold uppercase tracking-wide pb-1">Stavěč</span>
              <span className="text-xs text-brand-muted font-semibold uppercase tracking-wide text-right pb-1">S</span>
              <span className="text-xs text-brand-muted font-semibold uppercase tracking-wide text-right pb-1">M</span>

                    <span className={`text-right text-sm tabular-nums font-bold py-1.5 ${b} ${s.mytiYear > 0 ? 'text-ok' : 'text-brand-border-hi'}`}>{s.mytiYear}</span>
