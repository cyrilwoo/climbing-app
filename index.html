  <script type="text/babel">
    const { useState } = React;

    // ── Inline SVG icons ─────────────────────────────────────────────────────
    const Ico = ({ className = "w-4 h-4", children }) => (
      <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"

      </svg>
    );
    const ChevronLeft  = ({c}) => <Ico className={c}><polyline points="15 18 9 12 15 6"/></Ico>;
    const ChevronRight = ({c}) => <Ico className={c}><polyline points="9 18 15 12 9 6"/></Ico>;
    const ChevronsLeft  = ({c}) => <Ico className={c}><polyline points="11 17 6 12 11 7"/><polyline points="18 17 13 12 18 7"/></Ico>;

    const X            = ({c}) => <Ico className={c}><path d="M18 6 6 18"/><path d="m6 6 12 12"/></Ico>;
    const UserIcon     = ({c}) => <Ico className={c}><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></Ico>;
    const RotateCcw    = ({c}) => <Ico className={c}><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></Ico>;
    const AlertCircle  = ({c}) => <Ico className={c}><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></Ico>;
    const GripV        = ({c}) => <Ico className={c}><circle cx="9" cy="12" r="1"/><circle cx="9" cy="5" r="1"/><circle cx="9" cy="19" r="1"/><circle cx="15" cy="12" r="1"/><circle cx="15" cy="5" r="1"/><circle cx="15" cy="19" r="1"/></Ico>;
    const Check        = ({c}) => <Ico className={c}><path d="M20 6 9 17l-5-5"/></Ico>;
    const CalEdit      = ({c}) => <Ico className={c}><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><path d="m14.5 16.5 1 1 2-2"/></Ico>;

    // ── Vzhled stěn (mordor-ui: barvy MÍST, ne značek) ───────────────────────
    // Karta je vždy tmavá plocha; stěnu nese proužek nahoře, značka u názvu
    // a výplň profilu. Text na žluté/modré je tmavý (kontrast 10,9 / 4,7),
    // na malinové bílý (4,6).
    const VENUE_UI = {
      yellow: { stripe: 'border-t-4 border-venue-lanovka', mark: 'bg-venue-lanovka', fill: 'bg-venue-lanovka text-brand-bg',
                text: 'text-venue-lanovka', bar: 'bg-venue-lanovka', ring: 'ring-venue-lanovka', hover: 'hover:border-venue-lanovka', hex: '#FFC83D' },
      dark:   { stripe: 'border-t-4 border-brand-accent', mark: 'bg-brand-accent', fill: 'bg-brand-accent text-white',
                text: 'text-brand-accent-lite', bar: 'bg-brand-accent', ring: 'ring-brand-accent', hover: 'hover:border-brand-accent', hex: '#E21074' },
      green:  { stripe: 'border-t-4 border-venue-telocvicna', mark: 'bg-venue-telocvicna', fill: 'bg-venue-telocvicna text-brand-bg',
                text: 'text-[#7FA9F0]', bar: 'bg-venue-telocvicna', ring: 'ring-venue-telocvicna', hover: 'hover:border-venue-telocvicna', hex: '#4A86E8' },
    };
    const venueUi = theme => VENUE_UI[theme] || VENUE_UI.dark;
    // čitelná barva textu stěny na tmavé ploše (žlutá, světlá malinová, světlá modrá)
    const VENUE_TEXT = { yellow: '#FFC83D', dark: '#FBCAE1', green: '#7FA9F0' };
    // Správa vs. stavěč — jen co se ukazuje, žádné zamykání dat
    const AdminCtx = React.createContext(true);

    // ── Date helpers ─────────────────────────────────────────────────────────
    function getMonday(date) {
      const d = new Date(date);
      const day = d.getDay();
      d.setDate(d.getDate() - day + (day === 0 ? -6 : 1));
      d.setHours(0, 0, 0, 0);
      return d;
    }
    const isoWeek = d => { const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); const n = t.getUTCDay() || 7;
      t.setUTCDate(t.getUTCDate() + 4 - n); return Math.ceil(((t - Date.UTC(t.getUTCFullYear(), 0, 1)) / 86400000 + 1) / 7); };
    const addDays  = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
    const fmt      = d => `${d.getDate()}.${d.getMonth()+1}.`;
    const fmtFull  = d => `${d.getDate()}.${d.getMonth()+1}.${d.getFullYear()}`;
    // Use local date (not UTC) to avoid timezone-shift issues with toISOString()
    const weekKey  = mon => {
      const y = mon.getFullYear();
      const m = String(mon.getMonth()+1).padStart(2,'0');
      const d = String(mon.getDate()).padStart(2,'0');
      return `${y}-${m}-${d}`;
    };

    // ── Team & constants ─────────────────────────────────────────────────────
    const TEAM = ['Cyril', 'Vašek', 'Morčák', 'Kuba', 'Máza', 'Sebastián'];
    const REMOVAL_TEAM = ['Áďa', 'Wenca', 'Míví', 'Kuba D.', 'Kuba M.', 'Ondra', 'Terezka'];
    // Kanonický tým je vždy přítomen — chrání před nechtěným smazáním člena přes UI/sync.
    function withCoreTeam(arr) {
      const base = Array.isArray(arr) ? arr.filter(x => typeof x === 'string') : [];
      const extras = base.filter(n => !TEAM.includes(n));
      return [...new Set([...TEAM, ...extras])]; // dedup → žádné duplicitní React klíče
    }
    const E4   = () => [null, null, null, null];

    // ── Plán stavění 2026 ────────────────────────────────────────────────────
    // Limit rotace (5 týdnů): Dětská (čtvrtek) → Přední převis → Zadní převis → Kolmice → Volno → opakuj
    // Limit START: 2.4.2026 (týden 2026-03-30)
    // Lanovka rotace (5 týdnů): Převis+Bizár → Dole kout+Strop → Nový profil → Hříbek → Dole kolmice → opakuj
    // Lanovka START: 16.3.2026 (L5); červenec–srpen střídavě s Limitem
    const V  = { sector: null,                           setters: [], isOff: true };
    const D  = { sector: 'Dětská',                       setters: [] };
    const P  = { sector: 'Přední převis',                setters: [] };
    const Z  = { sector: 'Zadní převis',                 setters: [] };
    const K  = { sector: 'Kolmice',                      setters: [] };
    const M  = { sector: null,                           setters: [], lano: null };
    const L1 = { sector: 'Převis + Bizár',               setters: [], lano: null };
    const L2 = { sector: 'Dole kout + Strop',            setters: [], lano: null };
    const L3 = { sector: 'Nový profil + nahoře kolmice', setters: [], lano: null };
    const L4 = { sector: 'Hříbek',                       setters: [], lano: null };
    const L5 = { sector: 'Dole kolmice + převis',        setters: [], lano: null };
    const TG = { sector: 'Tělocvična', setters: [] };
    const isDetskaWed = s => s?.toLowerCase().includes('dět') || s?.toLowerCase().includes('det');
    // Sektory Limitu — pro modal "Přidat závod"
    const LIMIT_SECTORS = ['Dětská', 'Přední převis', 'Zadní převis', 'Kolmice'];
    // Sektory Lanovky — pro modal "Extra stavění"
    const LANOVKA_SECTORS = ['Převis + Bizár', 'Dole kout + Strop', 'Nový profil + nahoře kolmice', 'Hříbek', 'Dole kolmice + převis'];
    // Extra stavění — jednorázové stavění mimo rotaci (nic neposouvá, jen se přidá).
    // ID = datum + stěna → na jednu stěnu jedno extra za den, obě stěny v jeden den OK.
    const extraId = (date, venue) => `${date}_${venue}`;
    // „Lano" má dvě role: profil (co se staví) a samostatný slot „L" navíc.
    // Slot navíc je výslovná volba (lanoSlot === true). Starší extra pole nemají,
    // tak jim ho necháme jen tam, kde by o něco přišla: obsazený lano slot,
    // lano jako přídavek k profilům, nebo karta, která jinak nemá žádný slot.
    const extraHasLanoSlot = ex => !!ex?.lano && (
      ex.lanoSlot === true || (ex.lanoSlot === undefined && (
        !!ex.lanoSetter || (ex.sectors || []).length > 0 || !(ex.slotCount > 0)
      ))
    );
    // Staví se jen lano a bez samostatného slotu → běžné sloty JSOU lano
    // (jinak by se lanová dostavba počítala do běžné obsazenosti a statistiky).
    const extraSlotsAreLano = ex => !!ex?.lano && !extraHasLanoSlot(ex) && (ex.sectors || []).length === 0;
    // ── Rozvrh dnů: od září 2026 se Lanovka staví v úterý, Limit ve čtvrtek (vždy) ──
    // Před zářím 2026: Lanovka pondělí (+0), Limit středa (+2) nebo čtvrtek pro Dětskou (+3).
    function isNewSchedule(monday) {
      const y = monday.getFullYear();
      return y > 2026 || (y === 2026 && monday.getMonth() >= 8); // září = index 8
    }
    function lanovkaOffset(monday) {
      return isNewSchedule(monday) ? 1 : 0;
    }
    // Od června 2026 se na Lanovce staví lano jen jednou za 14 dní.
    // Červen: 8.6., 22.6. (ref 2026-06-08). Od července se Lanovka staví v „liché"
    // týdny (léto po 14 dnech), takže lano kotvíme na 2026-07-13 → 14.7., 28.7.,
    // 11.8., 25.8., 7.9., 21.9. … aby provaz padl na skutečná letní Lanovka stavění.
    function hasLanoBuild(monday) {
      const t = monday.getTime();
      if (t < new Date(2026, 5, 1).getTime()) return true; // před červnem: každý týden
      const ref = t < new Date(2026, 6, 1).getTime()
        ? new Date(2026, 5, 8).getTime()    // červen → 8.6., 22.6.
        : new Date(2026, 6, 13).getTime();  // červenec a dál → 13.7., 27.7., …
      const days = Math.round((t - ref) / 86400000);
      return ((days % 14) + 14) % 14 === 0;
    }
    function limitOffset(monday, sectorName) {
      if (isNewSchedule(monday)) return 3;
      return isDetskaWed(sectorName) ? 3 : 2;
    }
    // Tělocvična: od září 2026 v PÁTEK (+4), předtím čtvrtek (+3). Staví se každé
    // 4 týdny (viz thu: TG v CAL), první zářijové stavění 18.9.2026 (týden 2026-09-14).
    function gymOffset(monday) {
      return isNewSchedule(monday) ? 4 : 3;
    }
    // ── Státní svátky + školní prázdniny (jen INFORMATIVNÍ štítek na kartě;
    //    případný přesun stavění řeší obsluha ručně) ──────────────────────────
    function easterSunday(year) {
      const a=year%19, b=Math.floor(year/100), c=year%100, d=Math.floor(b/4), e=b%4,
            f=Math.floor((b+8)/25), g=Math.floor((b-f+1)/3),
            h=(19*a+b-d-g+15)%30, i=Math.floor(c/4), k=c%4,
            l=(32+2*e+2*i-h-k)%7, m=Math.floor((a+11*h+22*l)/451),
            mon=Math.floor((h+l-7*m+114)/31), day=((h+l-7*m+114)%31)+1;
      return new Date(year, mon-1, day);
    }
    function stateHoliday(d) {
      const md = (d.getMonth()+1)*100 + d.getDate();
      const fixed = { 101:'Nový rok', 501:'Svátek práce', 508:'Den vítězství',
        705:'Cyril a Metoděj', 706:'Mistr Jan Hus', 928:'Den české státnosti',
        1028:'Vznik ČSR', 1117:'Den boje za svobodu a demokracii',
        1224:'Štědrý den', 1225:'1. svátek vánoční', 1226:'2. svátek vánoční' };
      if (fixed[md]) return fixed[md];
      const es = easterSunday(d.getFullYear());
      const vp = addDays(es, -2), vm = addDays(es, 1);
      if (d.getMonth()===vp.getMonth() && d.getDate()===vp.getDate()) return 'Velký pátek';
      if (d.getMonth()===vm.getMonth() && d.getDate()===vm.getDate()) return 'Velikonoční pondělí';
      return null;
    }
    // Školní prázdniny — okres České Budějovice (zdroj MŠMT; jarní jsou KRAJOVÉ).
    // ⚠️ Aktualizovat každý školní rok podle oficiálního kalendáře MŠMT.
    const SCHOOL_HOLIDAYS = [
      { from:'2026-10-29', to:'2026-10-30', name:'podzimní prázdniny' },
      { from:'2026-12-23', to:'2027-01-03', name:'vánoční prázdniny' },
      { from:'2027-01-29', to:'2027-01-29', name:'pololetní prázdniny' },
      { from:'2027-02-15', to:'2027-02-21', name:'jarní prázdniny' },        // ČB
      { from:'2027-03-25', to:'2027-03-29', name:'velikonoční prázdniny' },
      { from:'2027-10-27', to:'2027-10-29', name:'podzimní prázdniny' },
      { from:'2027-12-23', to:'2028-01-02', name:'vánoční prázdniny' },
    ];
    function schoolHoliday(d) {
      const iso = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
      for (const h of SCHOOL_HOLIDAYS) if (iso >= h.from && iso <= h.to) return h.name;
      return null;
    }
    // Vrátí { isState, text } nebo null pro dané datum stavění.
    function holidayNote(d) {
      const s = stateHoliday(d), p = schoolHoliday(d);
      if (s && p) return { isState: true, text: `Svátek! ${s} · ${p}` };
      if (s)      return { isState: true, text: `Svátek! ${s}` };
      if (p)      return { isState: false, text: p };
      return null;
    }
    const CAL = {
      // ── LEDEN–BŘEZEN: Lanovka bez sektoru, Limit ještě nezačal ───
      '2026-01-05': { mon: M },
      '2026-01-12': { mon: M },
      '2026-01-19': { mon: M },
      '2026-01-26': { mon: M },
      '2026-02-02': { mon: M },
      '2026-02-09': { mon: M },
      '2026-02-16': { mon: M },
      '2026-02-23': { mon: M },
      '2026-03-02': { mon: M },
      '2026-03-09': { mon: M },
      '2026-03-16': { mon: L5, thu: TG },           // Lanovka rotace start
      '2026-03-23': { mon: L1 },
      // ── LIMIT START 2.4. (čtvrtek) ───────────────────────────────
      '2026-03-30': { mon: L2, wed: D },
      // ── DUBEN ────────────────────────────────────────────────────
      '2026-04-06': { mon: L3, wed: P },
      '2026-04-13': { mon: L4, wed: Z, thu: TG },
      '2026-04-20': { mon: L5, wed: K },
      '2026-04-27': { mon: L1, wed: V },
      // ── KVĚTEN ───────────────────────────────────────────────────
      '2026-05-04': { mon: L2, wed: D },
      '2026-05-11': { mon: L3, wed: P, thu: TG },
      '2026-05-18': { mon: L4, wed: Z },
      '2026-05-25': { mon: L5, wed: K },
      // ── ČERVEN ───────────────────────────────────────────────────
      '2026-06-01': { mon: L1, wed: V },
      '2026-06-08': { mon: L2, wed: D },
      '2026-06-15': { mon: L3, wed: P },
      '2026-06-22': { mon: L4, wed: Z },
      '2026-06-29': { mon: L5, wed: K },
      // ── ČERVENEC — střídavě Lanovka / Limit ──────────────────────
      '2026-07-06': { mon: L1 },
      '2026-07-13': {            wed: D  },
      '2026-07-20': { mon: L2          },
      '2026-07-27': {            wed: P  },
      // ── SRPEN — střídavě Lanovka / Limit ─────────────────────────
      '2026-08-03': { mon: L3 },
      '2026-08-10': {            wed: Z  },
      '2026-08-17': { mon: L4          },

    // ── Rotace stěn — kanonické sekvence + resolver ─────────────────────────
    // CAL je kanonická sekvence profilů. „Posun" (rotationShifts) neukládá
    // sektory natvrdo, ale posouvá INDEX do téhle sekvence → kaskáda celé
    // rotace je automatická a funguje pro obě stěny i přes letní mezery
    // (kdy se Lanovka/Limit staví obden).
    const LANOVKA_WEEKS = Object.keys(CAL).filter(k => CAL[k]?.mon).sort();
    const LIMIT_WEEKS   = Object.keys(CAL).filter(k => CAL[k]?.wed).sort();

    // Efektivní sektor pro daný týden a stěnu.
    // Priorita: explicitní per-week override (Nahradit / Smazat / legacy pin)
    //   → potom shift-list (týden je posunutý = Volný)
    //   → potom výpočet z CAL sekvence posunutý o počet shiftů před týdnem.
    // venue: 'mon' (Lanovka) | 'wed' (Limit). data + shifts předány zvenčí (čistá funkce).
    function effSector(venue, weekKey, data, shifts) {
      const wd = data?.[weekKey];
      const ov = venue === 'mon' ? wd?.monSectorOverride : wd?.wedSectorOverride;
      if (ov && (ov.isOff || ov.sector)) return ov;
      const list = (shifts && shifts[venue === 'mon' ? 'lanovka' : 'limit']) || [];
      if (list.includes(weekKey)) return { isOff: true, sector: 'Volný týden' };
      const seq = venue === 'mon' ? LANOVKA_WEEKS : LIMIT_WEEKS;
      const i = seq.indexOf(weekKey);
      if (i < 0) return CAL[weekKey]?.[venue] ?? null;
      const before = list.filter(s => s < weekKey).length;
      return CAL[seq[Math.max(0, i - before)]]?.[venue] ?? null;
    }

    // Returns the next non-off CAL entry for venue ('mon'|'wed') after weekKey
    function getNextSector(weekKey, venue) {
      const calKeys = Object.keys(CAL).sort();
      const idx = calKeys.indexOf(weekKey);
      for (let i = idx + 1; i < calKeys.length; i++) {
        const entry = CAL[calKeys[i]]?.[venue];
        if (entry && !entry.isOff) return entry;
      }
      return null;
    }

    function initWeek(key) {
      const c = CAL[key];
      if (!c) {
        // Mimo CAL = žádné stavění → prázdné sloty (dřív tu byl default Cyril
        // ve wed slotu, který je neviditelný, ale nafukoval Cyrilovi statistiky).
        return { monday: E4(), mondayLano: null, wednesday: E4(), thursday: E4(),
                 mondaySundavaci: [], mondayMyti: null, wednesdaySundavaci: [], wednesdayMyti: null,
                 thuDateOverride: null, monDateOverride: null, wedDateOverride: null };
      }
      const monday = E4();
      (c.mon?.setters ?? []).slice(0,4).forEach((s,i) => { monday[i] = s; });

      const wednesday = E4();
      if (c.wed?.setters?.length) {
        c.wed.setters.slice(0,4).forEach((s,i) => { wednesday[i] = s; });
      } else if (c.wed && !c.wed.isOff) {
        wednesday[0] = 'Cyril';
      }

      const thursday = E4();
      if (c.thu?.setters?.length) {
        c.thu.setters.slice(0,4).forEach((s,i) => { thursday[i] = s; });
      }
      return { monday, mondayLano: c.mon?.lano ?? null, wednesday, thursday,
               mondaySundavaci: [], mondayMyti: null,
               wednesdaySundavaci: [], wednesdayMyti: null,
               thuDateOverride: null,
               monDateOverride: null, wedDateOverride: null,
               monSectorOverride: null, wedSectorOverride: null };
    }

    // ── SundavaniCard ─────────────────────────────────────────────────────────
    // ── Karta dne ve stylu Rise (maketa A) ───────────────────────────────────
    // Barva stěny má jedinou roli: proužek vlevo a tečka u názvu. Profil je nadpis,
    // ne plné tlačítko; upozornění jsou tiché řádky s tenkou čárou (decentní proužky).
    // Všechno sedí na jedné levé hraně (px-4) a jedné mřížce rozestupů.
    const cardBox = (hex, compact) => compact
      ? { className: 'animate-fade relative' }
      : { className: 'bg-brand-surface rounded-card animate-rise relative h-full' };
    // ── Značka stěny (Cyril 8. 11.): Lanovka = kolečko, Limit = čtvereček, Tělocvična = kosočtverec (dočasně).
    // Plná = obsazeno, obrys = volné místo. Stejná značka všude, kde se ukazuje stěna.
    const MARK_SHAPE = { yellow: 'circle', dark: 'square', green: 'diamond' };
    const HEX_SHAPE = { '#FFC83D': 'circle', '#E21074': 'square', '#4A86E8': 'diamond' };
    function VMark({ theme, hex, size = 10, outline, className = '', style, title }) {
      const h = hex || venueUi(theme).hex;
      const sh = theme ? MARK_SHAPE[theme] : (HEX_SHAPE[h.slice(0, 7).toUpperCase()] || 'circle');
      const d = sh === 'diamond' ? Math.round(size * 0.74) : size;
      return <i aria-hidden={title ? undefined : 'true'} title={title} className={`inline-block shrink-0 align-middle ${className}`}
        style={{ width: d, height: d, borderRadius: sh === 'circle' ? '50%' : 1.5, transform: sh === 'diamond' ? 'rotate(45deg)' : undefined,
          margin: sh === 'diamond' ? `0 ${(size - d) / 2}px` : undefined,
          background: outline ? 'transparent' : h, boxShadow: outline ? `inset 0 0 0 1.5px ${h}` : undefined, ...style }} />;
    }
    // Obsazenost jako značky: jedna na místo, lano = značka navíc za mezerou; při víc než 4 místech menší mezery (nezalamovat)
    function SlotMarks({ theme, regular, lano, size = 10 }) {
      const many = regular.length + (lano !== undefined ? 1 : 0) > 4;
      return (
        <span className={`inline-flex items-center flex-nowrap ${many ? 'gap-[2px]' : 'gap-[3px]'}`}>
          {regular.map((n, k) => <VMark key={k} theme={theme} size={size} outline={!n} />)}
          {lano !== undefined && <VMark theme={theme} size={size} outline={!lano} style={{ marginLeft: many ? 3 : 5 }} />}
        </span>
      );
    }
    // Kalendář (Cyril 9. 11.): místo prázdných značek iniciály — tvar podle stěny, písmena = kdo je zapsaný, obrys = volné místo
    const initials = n => { if (n === 'NEOBSADITELNÉ') return '–'; const p = n.replace('.', '').split(/\s+/).filter(Boolean);
      return (p.length > 1 ? p[0][0] + p[1][0] : n.slice(0, 2)).toUpperCase(); };
    function NameMark({ theme, name, size = 18, me, lano }) {
      const h = venueUi(theme).hex, sh = MARK_SHAPE[theme] || 'circle', ink = theme === 'yellow' ? '#1C1D22' : '#fff';
      const d = sh === 'diamond' ? Math.round(size * 0.78) : size;
      return (
        <i title={name ? `${lano ? 'lano: ' : ''}${name === 'NEOBSADITELNÉ' ? 'neobsaditelné' : name}` : (lano ? 'lano volné' : 'volné místo')}
          className="inline-grid place-items-center shrink-0 not-italic font-bold leading-none tracking-[-0.02em]"
          style={{ width: d, height: d, margin: sh === 'diamond' ? `0 ${(size - d) / 2}px` : undefined,
            borderRadius: sh === 'circle' ? '50%' : 3, fontSize: Math.round(size * 0.55), transform: sh === 'diamond' ? 'rotate(45deg)' : undefined,
            background: name ? (name === 'NEOBSADITELNÉ' ? 'rgba(249,115,22,.35)' : h) : 'transparent', color: ink,
            boxShadow: name ? (me ? '0 0 0 1.5px #F5F2F2' : undefined) : `inset 0 0 0 1.5px ${h}` }}>
          {name && <span style={{ transform: sh === 'diamond' ? 'rotate(-45deg)' : undefined }}>{initials(name)[0]}</span>}
        </i>
      );
    }
    function NameMarks({ theme, names, lano, me, size = 18 }) {
      return (
        <span className="inline-flex flex-wrap items-center justify-center gap-[6px]">
          {names.map((n, k) => <NameMark key={k} theme={theme} name={n} me={n && n === me} size={size} />)}
          {lano !== undefined && <span className="ml-2 inline-flex"><NameMark theme={theme} name={lano} me={lano && lano === me} size={size} lano /></span>}
        </span>
      );
    }
    const NAME_GROUP = 'flex flex-wrap gap-1.5';
    const NAME_BTN = 'grow basis-[calc(50%-0.375rem)] lg:basis-[7.5rem] min-h-[56px] lg:min-h-[40px]';
    function CardNote({ tone, children }) {
      // tone: 'accent' = důležité (jiný den), jinak tichá informace (svátek, prázdniny)
      return (
        <p className={`mt-2 pl-2.5 border-l-2 text-xs leading-snug ${tone === 'accent' ? 'border-brand-accent text-brand-text' : tone === 'bad' ? 'border-bad text-brand-text' : 'border-brand-border-hi text-brand-muted'}`}>
          {children}
        </p>
      );
    }
    function CardHead({ hex, title, titleMuted, kicker, date, count, gap, right, dateAction, tag, children }) {
      const rawDay = date.toLocaleString('cs-CZ', { weekday: 'long' });
      return (
        <div className="px-5 pt-5 pb-3 text-brand-text">
          <div className="flex items-start justify-between gap-2">
            <h3 className="text-base font-semibold leading-snug flex items-start gap-2 min-w-0">
              <VMark hex={hex} size={12} className="mt-[5px]" />
              <span className={`break-words ${titleMuted ? 'text-brand-muted line-through' : ''}`}>{title}</span>
              {tag && <span data-change-tag={tag} className="mt-[3px] shrink-0 text-[11px] font-medium leading-none px-2 py-1 rounded-full ring-1 ring-inset ring-brand-accent/60 text-brand-accent-lite">{tag}</span>}
            </h3>
            {right}
          </div>
          <div className="mt-2.5 flex items-center gap-2.5 text-sm relative">
            <CalEdit c="w-3.5 h-3.5 text-brand-muted shrink-0" />
            <span className="tnum">{rawDay.charAt(0).toUpperCase() + rawDay.slice(1)} {fmtFull(date)}</span>
            {dateAction}
          </div>
          <div className="mt-1 flex items-center gap-2.5 text-sm text-brand-muted">
            <span className="w-3.5 shrink-0" />
            <span className="min-w-0 break-words">{kicker}</span>
            {count != null && <span className={`ml-auto shrink-0 text-xs font-bold tnum ${gap ? 'text-brand-accent-lite' : ''}`}>{count}</span>}
          </div>
          {children}
        </div>
      );
    }

    // build = navazující stavění téže stěny (sundává se den předem): { title, date, hex, kind } — z dat týdne, žádné nové pole
    function SundavaniCard({ session, theme, date, sundavaci, myti, onToggleSundavac, onToggleMyti, build, onOpenBuild }) {
      const isYellow = theme === 'yellow';
      // Defenzivní: data z Firestore mohou mít chybějící pole (sundavaci undefined)
      const safeSundavaci = Array.isArray(sundavaci) ? sundavaci : [];
      const rawDay = date.toLocaleString('cs-CZ', { weekday: 'long' });
      const displayDay = rawDay.charAt(0).toUpperCase() + rawDay.slice(1);
      const isGreen = theme === 'green';
      const vu = venueUi(theme);
      const activeBg = vu.fill;
      // zapsaný = plná plocha + ✓ a světlý text; volno = čárkovaně a tlumeně. Bez bílé výplně, ať nepřebije, co se sundává.
      const chip = on => `${NAME_BTN} px-2 rounded-ctl text-sm transition-colors truncate border
        ${on ? 'bg-brand-surface-2 text-brand-text border-brand-accent/70 font-semibold' : 'bg-white/[0.03] text-brand-muted border-transparent hover:text-brand-text hover:bg-white/[0.06]'}`;
      const dayName = d => d.toLocaleString('cs-CZ', { weekday: 'short' }).replace('.', '');
      const sameNext = build && Math.round((build.date - date) / 86400000) === 1;
      return (
        <div {...cardBox(vu.hex + '99')}>
          <CardHead hex={vu.hex + '99'} title="Sundávání" date={date}
            kicker={`${isYellow ? 'Lanovka' : isGreen ? 'Tělocvična' : 'Limit'} · den před stavěním`}
            count={safeSundavaci.length ? `${safeSundavaci.length} lidi` : null} />
          <div className="px-5 pb-5 space-y-4">
            {/* Co se sundává = profil navazujícího stavění; klik vede na jeho kartu */}
            <div>
              <p className="text-xs text-brand-muted mb-1.5">Sundává se kvůli</p>
              {build ? (
                <button onClick={onOpenBuild} title={`Otevřít stavění ${build.title}`}
                  className="w-full flex items-center gap-2.5 py-1.5 text-left hover:text-brand-accent-lite transition-colors">
                  <VMark hex={build.hex} size={12} />
                  <span className="flex-1 min-w-0">
                    <span className="block text-[15px] font-bold text-brand-text break-words">{build.title}</span>
                    <span className="block text-xs text-brand-muted tnum">{build.kind} · {sameNext ? 'zítra, ' : ''}{dayName(build.date)} {fmt(build.date)}</span>
                  </span>
                  <span className="text-brand-muted shrink-0">→</span>

              ) : <CardNote>Navazující stavění v tomhle týdnu není.</CardNote>}
            </div>
            <div>
              <p className="text-xs text-brand-muted mb-1.5">Sundavači</p>
              <div className={NAME_GROUP}>
                {REMOVAL_TEAM.filter(n => n !== 'Terezka').map(name => (
                  <button key={name} onClick={() => onToggleSundavac(name)} className={chip(safeSundavaci.includes(name))}>{safeSundavaci.includes(name) ? '✓ ' : ''}{name}</button>
                ))}
              </div>
            </div>
            <div>
              <p className="text-xs text-brand-muted mb-1.5">Mytí chytů</p>
              <div className={NAME_GROUP}>
                {['Terezka', 'Kuba D.'].map(name => (
                  <button key={name} onClick={() => onToggleMyti(name)} className={chip(myti === name)}>{myti === name ? '✓ ' : ''}{name}</button>
                ))}
              </div>
            </div>
          </div>
        </div>
      );
    }

    const LanovkaLogo = ({ size = 52 }) => (

    const LimitLogo = ({ size = 36 }) => {
      const lc = '#e8e4e4';
      const pk = '#E21074';
      // viewBox: 285 wide × 133 tall
      // Letter cap-height: y=15 to y=105 (90 units)

      // Letters at: L=x50, I=x90, M=x110..x180, I=x198, T=x217..x277

    // ── Slot component ───────────────────────────────────────────────────────
    function Slot({ num, name, sel, emptyBg, filledBg, filledText, numEmpty, selRing,
                    onClick, onDragStart, onDragOver, onDrop, compact, roomy, mark, onRemoveSlot }) {
      const removeBtn = !name && onRemoveSlot ? (

          className="ml-auto shrink-0 text-[11px] text-brand-muted hover:text-brand-text whitespace-nowrap">✕ ubrat místo</button>
      ) : null;
