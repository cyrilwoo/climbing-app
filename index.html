    // ── RacesPanel — obsazenost slotů závodů, dostavby a extra stavění ───────
    function RacesPanel({ races, extras }) {
      const fmtShort = iso => {
        const d = new Date(iso + 'T12:00:00');
        return `${d.getDate()}.${d.getMonth()+1}.`;
      };
      const today = new Date(); today.setHours(0,0,0,0);
      // Závod se v panelu objeví až 3 měsíce před svým datem (vzdálenější budoucí závody skryté)
      const cutoff = new Date(today); cutoff.setMonth(cutoff.getMonth() + 3);
      // Zploštíme závod + jeho dostavba dny do jednoho seznamu rovnocenných položek
      const items = [];
      Object.values(races || {}).forEach(race => {
        if (!race?.date) return;
        const rd = new Date(race.date + 'T12:00:00');
        if (rd > cutoff) return; // závod je dál než 3 měsíce v budoucnu — zatím nezobrazovat
        items.push({ kind: 'race', race, date: race.date });
        (race.dostavba || []).forEach((day, idx) => {
          if (day?.date) items.push({ kind: 'dostavba', race, day, idx, date: day.date });
        });
      });
      // Extra stavění — stejný cutoff, do stejného seznamu
      Object.entries(extras || {}).forEach(([id, ex]) => {
        if (!ex?.date) return;
        if (new Date(ex.date + 'T12:00:00') > cutoff) return;
        items.push({ kind: 'extra', extra: { ...ex, id }, date: ex.date });
      });
      items.sort((a, b) => a.date.localeCompare(b.date) || (a.kind === 'race' ? -1 : 1));
      if (items.length === 0) return null;
      return (
        <div className="bg-brand-surface rounded-card overflow-hidden">
          <div className="px-4 pt-4 pb-2 border-b border-brand-border">
            <h2 className="text-[11px] font-bold uppercase tracking-[0.16em] text-brand-muted">Závody + extra stavění</h2>
          </div>
          <div className="p-3 space-y-2.5">
            {items.map((it, i) => {
              const isRace  = it.kind === 'race';
              const isExtra = it.kind === 'extra';
              const isLanExtra = isExtra && it.extra.venue === 'lanovka';
              const total = isExtra ? ((it.extra.slotCount || 0) + (extraHasLanoSlot(it.extra) ? 1 : 0))
                          : isRace  ? (it.race.slotCount || 0)
                          : (it.day.slotCount || 0);
              const setters = isExtra ? it.extra.setters : isRace ? it.race.setters : it.day.setters;
              const filled = (setters || []).slice(0, isExtra ? (it.extra.slotCount || 0) : total).filter(Boolean).length
                + (isExtra && extraHasLanoSlot(it.extra) && it.extra.lanoSetter ? 1 : 0);
              const pct    = total ? Math.round(filled / total * 100) : 0;
              const allFilled = total > 0 && filled === total;
              const itemDate = new Date(it.date + 'T12:00:00');
              const isPast = itemDate < today;
              return (
                <div key={`${it.kind}-${it.date}-${i}`}
                  className={`border-l-2 pl-3 pr-1 py-2 transition-opacity
                    ${isPast ? 'border-brand-border-hi opacity-60'
                      : isLanExtra ? 'border-venue-lanovka'
                      : 'border-brand-accent'}`}>
                  <div className="flex items-baseline justify-between gap-2 mb-1.5">
                    {isExtra ? (
                      <p className="text-sm font-black truncate uppercase tracking-wide">
                        <span className={isLanExtra ? 'text-venue-lanovka' : 'text-brand-accent-lite'}>Extra</span>
                        <span className="text-brand-muted font-bold tracking-normal normal-case ml-1">
                          · {it.extra.name || (isLanExtra ? 'Lanovka' : 'Limit')}
                        </span>
                      </p>
                    ) : isRace ? (
                      <p className={`text-sm font-black truncate
                        ${it.race.name ? 'text-brand-accent-lite uppercase tracking-wide' : 'text-brand-muted italic'}`}>
                        {it.race.name || '(bez názvu)'}
                      </p>
                    ) : (
                      <p className="text-sm font-black truncate uppercase tracking-wide">
                        <span className="text-brand-accent-lite">Dostavba</span>
                        {it.race.name && (
                          <span className="text-brand-muted font-bold tracking-normal normal-case ml-1">· {it.race.name}</span>
                        )}
                      </p>
                    )}
                    <span className="text-xs font-semibold text-brand-muted tabular-nums shrink-0">{fmtShort(it.date)}</span>
                  </div>
                  <div className="flex items-center gap-2">
                    <div className="flex-1 h-2 bg-brand-surface-2 rounded-badge overflow-hidden">
                      <div className={`h-full rounded-badge transition-all duration-500
                        ${isLanExtra ? (allFilled ? 'bg-venue-lanovka' : 'bg-venue-lanovka') : (allFilled ? 'bg-brand-accent' : 'bg-brand-accent')}`}
                        style={{ width: `${pct}%` }} />
                    </div>
                    <span className={`text-sm font-bold tabular-nums w-10 text-right
                      ${allFilled ? (isLanExtra ? 'text-venue-lanovka' : 'text-brand-accent-lite') : 'text-brand-muted'}`}>
                      {filled}/{total}
                    </span>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    // ── DatePickerCalendar (Limit brand) ─────────────────────────────────────
    // Jednodenní výběr: value + onChange. Více termínů: values (pole ISO) + onChange
    // (rodič si klik přepíná sám). accent: 'pink' (Limit/závod) | 'amber' (Lanovka).
    function DatePickerCalendar({ value, onChange, values, accent = 'pink' }) {
      const multi = Array.isArray(values);
      const isOn = iso => multi ? values.includes(iso) : value === iso;
      const selCls   = accent === 'amber' ? 'bg-venue-lanovka text-brand-bg ring-2 ring-venue-lanovka/60' : 'bg-brand-accent text-white ring-2 ring-brand-accent';
      const todayCls = accent === 'amber' ? 'bg-brand-border text-venue-lanovka hover:bg-brand-border-hi'     : 'bg-brand-border text-brand-accent-lite hover:bg-brand-border-hi';
      const today = new Date(); today.setHours(0,0,0,0);
      const firstSel = multi ? (values.slice().sort()[0] || null) : value;
      const initial = firstSel ? new Date(firstSel + 'T12:00:00') : today;
      const [month, setMonth] = useState(new Date(initial.getFullYear(), initial.getMonth(), 1));
      const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
      const firstWeekday = ((new Date(month).getDay() + 6) % 7); // Po=0, Ne=6
      const daysInMonth = new Date(month.getFullYear(), month.getMonth() + 1, 0).getDate();
      const cells = [];
      for (let i = 0; i < firstWeekday; i++) cells.push(null);
      for (let i = 1; i <= daysInMonth; i++) cells.push(new Date(month.getFullYear(), month.getMonth(), i));
      const monthLabel = month.toLocaleString('cs-CZ', { month: 'long', year: 'numeric' });
      const dayLabels = ['Po','Út','St','Čt','Pá','So','Ne'];
      return (
        <div className="bg-brand-surface-2 rounded-ctl p-3 border border-brand-border">
          <div className="flex items-center justify-between mb-3">
            <button onClick={() => setMonth(new Date(month.getFullYear(), month.getMonth()-1, 1))}
              className="p-1.5 rounded-ctl hover:bg-brand-border text-brand-muted">
              <ChevronLeft c="w-4 h-4" />
            </button>
            <p className="text-sm font-black text-white capitalize tracking-wide">{monthLabel}</p>
            <button onClick={() => setMonth(new Date(month.getFullYear(), month.getMonth()+1, 1))}
              className="p-1.5 rounded-ctl hover:bg-brand-border text-brand-muted">
              <ChevronRight c="w-4 h-4" />
            </button>
          </div>
          <div className="grid grid-cols-7 gap-1">
            {dayLabels.map(d => (
              <span key={d} className="text-center text-[10px] font-black text-brand-muted uppercase tracking-widest pb-1">{d}</span>
            ))}
            {cells.map((d, i) => {
              if (!d) return <span key={i} />;
              const isToday    = d.getTime() === today.getTime();
              const isPast     = d < today;
              const isSelected = isOn(iso(d));
              return (
                <button key={i} onClick={() => !isPast && onChange(iso(d))} disabled={isPast}
                  className={`aspect-square rounded-ctl text-sm font-bold transition-colors
                    ${isSelected ? selCls
                      : isPast ? 'text-brand-text cursor-not-allowed'
                      : isToday ? todayCls
                      : 'text-brand-text hover:bg-brand-border'}`}>
                  {d.getDate()}
                </button>
              );
            })}
          </div>
        </div>
      );
    }

    // ── AddRaceModal (Limit brand) ───────────────────────────────────────────
    function AddRaceModal({ onClose, onSave, existingRaceDates }) {
      const [name,           setName]          = useState('');
      const [date,           setDate]          = useState(null);
      const [sectors,        setSectors]       = useState([]);
      const [slotCount,      setSlotCount]     = useState(4);
      const [dostavbaCount,  setDostavbaCount] = useState(0);
      const [dostavbaDays,   setDostavbaDays]  = useState([]);
      const _allRaceDates = [date, ...dostavbaDays.map(d => d.date)].filter(Boolean);
      const _hasInternalDup = new Set(_allRaceDates).size !== _allRaceDates.length;
      const valid = date && sectors.length > 0 && slotCount > 0
        && dostavbaDays.every(d => d.sectors.length > 0 && d.slotCount > 0)
        && !_hasInternalDup;
      // Kolize hlavního data NEBO kterékoli dostavby s už existujícím závodem/dostavbou.
      const dateConflict = (date && existingRaceDates.has(date))
        || _allRaceDates.some(dt => existingRaceDates.has(dt));
      const toggleSector = s => setSectors(curr => curr.includes(s) ? curr.filter(x => x !== s) : [...curr, s]);
      const isoDate = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;

      // Když se mění datum nebo počet dostavby — pře-vygeneruj dostavba dny s defaulty
      // (datum = race + 2 + i; profily a počet stavěčů zachová z předchozího stavu)
      React.useEffect(() => {
        if (!date || dostavbaCount === 0) {
          if (dostavbaDays.length !== 0) setDostavbaDays([]);
          return;
        }
        setDostavbaDays(prev => {
          const out = [];
          for (let i = 0; i < dostavbaCount; i++) {
            const def = addDays(new Date(date + 'T12:00:00'), 2 + i);
            out.push({
              date: prev[i]?.date ?? isoDate(def),
              sectors: prev[i]?.sectors ?? [...sectors],
              slotCount: prev[i]?.slotCount ?? 4,
            });
          }
          return out;
        });
      }, [date, dostavbaCount]);

      const shiftDostavbaDay = (idx, delta) => {
        setDostavbaDays(prev => prev.map((d, i) => {
          if (i !== idx) return d;
          const newDate = addDays(new Date(d.date + 'T12:00:00'), delta);
          // nedovol jít na/před datum závodu
          if (date && isoDate(newDate) <= date) return d;
          return { ...d, date: isoDate(newDate) };
        }));
      };
      const setDostavbaSlots = (idx, n) =>
        setDostavbaDays(prev => prev.map((d, i) => i === idx ? { ...d, slotCount: n } : d));
      const toggleDostavbaSector = (idx, s) =>
        setDostavbaDays(prev => prev.map((d, i) => i === idx
          ? { ...d, sectors: d.sectors.includes(s) ? d.sectors.filter(x => x !== s) : [...d.sectors, s] }
          : d));

      const handleSave = () => {
        if (!valid || dateConflict) return;
        onSave({ name: name.trim(), date, sectors, slotCount, dostavbaDays });
      };
      return (
        <div className="fixed inset-0 z-[100] flex items-center justify-center p-4">
          <div className="absolute inset-0 bg-black/80 backdrop-blur-sm" onClick={onClose} />
          <div className="relative bg-brand-bg text-white rounded-card max-w-lg w-full max-h-[90vh] overflow-y-auto border border-brand-border shadow-2xl">
            {/* Header */}
            <div className="px-6 pt-6 pb-4 border-b border-brand-border flex items-start justify-between gap-4">
              <div>
                <h2 className="text-2xl font-black tracking-widest text-brand-accent-lite leading-none">PŘIDAT ZÁVOD</h2>
                <p className="text-[11px] uppercase tracking-widest text-brand-muted mt-2 font-bold">Limit Boulder</p>
              </div>
              <button onClick={onClose} className="p-2 rounded-ctl hover:bg-brand-border text-brand-muted hover:text-white">
                <X c="w-5 h-5" />
              </button>
            </div>

            {/* Body */}
            <div className="px-6 py-5 space-y-6">
              {/* Name */}
              <section>
                <h3 className="text-[11px] font-black uppercase tracking-widest text-brand-muted mb-3">1 · Název závodu <span className="text-brand-muted font-bold normal-case tracking-normal">(volitelné)</span></h3>
                <input type="text" value={name} onChange={e => setName(e.target.value)} maxLength={40}
                  placeholder="např. CB OPEN 2026"
                  className="w-full px-3.5 py-3 rounded-ctl bg-brand-surface-2 ring-1 ring-brand-border focus:ring-brand-accent focus:ring-2 outline-none text-brand-accent-lite text-sm font-black uppercase tracking-wider placeholder-brand-muted placeholder:font-medium placeholder:normal-case placeholder:tracking-normal" />
              </section>

              {/* Date */}
              <section>
                <h3 className="text-[11px] font-black uppercase tracking-widest text-brand-muted mb-3">2 · Datum</h3>
                <DatePickerCalendar value={date} onChange={setDate} />
                {dateConflict && (
                  <p className="text-xs text-brand-accent-lite font-bold mt-2">⚠ V tento den už závod je.</p>
                )}
              </section>

              {/* Sectors */}
              <section>
                <h3 className="text-[11px] font-black uppercase tracking-widest text-brand-muted mb-3">3 · Profily ({sectors.length})</h3>
                <div className="grid grid-cols-2 gap-2">
                  {LIMIT_SECTORS.map(s => {
                    const active = sectors.includes(s);
                    return (
                      <button key={s} onClick={() => toggleSector(s)}
                        className={`px-3 py-3 rounded-ctl text-sm font-black uppercase tracking-wide transition-all
                          ${active
                            ? 'bg-brand-accent text-white ring-2 ring-brand-accent'
                            : 'bg-brand-surface-2 text-brand-text ring-1 ring-brand-border hover:ring-brand-border-hi hover:bg-brand-border'}`}>
                        {s}
                      </button>
                    );
                  })}
                </div>
              </section>

              {/* Slot count */}
              <section>
                <h3 className="text-[11px] font-black uppercase tracking-widest text-brand-muted mb-3">4 · Počet stavěčů</h3>
                <div className="grid grid-cols-8 gap-1.5">
                  {[1,2,3,4,5,6,7,8].map(n => {
                    const active = slotCount === n;
                    return (
                      <button key={n} onClick={() => setSlotCount(n)}
                        className={`aspect-square rounded-ctl text-base font-black tabular-nums transition-all
                          ${active
                            ? 'bg-brand-accent text-white ring-2 ring-brand-accent'
                            : 'bg-brand-surface-2 text-brand-text ring-1 ring-brand-border hover:ring-brand-border-hi hover:bg-brand-border'}`}>
                        {n}
                      </button>
                    );
                  })}
                </div>
              </section>

              {/* Dostavba */}
              <section>
                <h3 className="text-[11px] font-black uppercase tracking-widest text-brand-muted mb-3">5 · Dostavba <span className="text-brand-muted font-bold normal-case tracking-normal">(volitelné)</span></h3>
                <div className="grid grid-cols-4 gap-1.5">
                  {[0,1,2,3].map(n => {
                    const active = dostavbaCount === n;
                    return (
                      <button key={n} onClick={() => setDostavbaCount(n)}
                        className={`aspect-[2.5/1] rounded-ctl text-sm font-black uppercase tabular-nums transition-all
                          ${active
                            ? 'bg-brand-accent text-white ring-2 ring-brand-accent'
                            : 'bg-brand-surface-2 text-brand-text ring-1 ring-brand-border hover:ring-brand-border-hi hover:bg-brand-border'}`}>
                        {n === 0 ? 'Žádná' : n === 1 ? '1 den' : `${n} dny`}
                      </button>
                    );
                  })}
                </div>

                {dostavbaDays.length > 0 && (
                  <div className="mt-4 space-y-3">
                    {dostavbaDays.map((day, i) => {
                      const d = new Date(day.date + 'T12:00:00');
                      const wd = d.toLocaleString('cs-CZ', { weekday: 'short' });
                      const wdCap = wd.charAt(0).toUpperCase() + wd.slice(1);
                      const dayLabel = `${wdCap} ${d.getDate()}.${d.getMonth()+1}.`;
                      return (
                        <div key={i} className="bg-brand-surface-2 rounded-ctl p-3 ring-1 ring-brand-border space-y-3">
                          {/* Day header + date shift */}
                          <div className="flex items-center justify-between gap-2">
                            <span className="text-[10px] font-black uppercase tracking-widest text-brand-muted">Den {i+1}</span>
                            <div className="flex items-center gap-1">
                              <button onClick={() => shiftDostavbaDay(i, -1)}
                                className="p-1.5 rounded-ctl bg-brand-border hover:bg-brand-border-hi text-brand-muted">
                                <ChevronLeft c="w-3.5 h-3.5" />
                              </button>
                              <span className="text-sm font-black text-white tabular-nums px-2">{dayLabel}</span>
                              <button onClick={() => shiftDostavbaDay(i, +1)}
                                className="p-1.5 rounded-ctl bg-brand-border hover:bg-brand-border-hi text-brand-muted">
                                <ChevronRight c="w-3.5 h-3.5" />
                              </button>
                            </div>
                          </div>
                          {/* Slot count */}
                          <div>
                            <p className="text-[10px] font-black uppercase tracking-widest text-brand-muted mb-1.5">Stavěči</p>
                            <div className="grid grid-cols-8 gap-1">
                              {[1,2,3,4,5,6,7,8].map(n => {
                                const active = day.slotCount === n;
                                return (
                                  <button key={n} onClick={() => setDostavbaSlots(i, n)}
                                    className={`aspect-square rounded-ctl text-sm font-black tabular-nums transition-all
                                      ${active
                                        ? 'bg-brand-accent text-white ring-1 ring-brand-accent'
                                        : 'bg-brand-bg text-brand-muted ring-1 ring-brand-border hover:ring-brand-border-hi hover:text-brand-text'}`}>
                                    {n}
                                  </button>
                                );
                              })}
                            </div>
                          </div>
                          {/* Sectors */}
                          <div>
                            <p className="text-[10px] font-black uppercase tracking-widest text-brand-muted mb-1.5">Profily ({day.sectors.length})</p>
                            <div className="grid grid-cols-2 gap-1.5">
                              {LIMIT_SECTORS.map(s => {
                                const active = day.sectors.includes(s);
                                return (
                                  <button key={s} onClick={() => toggleDostavbaSector(i, s)}
                                    className={`px-2 py-2 rounded-ctl text-xs font-black uppercase tracking-wide transition-all
                                      ${active
                                        ? 'bg-brand-accent text-white ring-1 ring-brand-accent'
                                        : 'bg-brand-bg text-brand-muted ring-1 ring-brand-border hover:ring-brand-border-hi hover:text-brand-text'}`}>
                                    {s}
                                  </button>
                                );
                              })}
                            </div>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                )}
              </section>
            </div>

            {/* Footer */}
            <div className="px-6 py-4 border-t border-brand-border flex items-center justify-end gap-3 bg-brand-bg sticky bottom-0">
              <button onClick={onClose}
                className="px-4 py-2 rounded-ctl text-sm font-bold text-brand-muted hover:bg-brand-border hover:text-white transition-colors">
                Zrušit
              </button>
              <button onClick={handleSave} disabled={!valid || dateConflict}
                className="px-6 py-2.5 rounded-ctl bg-brand-accent text-white text-sm font-black tracking-widest uppercase hover:bg-brand-accent disabled:opacity-30 disabled:cursor-not-allowed transition-colors">
                Přidat závod
              </button>
            </div>
          </div>
        </div>
      );
    }

    // ── RaceCard (Limit brand) ───────────────────────────────────────────────
    // Karta závodu nebo dostavby. Pro dostavbu předej `kind="dostavba"` + `day` (1-indexed).
    function RaceCard({ race, day, sectors, slotCount, setters, kind = 'race', sel,
                        onSlotClick, onDragStartSlot, onDragOverSlot, onDropSlot, onDelete }) {
      const isDostavba = kind === 'dostavba';
      const admin = React.useContext(AdminCtx);
      const dateIso = isDostavba ? day.date : race.date;
      const date = new Date(dateIso + 'T12:00:00');
      const rawDay = date.toLocaleString('cs-CZ', { weekday: 'long' });
      const displayDay = rawDay.charAt(0).toUpperCase() + rawDay.slice(1);
      const useSectors = isDostavba ? (day.sectors || []) : (sectors ?? race.sectors ?? []);
      const total = isDostavba ? (day.slotCount || 0) : (slotCount ?? race.slotCount ?? 0);
      const useSetters = isDostavba ? (day.setters || []) : (setters ?? race.setters ?? []);
      const filled = useSetters.slice(0, total).filter(Boolean).length;
      const allFilled = total > 0 && filled === total;
      const sectorActive = new Set();
      useSectors.forEach(s => { getLimitSectors(s).forEach(id => sectorActive.add(id)); });
      const slotProps = {
        sel,
        emptyBg: 'border-brand-border-hi hover:border-brand-accent hover:bg-brand-surface-2',
        filledBg: 'bg-brand-surface-2 border-transparent',
        filledText: 'text-brand-text',
        numEmpty: 'bg-transparent text-brand-muted ring-1 ring-inset ring-brand-border-hi',
        selRing: 'ring-2 ring-brand-accent ring-offset-1 ring-offset-brand-surface opacity-100',
        onDragOver: onDragOverSlot,
      };
      const limitSteps = [
        { id: 1, label: 'Dětská' },
        { id: 2, label: 'Přední převis' },
        { id: 3, label: 'Zadní převis' },
        { id: 4, label: 'Kolmice' },
      ];
      const activeLabels = limitSteps.filter(st => sectorActive.has(st.id)).map(st => st.label);
      return (
        <div {...cardBox('#E21074')}>
          <CardHead hex="#E21074" date={date}
            title={race.name ? (isDostavba ? `Dostavba · ${race.name}` : race.name) : (isDostavba ? 'Dostavba' : 'Závod')}
            kicker={`${isDostavba ? 'Dostavba' : 'Závod'} · Limit${activeLabels.length ? ' · ' + activeLabels.join(', ') : ''}`}
            count={`${allFilled ? '✓ ' : ''}${filled}/${total}`} gap={!allFilled}
            right={onDelete && admin && (
              <button onClick={onDelete} title={isDostavba ? 'Smazat tento den dostavby' : 'Smazat závod'}
                className="shrink-0 inline-flex items-center gap-1 px-2 py-1 rounded-ctl text-xs text-brand-muted ring-1 ring-inset ring-brand-border-hi hover:ring-bad hover:text-bad transition-colors">
                <X c="w-3 h-3" />Smazat
              </button>
            )} />
          <div className="px-5 pb-4">
            {Array.from({ length: total }).map((_, i) => {
              const name = useSetters[i] ?? null;
              return (
                <Slot key={i} num={i+1} name={name} {...slotProps} compact roomy mark="#E21074"
                  onClick={() => onSlotClick(i)}
                  onDragStart={() => onDragStartSlot(i, name)}
                  onDrop={() => onDropSlot(i)} />
              );
            })}
          </div>
        </div>
      );
    }

    // ── ExtraCard — jednorázové stavění mimo rotaci ──────────────────────────
    // Nezasahuje do rotace ani do standardních karet, jen se přidá vedle nich.
    function ExtraCard({ extra, sel, onSlotClick, onLanoClick, onDelete, onToggleLanoSlot }) {
      const isLan = extra.venue === 'lanovka';
      const admin = React.useContext(AdminCtx);
      const date = new Date(extra.date + 'T12:00:00');
      const rawDay = date.toLocaleString('cs-CZ', { weekday: 'long' });
      const displayDay = rawDay.charAt(0).toUpperCase() + rawDay.slice(1);
      const n = extra.slotCount || 0;
      const setters = extra.setters || [];
      const hasLanoSlot = extraHasLanoSlot(extra);
      const total  = n + (hasLanoSlot ? 1 : 0);
      const filled = setters.slice(0, n).filter(Boolean).length + (hasLanoSlot && extra.lanoSetter ? 1 : 0);
      const allFilled = total > 0 && filled === total;
      const vu       = venueUi(isLan ? 'yellow' : 'dark');
      const hdr      = 'bg-brand-surface';
      const hdrText  = 'text-brand-text';
      const hdrSub   = 'text-brand-muted';
      const progTrack= 'bg-brand-surface-2';
      const progFill = vu.bar;
      const countCol = allFilled ? vu.text : 'text-brand-muted';
      // Profil / lano se na extra kartě zobrazuje stejným boxem jako na standardních kartách
      const chipBox  = vu.fill;
      const slotProps = {
        sel,
        emptyBg:  `border-brand-border-hi ${vu.hover} hover:bg-brand-surface-2`,
        filledBg: 'bg-brand-surface-2 border-transparent',
        filledText: 'text-brand-text',
        numEmpty: 'bg-transparent text-brand-muted ring-1 ring-inset ring-brand-border-hi',
        selRing:  `ring-2 ${vu.ring} ring-offset-1 ring-offset-brand-surface opacity-100`,
        onDragOver: e => e.preventDefault(),
      };
      const hn = holidayNote(date);
      const what = [...(extra.sectors || []), ...(extra.lano ? ['Lano'] : [])].join(' + ');
      return (
        <div {...cardBox(vu.hex)}>
          <CardHead hex={vu.hex} date={date}
            title={extra.name ? `${extra.name}${what ? ' · ' + what : ''}` : (what || 'Extra stavění')}
            kicker={`Extra · ${isLan ? 'Lanovka' : 'Limit'}${what ? '' : ' · bez profilu'}`}
            count={`${allFilled ? '✓ ' : ''}${filled}/${total}`} gap={!allFilled}
            right={onDelete && admin && (
              <button onClick={onDelete} title="Smazat extra stavění"
                className="shrink-0 inline-flex items-center gap-1 px-2 py-1 rounded-ctl text-xs text-brand-muted ring-1 ring-inset ring-brand-border-hi hover:ring-bad hover:text-bad transition-colors">
                <X c="w-3 h-3" />Smazat
              </button>
            )}>
            {hn && <CardNote tone={hn.isState ? 'bad' : null}>{hn.text}</CardNote>}
          </CardHead>
          <div className="px-5 pb-4">
            {Array.from({ length: n }).map((_, i) => (
              <Slot key={i} num={i+1} name={setters[i] ?? null} {...slotProps} compact roomy mark={vu.hex}
                onClick={() => onSlotClick(i)}
                onDragStart={() => {}}
                onDrop={() => {}} />
            ))}
            {hasLanoSlot && (
              <div className={n > 0 ? 'mt-2' : ''}>
                <div className="flex items-center justify-between pt-2 pb-1">
                  <p className="text-xs text-brand-muted">Lano</p>
                  {onToggleLanoSlot && admin && (
                    <button onClick={onToggleLanoSlot} title="Zrušit samostatný lano slot"
                      className="text-xs text-brand-muted hover:text-bad transition-colors">Bez slotu</button>
                  )}
                </div>
                <Slot num="L" name={extra.lanoSetter ?? null} {...slotProps} compact roomy mark={vu.hex}
                  onClick={onLanoClick}
                  onDragStart={() => {}}
                  onDrop={() => {}} />
              </div>
            )}
            {n === 0 && !hasLanoSlot && <p className="py-3 border-t border-brand-border text-sm text-brand-muted">Bez slotů</p>}
            {extra.lano && !hasLanoSlot && onToggleLanoSlot && admin && (
              <button onClick={onToggleLanoSlot}
                className="w-full mt-1 py-2 rounded-ctl text-xs text-brand-muted hover:text-brand-text hover:bg-brand-surface-2 transition-colors">+ Lano slot</button>
            )}
          </div>
        </div>
      );
    }

    // ── AddExtraModal — přidání extra stavění (1 a více termínů) ─────────────
    function AddExtraModal({ onClose, onSave, existingIds }) {
      const [venue,     setVenue]     = useState('lanovka');
      const [name,      setName]      = useState('');
      const [dates,     setDates]     = useState([]);
      const [sectors,   setSectors]   = useState([]);
      const [lano,      setLano]      = useState(false);
      const [lanoSlot,  setLanoSlot]  = useState(false);  // samostatný slot „L" navíc
      const [slotCount, setSlotCount] = useState(2);
      const isLan = venue === 'lanovka';
      const sectorList = isLan ? LANOVKA_SECTORS : LIMIT_SECTORS;
      const acc = isLan
        ? { on: 'bg-venue-lanovka text-brand-bg ring-2 ring-venue-lanovka/60', title: 'text-venue-lanovka',
            btn: 'bg-venue-lanovka text-brand-bg hover:brightness-110', warn: 'text-venue-lanovka' }
        : { on: 'bg-brand-accent text-white ring-2 ring-brand-accent',      title: 'text-brand-accent-lite',
            btn: 'bg-brand-accent text-white hover:bg-brand-accent',        warn: 'text-brand-accent-lite' };
      const off = 'bg-brand-surface-2 text-brand-text ring-1 ring-brand-border hover:ring-brand-border-hi hover:bg-brand-border';
      // Přepnutí stěny: profily patří jiné stěně → vyčistit; lano má jen Lanovka.
      const switchVenue = v => {
        if (v === venue) return;
        setVenue(v); setSectors([]);
        if (v !== 'lanovka') { setLano(false); setLanoSlot(false); if (slotCount === 0) setSlotCount(2); }
      };
      const toggleDate   = iso => setDates(cur => cur.includes(iso) ? cur.filter(x => x !== iso) : [...cur, iso].sort());
      // Profil bez stavěče nedává smysl → první vybraný profil vrátí počet z 0 na 2.
      const toggleSector = s => {
        const next = sectors.includes(s) ? sectors.filter(x => x !== s) : [...sectors, s];
        setSectors(next);
        if (next.length > 0 && slotCount === 0) setSlotCount(2);
      };
      // Lano se ve výchozím stavu staví běžnými sloty — žádný slot „L" navíc.
      const toggleLano = () => {
        const next = !lano;
        setLano(next);
        setLanoSlot(false);
        if (slotCount === 0) setSlotCount(1);
      };
      // Slot „L" navíc — teprve tady se lano odděluje od běžných stavěčů.
      const toggleLanoSlot = () => {
        const next = !lanoSlot;
        setLanoSlot(next);
        if (!next && slotCount === 0) setSlotCount(1);
      };
      const conflicts = dates.filter(d => existingIds.has(extraId(d, venue)));
      const valid = dates.length > 0 && (sectors.length > 0 || lano)
        && (slotCount > 0 || (lano && lanoSlot)) && conflicts.length === 0;
      const fmtShort = iso => { const d = new Date(iso + 'T12:00:00');
        const wd = d.toLocaleString('cs-CZ', { weekday: 'short' });
        return `${wd.charAt(0).toUpperCase() + wd.slice(1)} ${d.getDate()}.${d.getMonth()+1}.`; };
      const handleSave = () => { if (valid) onSave({ venue, name: name.trim(), dates, sectors, slotCount, lano, lanoSlot: lano && lanoSlot }); };

      return (
        <div className="fixed inset-0 z-[100] flex items-center justify-center p-4">
          <div className="absolute inset-0 bg-black/80 backdrop-blur-sm" onClick={onClose} />
          <div className="relative bg-brand-bg text-white rounded-card max-w-lg w-full max-h-[90vh] overflow-y-auto border border-brand-border shadow-2xl">
            {/* Header */}
            <div className="px-6 pt-6 pb-4 border-b border-brand-border flex items-start justify-between gap-4">
              <div>
                <h2 className={`text-2xl font-black tracking-widest leading-none ${acc.title}`}>EXTRA STAVĚNÍ</h2>
                <p className="text-[11px] uppercase tracking-widest text-brand-muted mt-2 font-bold">Mimo rotaci — nic neposouvá</p>
              </div>
              <button onClick={onClose} className="p-2 rounded-ctl hover:bg-brand-border text-brand-muted hover:text-white">
                <X c="w-5 h-5" />
              </button>
            </div>

            {/* Body */}
            <div className="px-6 py-5 space-y-6">
              {/* Stěna */}
              <section>
                <h3 className="text-[11px] font-black uppercase tracking-widest text-brand-muted mb-3">1 · Stěna</h3>
                <div className="grid grid-cols-2 gap-2">
                  {[['lanovka','Lanovka'], ['limit','Limit']].map(([v, label]) => (
                    <button key={v} onClick={() => switchVenue(v)}
                      className={`px-3 py-3 rounded-ctl text-sm font-black uppercase tracking-wide transition-all
                        ${venue === v ? acc.on : off}`}>
                      {label}
                    </button>
                  ))}
                </div>
              </section>

              {/* Termíny */}
              <section>
                <h3 className="text-[11px] font-black uppercase tracking-widest text-brand-muted mb-3">
                  2 · Termíny ({dates.length}) <span className="text-brand-muted font-bold normal-case tracking-normal">— klikni na víc dní</span>
                </h3>
                <DatePickerCalendar values={dates} onChange={toggleDate} accent={isLan ? 'amber' : 'pink'} />
                {dates.length > 0 && (
                  <div className="flex flex-wrap gap-1.5 mt-3">
                    {dates.map(d => (
                      <button key={d} onClick={() => toggleDate(d)}
                        className={`inline-flex items-center gap-1 px-2.5 py-1.5 rounded-ctl text-xs font-black tabular-nums ${acc.on}`}>
                        {fmtShort(d)} <X c="w-3 h-3" />
                      </button>
                    ))}
                  </div>
                )}
                {conflicts.length > 0 && (
                  <p className={`text-xs font-bold mt-2 ${acc.warn}`}>
                    ⚠ Extra stavění už na této stěně existuje: {conflicts.map(fmtShort).join(', ')}
                  </p>
                )}
              </section>

              {/* Co se staví */}
              <section>
                <h3 className="text-[11px] font-black uppercase tracking-widest text-brand-muted mb-3">3 · Co se staví ({sectors.length + (lano ? 1 : 0)})</h3>
                <div className="grid grid-cols-2 gap-2">
                  {sectorList.map(s => (
                    <button key={s} onClick={() => toggleSector(s)}
                      className={`px-3 py-3 rounded-ctl text-sm font-black uppercase tracking-wide transition-all leading-tight
                        ${sectors.includes(s) ? acc.on : off}`}>
                      {s}
                    </button>
                  ))}
                  {isLan && (
                    <button onClick={toggleLano}
                      className={`px-3 py-3 rounded-ctl text-sm font-black uppercase tracking-wide transition-all
                        ${lano ? acc.on : off}`}>
                      Lano
                    </button>
                  )}
                </div>
              </section>

              {/* Počet stavěčů */}
              <section>
                <h3 className="text-[11px] font-black uppercase tracking-widest text-brand-muted mb-3">
                  4 · Počet stavěčů{lano && lanoSlot && (
                    <span className="text-brand-muted font-bold normal-case tracking-normal">
                      {' '}— mimo slot L{slotCount === 0 ? ' · staví jen slot L' : ', 0 = jen slot L'}
                    </span>
                  )}
                </h3>
                <div className="grid grid-cols-9 gap-1">
                  {[0,1,2,3,4,5,6,7,8].map(n => (
                    <button key={n} onClick={() => setSlotCount(n)} disabled={n === 0 && !(lano && lanoSlot)}
                      className={`aspect-square rounded-ctl text-base font-black tabular-nums transition-all
                        ${slotCount === n ? acc.on : off} ${n === 0 && !(lano && lanoSlot) ? 'opacity-30 cursor-not-allowed' : ''}`}>
                      {n}
                    </button>

      // Firestore doc rotation/state; localStorage je cache pro offline/první render.
      const [rotationShifts, setRotationShifts] = useState(() => {
        try {
          const s = localStorage.getItem('climbing-rotation');
          if (s) { const o = JSON.parse(s); if (o && o.lanovka && o.limit) return o; }
        } catch {}
        return { lanovka: [], limit: [] };
      });
      const skipFirebaseWeeks = React.useRef(new Set());
      const skipFirebaseRaces = React.useRef(new Set());
      const skipFirebaseExtras = React.useRef(new Set());
      const skipFirebaseTeam  = React.useRef(false);
      const skipFirebaseRotation = React.useRef(false);
      const pendingFlushRef   = React.useRef(null);
      const lastFlushedRef    = React.useRef({}); // weekId → JSON naposledy zapsaného docu (flush jen změn)
      // Kapacitní pole (nová, stará appka je nezná) v DB: weekId → Set klíčů s hodnotou. Prázdná pole posíláme jen tam,
      // kde je v DB je co smazat — jinak by první flush přepsal všechny týdny (audit 9. 11.: 53 dokumentů při startu).
      const capInDb = React.useRef({});
      const CAP_KEYS = ['monSlotCount', 'wedSlotCount', 'thuSlotCount', 'monLanoSlotCount'];
      const noteCaps = (weekId, doc) => { capInDb.current[weekId] = new Set(CAP_KEYS.filter(k => doc && doc[k] != null && doc[k] !== '__NULL__')); };
      const lastFlushedRacesRef = React.useRef({}); // raceId → JSON naposledy zapsaného (flush jen změn)
      const lastFlushedExtrasRef = React.useRef({}); // extraId → JSON naposledy zapsaného

      // ── Firestore helpers: null ↔ "__NULL__" ────────────────────────────────
      function toFirestore(weekData) {
        const out = {};
        for (const [k, v] of Object.entries(weekData)) {
          if (Array.isArray(v)) out[k] = v.map(x => x === null ? '__NULL__' : x);
          else if (v === null) out[k] = '__NULL__';
          else out[k] = v;
        }
        return out;
      }
      function fromFirestore(weekData) {
        const out = {};
        for (const [k, v] of Object.entries(weekData)) {
          // Enriched pole (_monSector, _wedDate, _monShifted, …) jsou WRITE-ONLY pro sync_calendar.
          // Do stavu appky je NEČTEME — jinak se v každém flushi přepočítají, zapíšou, vrátí
          // přes onSnapshot a vznikne nekonečná smyčka zápis↔snapshot.
          if (k[0] === '_') continue;
          if (Array.isArray(v)) out[k] = v.map(x => x === '__NULL__' ? null : x);
          else if (v === '__NULL__') out[k] = null;
          else out[k] = v;
        }
        return out;
      }
      // Sestaví Firestore payload týdne (vč. enriched _* polí pro sync). Sdílené
      // flushem i seedingem lastFlushedRef (load/onSnapshot), aby se signatury
      // shodovaly a první flush po načtení nepřepisoval všechny týdny.
      function weekPayload(weekId, dataSnap, shifts) {
        const weekData = dataSnap[weekId];
        if (!weekData) return null;
        const calMon = effSector('mon', weekId, dataSnap, shifts);
        const calWed = effSector('wed', weekId, dataSnap, shifts);
        const calThu = CAL[weekId]?.thu ?? null;
        const monBase = new Date(weekId + 'T12:00:00');
        const wOff = limitOffset(monBase, calWed?.sector);
        const lOff = lanovkaOffset(monBase);
        const enriched = {
          ...weekData,
          _monSector: (calMon && !calMon.isOff && calMon.sector) ? calMon.sector : null,
          _wedSector: (calWed && !calWed.isOff && calWed.sector) ? calWed.sector : null,
          _thuSector: (calThu && !calThu.isOff && calThu.sector) ? calThu.sector : null,
          _monDate:   weekData.monDateOverride || toIso(addDays(monBase, lOff)),
          _wedDate:   weekData.wedDateOverride || toIso(addDays(monBase, wOff)),
          _thuDate:   weekData.thuDateOverride || toIso(addDays(monBase, gymOffset(monBase))),
          _monCancelled: weekData.monSectorOverride?.isOff === true ? true : null,
          _wedCancelled: weekData.wedSectorOverride?.isOff === true ? true : null,
          // Navázat na shift LIST (zdroj pravdy), ne na monSavedSetters — ty může
          // deleteClimber poškodit z null na [] a tím chybně označit VŠECHNY týdny
          // jako shifted → sync by smazal všechna stavění.
          _monShifted: (shifts?.lanovka || []).includes(weekId) ? true : null,
          _wedShifted: (shifts?.limit || []).includes(weekId) ? true : null,
          monSlotCount: capOk(weekData.monSlotCount) ? weekData.monSlotCount : null,
          wedSlotCount: capOk(weekData.wedSlotCount) ? weekData.wedSlotCount : null,
          thuSlotCount: capOk(weekData.thuSlotCount) ? weekData.thuSlotCount : null,
          monLanoSlotCount: weekData.monLanoSlotCount === 0 || weekData.monLanoSlotCount === 1 ? weekData.monLanoSlotCount : null,
        };
        CAP_KEYS.forEach(k => { if (enriched[k] === null && !capInDb.current[weekId]?.has(k)) delete enriched[k]; });
        return toFirestore(enriched);
      }
      // Signatura toho, CO UŽ LEŽÍ V DATABÁZI — promítnutá na klíče payloadu.
      // POZOR na past: seedovat lastFlushedRef PŘEPOČÍTANÝM payloadem znamená, že
      // se signatury vždy shodují a stará enriched pole v DB (_monDate, _wedSector…)
      // se nikdy nepřepíšou. Když se změní pravidla (zářijový rozvrh Út/Čt) nebo je
      // zapíše klient se starou verzí appky, sync_calendar i veřejný feed pak čtou
      // stará data — appka ukazuje správné dny, kalendář ne. Porovnáváme proto se
      // skutečným obsahem dokumentu → nesoulad se při prvním flushi sám opraví.
      function storedSig(payload, rawDoc) {
        const stored = {};
        Object.keys(payload).forEach(k => { stored[k] = rawDoc?.[k] === undefined ? null : rawDoc[k]; });
        return JSON.stringify(stored);
      }

      // ── Load all data from Firestore on mount ─────────────────────────────
      React.useEffect(() => {
        db.collection('weeks').get().then(snapshot => {
          if (!snapshot.empty) {
            const loaded = {};
            const rawDocs = {};
            snapshot.forEach(doc => { loaded[doc.id] = fromFirestore(doc.data()); rawDocs[doc.id] = doc.data(); noteCaps(doc.id, doc.data()); });
            // Seed lastFlushedRef — jinak první flush po načtení přepíše VŠECHNY týdny
            // (a v souběhu s jiným tabem může přepsat čerstvá data).
            Object.keys(loaded).forEach(weekId => {
              const p = weekPayload(weekId, loaded, rotationShifts);
              if (p) lastFlushedRef.current[weekId] = storedSig(p, rawDocs[weekId]);
            });
            setData(prev => {
              const merged = { ...prev, ...loaded };
              return merged;
            });
          }
          setFirebaseReady(true);
        }).catch(() => { setFirebaseReady(true); });

        // Real-time listener: sync changes from other users
        // Use docChanges() to process only added/modified docs, not the full snapshot every time
        const unsub = db.collection('weeks').onSnapshot(snapshot => {
          const loaded = {};
          const rawDocs = {};
          const removed = [];
          snapshot.docChanges().forEach(change => {
            const doc = change.doc;
            if (change.type === 'removed') { removed.push(doc.id); return; }
            if (skipFirebaseWeeks.current.has(doc.id)) {
              skipFirebaseWeeks.current.delete(doc.id);
              return; // vlastní zápis — přeskoč
            }
            loaded[doc.id] = fromFirestore(doc.data());
            rawDocs[doc.id] = doc.data(); noteCaps(doc.id, doc.data());
          });
          if (Object.keys(loaded).length === 0 && removed.length === 0) return;
          setData(prev => {
            const merged = { ...prev, ...loaded };
            // Smazaný týden zmiz i lokálně (jinak ho příští flush „obživne").
            removed.forEach(id => { delete merged[id]; delete lastFlushedRef.current[id]; });
            if (JSON.stringify(merged) === JSON.stringify(prev)) return prev;
            // Vzdáleně změněné týdny ber jako už-flushnuté → příští flush je nepřepíše zpět.
            Object.keys(loaded).forEach(weekId => {
              const p = weekPayload(weekId, merged, rotationShifts);
              if (p) lastFlushedRef.current[weekId] = storedSig(p, rawDocs[weekId]);
            });
            return merged;
          });
        });

        // Races: počáteční fetch + real-time listener
        db.collection('races').get().then(snapshot => {
          if (!snapshot.empty) {
            const loaded = {};
            snapshot.forEach(doc => { loaded[doc.id] = fromFirestore(doc.data()); });
            // Seed lastFlushedRacesRef — jinak první flush přepíše všechny závody.
            Object.keys(loaded).forEach(id => { lastFlushedRacesRef.current[id] = JSON.stringify(toFirestore(loaded[id])); });
            setRaces(prev => ({ ...prev, ...loaded }));
          }
        }).catch(() => {});

        // Team (sdílený seznam stavěčů + hostů) — počáteční fetch + listener
        db.collection('team').doc('roster').get().then(doc => {
          if (doc.exists) {
            const d = doc.data();
            if (Array.isArray(d?.names) && d.names.length > 0) {
              setTeam(withCoreTeam(d.names));
            }
          }
        }).catch(() => {});
        const unsubR = db.collection('races').onSnapshot(snapshot => {
          const loaded = {};
          const removed = [];
          snapshot.docChanges().forEach(change => {
            const doc = change.doc;
            if (change.type === 'removed') { removed.push(doc.id); return; }
            if (skipFirebaseRaces.current.has(doc.id)) {
              skipFirebaseRaces.current.delete(doc.id);
              return;
            }
            loaded[doc.id] = fromFirestore(doc.data());
          });
          if (Object.keys(loaded).length === 0 && removed.length === 0) return;
          setRaces(prev => {
            const merged = { ...prev, ...loaded };
            removed.forEach(id => { delete merged[id]; delete lastFlushedRacesRef.current[id]; });
            if (JSON.stringify(merged) === JSON.stringify(prev)) return prev;
            // Vzdáleně změněné závody ber jako už-flushnuté.
            Object.keys(loaded).forEach(id => { lastFlushedRacesRef.current[id] = JSON.stringify(toFirestore(merged[id])); });
            return merged;
          });
        });

        // Extra stavění — počáteční fetch + real-time listener
        db.collection('extras').get().then(snapshot => {
          if (!snapshot.empty) {
            const loaded = {};
            snapshot.forEach(doc => { loaded[doc.id] = fromFirestore(doc.data()); });
            Object.keys(loaded).forEach(id => { lastFlushedExtrasRef.current[id] = JSON.stringify(toFirestore(loaded[id])); });
            setExtras(prev => ({ ...prev, ...loaded }));
          }
        }).catch(() => {});
        const unsubE = db.collection('extras').onSnapshot(snapshot => {
          const loaded = {};
          const removed = [];
          snapshot.docChanges().forEach(change => {
            const doc = change.doc;
            if (change.type === 'removed') { removed.push(doc.id); return; }
            if (skipFirebaseExtras.current.has(doc.id)) {
              skipFirebaseExtras.current.delete(doc.id);
              return;
            }
            loaded[doc.id] = fromFirestore(doc.data());
          });
          if (Object.keys(loaded).length === 0 && removed.length === 0) return;
          setExtras(prev => {
            const merged = { ...prev, ...loaded };
            removed.forEach(id => { delete merged[id]; delete lastFlushedExtrasRef.current[id]; });
            if (JSON.stringify(merged) === JSON.stringify(prev)) return prev;
            Object.keys(loaded).forEach(id => { lastFlushedExtrasRef.current[id] = JSON.stringify(toFirestore(merged[id])); });
            return merged;
          });
        });

        // Team listener — propaguje hosty a změny týmu mezi uživateli
        const unsubT = db.collection('team').doc('roster').onSnapshot(doc => {
          if (skipFirebaseTeam.current) {
            skipFirebaseTeam.current = false;
            return;
          }
          if (!doc.exists) return;
          const d = doc.data();
          if (!Array.isArray(d?.names)) return;
          const merged = withCoreTeam(d.names);
          setTeam(prev => JSON.stringify(prev) !== JSON.stringify(merged) ? merged : prev);
        });

        // Rotace (rotationShifts) — fetch + bootstrap + listener.
        // Bootstrap (pouze pokud doc neexistuje): seed posunů, které ovlivňují
        // aktuální/budoucí rotaci a nejsou už zabalené v legacy overridech.
        // 2026-06-01 = posun Lanovky (1.6. se nestavělo) → kaskáda od 8.6. dál.
        const ROTATION_SEED = { lanovka: ['2026-06-01'], limit: [] };
        db.collection('rotation').doc('state').get().then(doc => {
          if (doc.exists) {
            const d = doc.data();
            if (Array.isArray(d?.lanovka) && Array.isArray(d?.limit)) {
              setRotationShifts({ lanovka: d.lanovka, limit: d.limit });
              return;
            }
          }
          // Bootstrap
          skipFirebaseRotation.current = true;
          db.collection('rotation').doc('state').set(ROTATION_SEED).catch(() => {});
          setRotationShifts(ROTATION_SEED);
        }).catch(() => {});

        const unsubRot = db.collection('rotation').doc('state').onSnapshot(doc => {
          if (skipFirebaseRotation.current) { skipFirebaseRotation.current = false; return; }
          if (!doc.exists) return;
          const d = doc.data();
          if (!Array.isArray(d?.lanovka) || !Array.isArray(d?.limit)) return;
          const next = { lanovka: d.lanovka, limit: d.limit };
          setRotationShifts(prev => JSON.stringify(prev) !== JSON.stringify(next) ? next : prev);
        });

        return () => { unsub(); unsubR(); unsubE(); unsubT(); unsubRot(); };
      }, []);

      // Persist rotationShifts do localStorage + Firestore
      React.useEffect(() => {
        try { localStorage.setItem('climbing-rotation', JSON.stringify(rotationShifts)); } catch {}
        if (!firebaseReady) return;
        const t = setTimeout(() => {
          skipFirebaseRotation.current = true;
          db.collection('rotation').doc('state').set(rotationShifts).catch(() => {});
        }, 800);
        return () => clearTimeout(t);
      }, [rotationShifts, firebaseReady]);

      // ── Save to localStorage + Firestore when data changes ────────────────
      React.useEffect(() => {
        try { localStorage.setItem('climbing-setters', JSON.stringify(data)); } catch {}
        window.__appData = data; // debug: přístup z konzole
        if (!firebaseReady) return;
        // Sestaví a zapíše všechny týdny do Firestore
        function flushToFirestore(dataSnapshot) {
          Object.keys(dataSnapshot).forEach(weekId => {
            const payload = weekPayload(weekId, dataSnapshot, rotationShifts);
            if (!payload) return;
            // Zapiš JEN týdny, které se reálně změnily od posledního flushe (signatura).
            // Jinak flush přepisuje VŠECHNY týdny a může přepsat čerstvé zápisy
            // (z jiného klienta / přímé) → ztráta dat a zbytečná zátěž.
            const sig = JSON.stringify(payload);
            if (lastFlushedRef.current[weekId] === sig) return;
            lastFlushedRef.current[weekId] = sig;
            skipFirebaseWeeks.current.add(weekId);
            noteCaps(weekId, payload);
            db.collection('weeks').doc(weekId).set(payload, { merge: true }).catch(() => {});
          });
        }
        // Uloží ref na aktuální flush — pro případ zavření tabu
        pendingFlushRef.current = () => flushToFirestore(data);
        // Debounce Firestore writes
        const t = setTimeout(() => {
          flushToFirestore(data);
          pendingFlushRef.current = null;
        }, 800);
        return () => clearTimeout(t);
      }, [data, firebaseReady, rotationShifts]);

      // ── Save races to localStorage + Firestore ────────────────────────────
      React.useEffect(() => {
        try { localStorage.setItem('climbing-races', JSON.stringify(races)); } catch {}
        if (!firebaseReady) return;
        function flushRaces(snap) {
          Object.entries(snap).forEach(([raceId, raceData]) => {
            const payload = toFirestore(raceData);
            const sig = JSON.stringify(payload);
            if (lastFlushedRacesRef.current[raceId] === sig) return; // zapiš jen změněné závody
            lastFlushedRacesRef.current[raceId] = sig;
            skipFirebaseRaces.current.add(raceId);
            db.collection('races').doc(raceId).set(payload, { merge: true }).catch(() => {});
          });
        }
        const t = setTimeout(() => flushRaces(races), 800);
        return () => clearTimeout(t);
      }, [races, firebaseReady]);

      // ── Save extras to localStorage + Firestore ───────────────────────────
      React.useEffect(() => {
        try { localStorage.setItem('climbing-extras', JSON.stringify(extras)); } catch {}
        if (!firebaseReady) return;
        function flushExtras(snap) {
          Object.entries(snap).forEach(([id, exData]) => {
            const payload = toFirestore(exData);
            const sig = JSON.stringify(payload);
            if (lastFlushedExtrasRef.current[id] === sig) return; // zapiš jen změněná
            lastFlushedExtrasRef.current[id] = sig;
            skipFirebaseExtras.current.add(id);
            db.collection('extras').doc(id).set(payload, { merge: true }).catch(() => {});
          });
        }
        const t = setTimeout(() => flushExtras(extras), 800);
        return () => clearTimeout(t);
      }, [extras, firebaseReady]);

      // ── Flush při skrytí tabu (zavření okna, přepnutí tabu) ──────────────────
      React.useEffect(() => {
        const handleHide = () => {
          if (document.visibilityState === 'hidden' && pendingFlushRef.current) {
            pendingFlushRef.current();
            pendingFlushRef.current = null;
          }
        };
        document.addEventListener('visibilitychange', handleHide);
        // Zrušený/upuštěný drag mimo drop zónu → vyčisti stav (jinak zůstane viset
        // červený banner „Přetáhněte sem pro odebrání").
        const handleDragEnd = () => setDrag(null);
        document.addEventListener('dragend', handleDragEnd);
        return () => {
          document.removeEventListener('visibilitychange', handleHide);
          document.removeEventListener('dragend', handleDragEnd);
        };
      }, []);

      // ── Týden ─────────────────────────────────────────────────────────────
      // Všechno, co patří k jednomu týdnu (odvozená data, handlery, karty Sundavání
      // a Stavění), je v buildWeekView — „Celý měsíc" tak vykreslí další týdny
      // stejným kódem a se stejným chováním jako hlavní týden.
      function buildWeekView(off) {
        const monday = addDays(getMonday(new Date()), off * 7);
        const friday = addDays(monday, 4);
        const key    = weekKey(monday);
        const week   = data[key] ?? initWeek(key);
        const calMon = effSector('mon', key, data, rotationShifts);
        const calWed = effSector('wed', key, data, rotationShifts);
        const calThu = CAL[key]?.thu ?? null;

        // Závod NEBO dostavba, které mohou nahradit standardní Stavění sloty (Mon Lanovka / Wed Limit) když jsou zrušené.
        // Algoritmus: shromáždíme všechny race-day a dostavba-day položky v týdnu, pro každý zrušený slot
        // hledáme nejdřív shodu day-of-week (Mon=1, Wed=3, Thu=4 pro Dětská), pak fallback na cokoli.
        const _wkStartIso = weekKey(monday);
        const _wkEndIso   = weekKey(addDays(monday, 6));
        const _allWeekItems = [];
        Object.values(races || {}).forEach(race => {
          if (!race?.date) return;
          if (race.date >= _wkStartIso && race.date <= _wkEndIso) {
            _allWeekItems.push({ kind: 'race', race, date: race.date, venue: 'wed' });
          }
          (race.dostavba || []).forEach((day, dIdx) => {
            if (day?.date && day.date >= _wkStartIso && day.date <= _wkEndIso) {
              _allWeekItems.push({ kind: 'dostavba', race, day, dIdx, date: day.date, venue: 'wed' });
            }
          });
        });
        _allWeekItems.sort((a, b) => a.date.localeCompare(b.date));
        const _monCancelled = week?.monSectorOverride?.isOff === true;
        const _wedCancelled = week?.wedSectorOverride?.isOff === true;
        // Day-of-week (JS getDay: Ne=0, Po=1, ..., So=6) Lanovka a Limit dle aktuálního rozvrhu
        const _monDayMatch = 1 + lanovkaOffset(monday);                          // 1=Po nebo 2=Út
        const _wedDayMatch = 1 + limitOffset(monday, calWed?.sector);            // 3=St nebo 4=Čt (EFEKTIVNÍ sektor, ne raw CAL)
        const _pool = [..._allWeekItems];
        const _consume = pred => {
          for (let i = 0; i < _pool.length; i++) {
            if (pred(_pool[i])) return _pool.splice(i, 1)[0];
          }
          return null;
        };
        const _dayOf = it => new Date(it.date + 'T12:00:00').getDay();
        // Závod/dostavba jsou VŽDY Limit (venue 'wed') → smí nahradit jen zrušený Limit slot,
        // nikdy Lanovku. Žádný slepý fallback přes stěny (dřív hijackoval špatnou stěnu).
        const wedReplacement = _wedCancelled
          ? (_consume(it => it.venue === 'wed' && _dayOf(it) === _wedDayMatch)
             || _consume(it => it.venue === 'wed'))
          : null;
        const monReplacement = _monCancelled
          ? _consume(it => it.venue === 'mon' && _dayOf(it) === _monDayMatch)
          : null;
        const _remainingWeekItems = _pool;

        // Extra stavění v tomto týdnu — přidají se jako další karty vedle standardních.
        // Vědomě NEvstupují do replacement logiky: extra nic neposouvá ani nenahrazuje.
        const _weekExtras = Object.entries(extras || {})
          .map(([id, e]) => ({ ...e, id }))
          .filter(e => e?.date && e.date >= _wkStartIso && e.date <= _wkEndIso)
          .sort((a, b) => a.date.localeCompare(b.date) || String(a.venue).localeCompare(String(b.venue)));

        // Den stavění: Lanovka pondělí/úterý (od září 2026), Limit středa/čtvrtek (od září 2026 vždy čtvrtek)
        const monOffset = lanovkaOffset(monday);
        const wedOffset = limitOffset(monday, calWed?.sector);
        // Přepis data jen v rámci týdne — override mimo týden ignorujeme (dřív dělal
        // matoucí dvojí zobrazení: karta v původním týdnu + „není stavění" v cílovém).
        const weekMin = weekKey(monday);
        const weekMax = toIso(addDays(monday, 6));
        const inWk = iso => !!iso && iso >= weekMin && iso <= weekMax;
        // + 'T12:00:00' aby se ISO date-only string neparsoval jako UTC midnight (timezone off-by-one)
        // Standardní (nepřesunuté) datum — karta podle něj pozná, že je stavění jinde
        const monBaseDate = addDays(monday, monOffset);
        const wedBaseDate = addDays(monday, wedOffset);
        const thuBaseDate = addDays(monday, gymOffset(monday));
        const monDate = inWk(week.monDateOverride) ? new Date(week.monDateOverride + 'T12:00:00') : monBaseDate;
        const wedDate = inWk(week.wedDateOverride) ? new Date(week.wedDateOverride + 'T12:00:00') : wedBaseDate;
        const thuDate = inWk(week.thuDateOverride) ? new Date(week.thuDateOverride + 'T12:00:00') : thuBaseDate;
        // Týden na přelomu srpna a září 2026: pondělí je ještě ve starém rozvrhu, ale
        // stavění už padá do září. Tehdy se plán teprve překlápěl — platí oba dny,
        // takže se štítek „jiný den" neukáže (nebyl to přesun).

      function onRaceSlotClick(date, idx) {

          logChange({ kind: 'remove', wk: date, target: 'race', day: date, names: [arr[idx]], text: `Odhlásil tě ${me || 'správce'} ze závodu ${race.name || ''} ${dayTxt(date)}`.replace('  ', ' ') });
          setRaces(r => ({ ...r, [date]: { ...r[date], setters: next } }));
          if (sel === arr[idx]) setSel(null);
        } else if (sel) {
          if (arr.includes(sel)) return;
          const next = arr.map((s, i) => i === idx ? sel : s);

      function onDostavbaSlotClick(raceDate, dIdx, slotIdx) {
        const race = races[raceDate]; if (!race) return;
        const day = race.dostavba?.[dIdx]; if (!day) return;

        if (arr[slotIdx]) {

          updateDay(arr.map((s, i) => i === slotIdx ? null : s));
          if (sel === arr[slotIdx]) setSel(null);
        } else if (sel) {
          if (arr.includes(sel)) return; // duplicate within same dostavba day

      function toggleRaceSundavac(date, name) {

      // ── Extra stavění handlers ────────────────────────────────────────────
      // Jeden termín = jedno extra. Rotace ani standardní karty se nemění.
      function addExtras({ venue, name, dates, sectors, slotCount, lano, lanoSlot }) {
        setExtras(cur => {
          const out = { ...cur };
          (dates || []).forEach(date => {
            const id = extraId(date, venue);
            out[id] = {
              id, date, venue, name: name || '',
              sectors: sectors || [], slotCount, lano: !!lano, lanoSlot: !!(lano && lanoSlot),
              setters: Array.from({ length: slotCount }, () => null),
              lanoSetter: null,
            };
          });
          return out;
        });
        setShowAddExtra(false);

      function toggleExtraLanoSlot(id) {

            return { ...cur, [id]: { ...c, lanoSlot: false, lanoSetter: null, slotCount, setters } };

      // ── Team management ───────────────────────────────────────────────────

      // Přidání hostujícího stavěče
      function confirmHost() {

      function deleteClimber(name) {
        if (!window.confirm(`Smazat „${name}" ze stavěčů?\n\nOdstraní se ze všech přiřazení (sloty, sundavači, mytí).`)) return;
        setTeam(t => t.filter(x => x !== name));
        if (sel === name) setSel(null);
        setData(d => {
          const out = {};
          for (const [k,w] of Object.entries(d)) {
            const nullify = v => v === name ? null : v;
            // Zachovej null (neměň null → [] — to dřív poškozovalo monSavedSetters
            // a přes _monShifted to mohlo smazat všechna stavění v kalendáři).
            const nullifyArr = a => a == null ? a : a.map(nullify);
            const filterArr = a => a == null ? a : a.filter(x => x !== name);
            out[k] = {
              ...w,
              monday:    nullifyArr(w.monday),
              mondayLano: nullify(w.mondayLano),
              wednesday: nullifyArr(w.wednesday),
              thursday:  nullifyArr(w.thursday),
              mondaySundavaci: filterArr(w.mondaySundavaci),
              mondayMyti: nullify(w.mondayMyti),
              wednesdaySundavaci: filterArr(w.wednesdaySundavaci),
              wednesdayMyti: nullify(w.wednesdayMyti),
              // preserve saved/cancelled arrays too
              monSavedSetters: nullifyArr(w.monSavedSetters),
              monSavedLano: nullify(w.monSavedLano),
              monSavedSundavaci: filterArr(w.monSavedSundavaci),
              monSavedMyti: nullify(w.monSavedMyti),
              wedSavedSetters: nullifyArr(w.wedSavedSetters),
              wedSavedSundavaci: filterArr(w.wedSavedSundavaci),
              wedSavedMyti: nullify(w.wedSavedMyti),
              monCancelledSetters: nullifyArr(w.monCancelledSetters),
              monCancelledLano: nullify(w.monCancelledLano),
              monCancelledSundavaci: filterArr(w.monCancelledSundavaci),
              monCancelledMyti: nullify(w.monCancelledMyti),
              wedCancelledSetters: nullifyArr(w.wedCancelledSetters),
              wedCancelledSundavaci: filterArr(w.wedCancelledSundavaci),
              wedCancelledMyti: nullify(w.wedCancelledMyti),

          }
          return out;
        });
        // Vyčisti smazaného i ze závodů a dostaveb (dialog to slibuje).
        setRaces(rs => {
          const nul = v => v === name ? null : v;
          const nulArr = a => a == null ? a : a.map(nul);
          const filArr = a => a == null ? a : a.filter(x => x !== name);
          const out = {};
          for (const [k, r] of Object.entries(rs)) {
            out[k] = {
              ...r,
              setters:   nulArr(r.setters),
              sundavaci: filArr(r.sundavaci),
              myti:      nul(r.myti),
              dostavba:  (r.dostavba || []).map(d => ({ ...d, setters: nulArr(d.setters) })),
            };
          }
          return out;
        });
        // …a z extra stavění
        setExtras(es => {
          const out = {};
          for (const [k, e] of Object.entries(es)) {
            out[k] = {
              ...e,
              setters: e.setters == null ? e.setters : e.setters.map(v => v === name ? null : v),
              lanoSetter: e.lanoSetter === name ? null : e.lanoSetter,

      // ── Drag ──────────────────────────────────────────────────────────────
      function onDragStartPool(name) { setDrag({ from:'pool', climber:name }); setSel(null); }
      function onDropPool() {

        const v = [curView, ...monthViews].find(x => x.key === drag.key)
          || (drag.key ? buildWeekView(Math.round((new Date(drag.key + 'T12:00:00') - getMonday(new Date())) / 604800000)) : null);
        if (v && drag.from === 'slot') v.remove(drag.session, drag.idx);
